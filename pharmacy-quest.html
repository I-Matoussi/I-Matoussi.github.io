<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Labyrinth of Remedies · Dr. Phil Better's Pharmacy Quest</title>
<meta name="description" content="A pharmacology, pharmacy and medical English quest: walk the labyrinth from easy to legendary, earn a badge for every chamber and a final diploma.">
<meta name="theme-color" content="#0a171b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0a171b; --deep:#10262b; --teal:#1b4a4e;
  --moss:#7fb497; --gold:#e6bd62; --gold-deep:#b98a2e;
  --parch:#f5ecd7; --ink:#1c2929;
  --good:#2f7d5b; --good-soft:#dcefe3; --bad:#b4513a; --bad-soft:#f6e1d9;
  --acc:#e6bd62;
  --serif:"Cormorant Garamond","Palatino Linotype",Georgia,serif;
  --sans:"Karla",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#0a171b}
body{
  font-family:var(--sans);font-size:17px;line-height:1.55;color:#e9efe9;min-height:100vh;
  background:
    radial-gradient(1000px 600px at 78% -10%, rgba(230,189,98,.13), transparent 60%),
    radial-gradient(1000px 600px at 78% -10%, color-mix(in srgb, var(--acc) 16%, transparent), transparent 60%),
    radial-gradient(900px 700px at -10% 110%, rgba(35,91,95,.55), transparent 60%),
    linear-gradient(180deg,#0b1b1f,#0a171b 60%,#081316);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;transition:background 1s;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 22px 60px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0 20px}
.brand{display:flex;align-items:center;gap:12px}
.sigil{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(230,189,98,.5);background:radial-gradient(circle at 35% 30%,#1f5357,#0f2a2e);color:var(--gold);font-family:var(--serif);font-style:italic;font-size:24px}
.brand b{display:block;font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.2px;line-height:1.1}
.brand span{font-size:12.5px;color:#9fb5ae;letter-spacing:.14em;text-transform:uppercase}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.pill{border:1px solid rgba(230,189,98,.35);border-radius:999px;padding:4px 12px;font-size:13px;color:#cfdcd5;white-space:nowrap}
.pill b{color:var(--gold);font-weight:700}
.lanterns{display:flex;gap:6px;align-items:center}
.lanterns small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9fb5ae;margin-right:4px}
.lan{width:22px;height:30px}
.lan .glass{fill:rgba(230,189,98,0);stroke:rgba(230,189,98,.35);stroke-width:1.4}
.lan .flame{fill:#2a3a3a;transition:fill .5s}
.lan.on .flame{fill:var(--gold);filter:drop-shadow(0 0 5px rgba(230,189,98,.9))}
.lan.on .glass{stroke:var(--gold);fill:rgba(230,189,98,.18)}
.round{width:38px;height:38px;border-radius:50%;border:1px solid rgba(230,189,98,.45);background:transparent;color:var(--gold);display:grid;place-items:center;font-size:17px}
.round[aria-pressed="false"]{opacity:.55}
.mapbtn{display:none;border:1px solid rgba(230,189,98,.45);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--gold)}

/* layout */
.grid{display:grid;grid-template-columns:372px 1fr;gap:34px;align-items:start}
.mappane{position:sticky;top:18px}
.maphead{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px}
.maphead h2{margin:0;font-family:var(--serif);font-size:22px;font-weight:600;color:var(--gold)}
.maphead span{font-size:13px;color:#9fb5ae}
.mapbox{border:1px solid rgba(230,189,98,.25);border-radius:22px;padding:6px;background:linear-gradient(180deg,rgba(16,38,43,.9),rgba(10,23,27,.9));box-shadow:0 30px 60px -30px rgba(0,0,0,.8), inset 0 0 70px rgba(35,91,95,.28)}
#map{display:block;width:100%;height:auto}
.stoneline{stroke:rgba(255,255,255,.035);stroke-width:1}
.wall{fill:none;stroke:#0a171b;stroke-width:6;stroke-linecap:round}
.wall2{fill:none;stroke:rgba(127,180,151,.38);stroke-width:1.6;stroke-linecap:round}
.corr{fill:none;stroke:rgba(27,74,78,.62);stroke-width:36;stroke-linejoin:round;stroke-linecap:round}
.rowtint{fill:none;stroke-width:34;stroke-linecap:round;opacity:.14}
.track{fill:none;stroke:rgba(230,189,98,.3);stroke-width:2.5;stroke-dasharray:2 7;stroke-linecap:round}
.thread{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(230,189,98,.7));transition:stroke-dasharray .9s ease}
.rlabel{font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:.04em}
.row-g{transition:opacity .8s}
.row-g.lock{opacity:.3}
.node{fill:#0b1d20;stroke:rgba(230,189,98,.55);stroke-width:1.6;transition:fill .4s,stroke .4s}
.node.ok{fill:var(--gold);stroke:#fff3cf}
.node.no{fill:var(--bad);stroke:#f1b9a8}
.node.cur{stroke:#fff3cf;stroke-width:2.4}
.pulse{fill:none;stroke:var(--gold);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}
.pulse.on{animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}
#tok{transition:transform .9s cubic-bezier(.5,.1,.2,1)}
.glow{fill:url(#tg)}
.torch{animation:flick 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{0%,100%{opacity:.9;transform:scale(1)}40%{opacity:.6;transform:scale(.88,1.1)}70%{opacity:1;transform:scale(1.06,.94)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 6px 0;font-size:12.5px;color:#9fb5ae}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* stage */
#stage{min-height:560px}
#stage>section{animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.panel{background:linear-gradient(180deg,rgba(16,38,43,.74),rgba(10,23,27,.74));border:1px solid rgba(230,189,98,.18);border-radius:24px;padding:34px 36px;box-shadow:0 40px 80px -40px rgba(0,0,0,.85)}
.eyebrow{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
h1,h2.big{font-family:var(--serif);font-weight:600;line-height:1.02;margin:10px 0 14px}
h1{font-size:clamp(40px,6vw,66px)}
h1 em{font-style:italic;color:var(--gold);font-weight:500}
h2.big{font-size:clamp(34px,5vw,54px)}
.lede{font-size:19px;color:#cfdcd5;max-width:58ch}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:14px 26px;font-weight:700;letter-spacing:.02em;background:linear-gradient(180deg,#f0c96f,#d9a63f);color:#2a1e06;box-shadow:0 10px 30px -10px rgba(230,189,98,.65);transition:transform .15s, box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 34px -10px rgba(230,189,98,.8)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid rgba(230,189,98,.55);box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.field{display:grid;gap:6px;margin-top:22px;max-width:380px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#9fb5ae}
.field input{padding:12px 16px;border-radius:12px;border:1px solid rgba(230,189,98,.4);background:rgba(255,255,255,.05);color:#fff;font-size:17px;letter-spacing:0;text-transform:none}
.field input::placeholder{color:#6f8680}

.ladder{list-style:none;margin:26px 0 8px;padding:0;display:grid;gap:8px}
.ladder li{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06)}
.ladder .no{font-family:var(--serif);font-size:20px;color:var(--gold);width:30px;text-align:center}
.ladder .nm{flex:1;font-weight:600}
.ladder .nm small{display:block;font-weight:400;color:#9fb5ae;font-size:13px}
.chip{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.d1{color:#8fd0a8}.d2{color:#b7d98a}.d3{color:#e6d067}.d4{color:#eaa35e}.d5{color:#e57d66}.d6{color:#d9a0f0}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 4px}
.rules div{padding:14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);font-size:14.5px;color:#cfdcd5}
.rules b{display:block;font-family:var(--serif);font-size:19px;color:var(--gold);margin-bottom:2px}

/* guide */
.guide{display:flex;gap:16px;align-items:flex-end;margin-bottom:18px}
.doc{width:96px;flex:none}
.bubble{position:relative;background:var(--parch);color:var(--ink);border-radius:18px 18px 18px 4px;padding:12px 16px;font-size:16px;line-height:1.4;max-width:48ch;box-shadow:0 12px 30px -16px rgba(0,0,0,.7)}
.bubble b{font-family:var(--serif);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-deep);display:block;margin-bottom:2px}

/* question card */
.card{background:linear-gradient(180deg,#f8f0dc,#f1e6cb);color:var(--ink);border-radius:22px;padding:30px 30px 26px;position:relative;box-shadow:0 30px 60px -30px rgba(0,0,0,.8);border-top:6px solid var(--acc)}
.card:before{content:"";position:absolute;inset:10px;border:1px solid rgba(185,138,46,.35);border-radius:15px;pointer-events:none}
.card.lockcard{background:linear-gradient(180deg,#eef3ee,#e1eae3)}
.qmeta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:#7b5c19;font-weight:700}
.qmeta .chip{font-size:11px;color:#6a5120}
.qtext{font-family:var(--serif);font-size:clamp(25px,3.2vw,33px);line-height:1.18;font-weight:600;margin:14px 0 20px}
.opts{display:grid;gap:10px;position:relative}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid rgba(28,41,41,.18);background:rgba(255,255,255,.55);color:var(--ink);font-size:17px;transition:transform .12s, border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--gold-deep);background:#fff;transform:translateX(3px)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:16px;background:var(--teal);color:var(--gold)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.fade{opacity:.55}
.fb{margin-top:18px;border-radius:14px;padding:14px 16px;background:#fff9e8;border:1px solid rgba(185,138,46,.35);animation:rise .35s ease}
.fb.good{background:var(--good-soft);border-color:rgba(47,125,91,.4)}
.fb.bad{background:var(--bad-soft);border-color:rgba(180,81,58,.4)}
.fb strong{font-family:var(--serif);font-size:20px;display:block;margin-bottom:2px}
.fb p{margin:0;font-size:16px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.word{margin-top:12px;border-radius:14px;padding:12px 14px;background:rgba(28,41,41,.06);border:1px dashed rgba(28,41,41,.32);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;animation:rise .45s ease}
.word .wl{grid-column:1/-1;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#7b5c19;font-weight:700}
.word b{font-family:var(--serif);font-size:23px;line-height:1.1}
.word i{grid-column:1;font-style:normal;color:#38504c;font-size:15.5px}
.listen{grid-row:2/4;grid-column:2;border:1px solid rgba(28,41,41,.3);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;color:var(--ink)}
.card .row{margin-top:18px}

/* interludes */
.roman{font-family:var(--serif);font-size:92px;line-height:1;color:var(--acc);font-weight:600}
.focus{display:inline-block;margin:4px 0 6px;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:14.5px;color:#cfdcd5}
.focus b{color:var(--acc)}
.stars{display:flex;gap:8px;margin:6px 0 0}
.award{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin:16px 0 4px}
.award svg.big{width:150px;height:180px;flex:none;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55));animation:pop .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-10deg)}to{opacity:1;transform:none}}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.badges svg{width:84px;height:101px}
.bars{display:grid;gap:12px;margin:22px 0}
.bar{display:grid;grid-template-columns:200px 1fr 56px;gap:12px;align-items:center;font-size:15px}
.bar .tr{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar .fl{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold-deep),var(--gold))}
.bar span:last-child{text-align:right;color:#cfdcd5}
.rank{font-family:var(--serif);font-size:clamp(34px,5vw,52px);color:var(--gold);font-weight:600;line-height:1.05;margin:6px 0 4px}
.review{display:grid;gap:10px;margin-top:16px}
.review details,.lex{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 16px}
.review summary,.lex summary{cursor:pointer;font-weight:600}
.review p{margin:8px 0 0;color:#cfdcd5;font-size:15.5px}
.review .ans{color:var(--moss)}
.lex{margin-top:14px}
.lex ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.lex li{font-size:15px;color:#cfdcd5}
.lex li b{color:var(--gold);font-family:var(--serif);font-size:18px;margin-right:6px}
.note{font-size:13.5px;color:#8ea39b;margin-top:26px}
footer{margin-top:40px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);font-size:13px;color:#8ea39b}

@media (max-width:960px){
  .grid{grid-template-columns:1fr}
  .mappane{position:static;display:none}
  .mappane.open{display:block}
  .mapbtn{display:inline-block}
  .panel{padding:26px 22px}
  .card{padding:24px 20px 22px}
  .bar{grid-template-columns:120px 1fr 44px;font-size:14px}
  .doc{width:74px}
  .rules{grid-template-columns:1fr}
}
@media (max-width:520px){
  body{font-size:16px}
  .wrap{padding:14px 14px 50px}
  .top{flex-wrap:wrap}
  .brand b{font-size:19px}
  .roman{font-size:70px}
  .award svg.big{width:120px;height:144px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ===== v3: refinement and interaction ===== */
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;z-index:0;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.wrap{position:relative;z-index:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold-deep),var(--acc));box-shadow:0 0 12px var(--acc);z-index:60;transition:width .9s ease}
.top{position:sticky;top:0;z-index:30;margin:0 -22px;padding:12px 22px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:linear-gradient(180deg,rgba(10,23,27,.94),rgba(10,23,27,.66));border-bottom:1px solid rgba(230,189,98,.12)}
.hud{position:relative}
.mappane{top:92px}
.pill.fire b{color:#ffb15a}
.round{transition:transform .15s,background .2s,border-color .2s}
.round:hover{transform:translateY(-1px);background:rgba(230,189,98,.12);border-color:var(--gold)}
.pop{position:absolute;top:50px;right:0;width:260px;padding:16px;border-radius:16px;background:linear-gradient(180deg,#12302f,#0c1d21);border:1px solid rgba(230,189,98,.35);box-shadow:0 24px 50px -16px rgba(0,0,0,.8);z-index:40;display:grid;gap:14px;font-size:14px;color:#cfdcd5}
.pop[hidden]{display:none}
.pop label{display:grid;gap:8px}
.pop input[type=range]{width:100%;accent-color:var(--gold)}
.fsrow{display:flex;align-items:center;gap:8px}
.fsrow span{flex:1}
.fsrow button{border:1px solid rgba(230,189,98,.45);background:transparent;color:var(--gold);border-radius:10px;padding:5px 12px;font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:70}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(430px,92vw);z-index:80;display:flex;flex-direction:column;background:linear-gradient(180deg,#10262b,#0a171b);border-left:1px solid rgba(230,189,98,.3);box-shadow:-30px 0 60px -20px rgba(0,0,0,.75);transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.drawer.open{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 12px}
.drawer header b{display:block;font-family:var(--serif);font-size:26px;color:var(--gold);line-height:1}
.drawer header small{color:#9fb5ae;font-size:13px}
.drawer input[type=search]{margin:0 22px 8px;padding:11px 16px;border-radius:12px;border:1px solid rgba(230,189,98,.35);background:rgba(255,255,255,.05);color:#fff;font-size:16px}
.drawer .list{overflow:auto;padding:8px 22px 34px;display:grid;gap:10px;align-content:start}
.drawer .item{border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
.drawer .ih{display:flex;justify-content:space-between;align-items:center;gap:10px}
.drawer .ih b{font-family:var(--serif);font-size:21px;color:#f5ecd7}
.drawer .item p{margin:4px 0 8px;font-size:15px;color:#cfdcd5}
.drawer .empty{color:#9fb5ae;padding:10px 2px}
.drawer .listen{grid-row:auto;grid-column:auto;background:transparent;color:var(--gold);border-color:rgba(230,189,98,.45);padding:4px 12px;font-size:13px}
.tip{position:fixed;z-index:90;pointer-events:none;max-width:230px;padding:7px 11px;border-radius:10px;background:#f5ecd7;color:#1c2929;font-size:13px;line-height:1.35;box-shadow:0 12px 28px -10px rgba(0,0,0,.7);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.tip.on{opacity:1;transform:none}
.node,.gate-hit{cursor:help}
.doc{animation:bob 4.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.talking .mouth{animation:talk .2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes talk{to{transform:scaleY(1.8)}}
.caret:after{content:"▍";opacity:.45;margin-left:1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.opt{position:relative;overflow:hidden}
.opt:active:not(:disabled){transform:scale(.99)}
.opt.gone{opacity:.22;text-decoration:line-through;pointer-events:none}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.ticks{display:flex;gap:6px;margin:12px 0 0}
.ticks i{width:24px;height:5px;border-radius:9px;background:rgba(28,41,41,.15);transition:background .3s}
.ticks i.ok{background:var(--good)}.ticks i.no{background:var(--bad)}
.ticks i.cur{background:var(--acc);box-shadow:0 0 0 1px rgba(28,41,41,.25)}
.btn.small{padding:9px 18px;font-size:14px}
.hintrow{margin-top:14px!important}
.hintrow .btn.ghost{color:#7b5c19;border-color:rgba(123,92,25,.5)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}
.mcol{display:grid;gap:10px;align-content:start}
.mbtn{text-align:left;padding:13px 15px;border-radius:14px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#e9efe9;font-size:15px;line-height:1.35;transition:transform .12s,border-color .15s,background .15s}
.mbtn:hover{border-color:var(--acc);background:rgba(255,255,255,.09)}
.mbtn.term{font-family:var(--serif);font-size:21px;font-weight:600}
.mbtn.sel{border-color:var(--acc);background:rgba(255,255,255,.15);transform:translateX(3px)}
.mbtn.done{border-color:var(--good);background:rgba(47,125,91,.28);pointer-events:none}
.mbtn.bad{animation:shake .4s;border-color:var(--bad);background:rgba(180,81,58,.25)}
@media (max-width:960px){.top{margin:0 -22px;position:static;backdrop-filter:none;background:transparent;border-bottom:0}.match{grid-template-columns:1fr}.mappane{top:0}}
@media (max-width:520px){.top{margin:0 -14px;padding:10px 14px}}

/* ===== v4: hologram ===== */
canvas.holo{display:block;width:150px;height:190px;flex:none;animation:none;cursor:pointer;filter:drop-shadow(0 0 16px rgba(111,227,224,.28))}
.guide{align-items:center}
.bubble{transition:background .3s,border-color .3s}
.bubble.pos{background:#e4f5ea;border-left:5px solid var(--good)}
.bubble.neg{background:#f8e0d9;border-left:5px solid var(--bad)}
.bubble.pos b{color:var(--good)}.bubble.neg b{color:var(--bad)}
.introgrid{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;margin-top:6px}
canvas.holo.hero{width:300px;height:380px;filter:drop-shadow(0 0 34px rgba(111,227,224,.38))}
.sub{min-height:6.4em;font-family:var(--serif);font-size:clamp(25px,3vw,33px);line-height:1.2;color:#f5ecd7;margin:16px 0 4px;max-width:30ch}
.chk{display:flex;gap:10px;align-items:center;cursor:pointer}
.chk input{accent-color:var(--gold);width:18px;height:18px}
@media (max-width:960px){canvas.holo{width:112px;height:142px}.introgrid{grid-template-columns:1fr;justify-items:center;text-align:center}canvas.holo.hero{width:250px;height:316px}.sub{min-height:8em}}

/* English voice selection and word pronunciation */
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)); if(!vs.length)return null;
    const pref=[/Google UK English Male/i,/Daniel/i,/Ryan/i,/George/i,/Microsoft (David|Mark|Guy)/i,/Alex/i,/Fred/i,/Google US English/i,/Male/i];
    for(const p of pref){const v=vs.find(v=>p.test(v.name));if(v)return v}
    return vs.find(v=>/en-GB/i.test(v.lang))||vs[0];
  }catch(e){return null}
}
function speak(text){
  try{
    if(!("speechSynthesis" in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g,"").replace(/[“”]/g,""));
    const v=pickVoice(); if(v){u.voice=v;u.lang=v.lang}else u.lang="en-GB";
    u.rate=.9; speechSynthesis.speak(u);
  }catch(e){}
}

    g+=`<g class="row-g lock" id="row${i}"><text class="rlabel" x="${rowDir(i)>0?78:284}" y="${y-22}" text-anchor="${rowDir(i)>0?"start":"end"}" fill="${R.acc}">${R.no} · ${R.name}</text>`;
    NODES[i]=[];NODELEN[i]=[];
    for(let j=0;j<k;j++){
      const x=xs+(xe-xs)*(j+1)/(k+1);NODES[i][j]={x,y};NODELEN[i][j]=lenAt(x,y);
      g+=`<circle class="pulse" id="pu${i}_${j}" cx="${x}" cy="${y}" r="9"/><circle class="node" id="nd${i}_${j}" cx="${x}" cy="${y}" r="7.5"/>`;
    }

  });

  g+=`<g id="tok" style="transform:translate(${X0}px,${Y0}px)"><circle class="glow" r="26"/><circle r="9.5" fill="#fff3cf" stroke="#b98a2e" stroke-width="2"/><path d="M-3 -2 Q0 -8 3 -2 Q4 3 0 5 Q-4 3 -3 -2Z" fill="#c98a2a"/></g>`;
  svg.insertAdjacentHTML("beforeend",g); TOK=$("#tok");
}
function gateHTML(i){
  const R=REALMS[i], st=S.gate[i];
  if(st==="badge") return `<circle r="14" fill="${R.acc}" stroke="#fff3cf" stroke-width="2"/><circle r="10" fill="none" stroke="#0b1d20" stroke-width="1" opacity=".5"/><text y="5" text-anchor="middle" font-family="Georgia,serif" font-size="${R.no.length>2?9:12}" font-weight="700" fill="#0b1d20">${R.no==="✦"?"★":R.no}</text>`;
  if(st==="open") return `<circle r="13" fill="#0b1d20" stroke="${R.acc}" stroke-width="2"/><path d="M-4 3 V-2 Q-4 -7 0 -7 Q4 -7 4 -4" fill="none" stroke="${R.acc}" stroke-width="1.8" stroke-linecap="round"/><rect x="-5" y="2" width="10" height="7" rx="1.5" fill="${R.acc}"/>`;
  return `<circle r="13" fill="#0b1d20" stroke="rgba(230,189,98,.55)" stroke-width="1.8" stroke-dasharray="3 2.5"/><path d="M-3.5 1 V-3 Q-3.5 -7 0 -7 Q3.5 -7 3.5 -3 V1" fill="none" stroke="rgba(230,189,98,.8)" stroke-width="1.8" stroke-linecap="round"/><rect x="-5" y="0" width="10" height="8" rx="1.5" fill="rgba(230,189,98,.8)"/>`;
}
function updateMap(){
  REALMS.forEach((R,i)=>{
    const row=$("#row"+i); if(row)row.classList.toggle("lock",!(i<=S.maxR));
    $("#gate"+i).innerHTML=gateHTML(i);
    R.q.forEach((q,j)=>{
      const n=$("#nd"+i+"_"+j),p=$("#pu"+i+"_"+j); if(!n)return;
      const v=S.res[i][j], isCur=(S.screen==="question"&&S.r===i&&S.i===j);
      n.setAttribute("class","node"+(v==="ok"?" ok":v==="no"?" no":"")+(isCur?" cur":""));
      p.setAttribute("class","pulse"+(isCur?" on":""));
    });
  });
  let pos={x:X0,y:Y0},len=0;
  if(S.screen==="question"||S.screen==="out"){pos=NODES[S.r][S.i];len=NODELEN[S.r][S.i]}
  else if(S.screen==="lock"||S.screen==="lockres"||S.screen==="match"||S.screen==="cleared"){pos=GATEPOS[S.r];len=GATELEN[S.r]}
  else if(S.screen==="realm"){const R=S.r;pos={x:NODES[R][0].x-(rowDir(R)>0?34:-34),y:NODES[R][0].y};len=RSTART[R]}
  else if(S.screen==="final"){for(let i=REALMS.length-1;i>=0;i--){if(S.gate[i]){pos=GATEPOS[i];len=GATELEN[i];break}}}
  TOK.style.transform=`translate(${pos.x}px,${pos.y}px)`;
  THREAD.style.strokeDasharray=Math.max(0,len)+" "+TOTAL;
  $("#mapnote").textContent=S.screen==="start"?"Six chambers, rising":(S.screen==="final"?"Your walk":"Chamber "+REALMS[Math.min(S.r,REALMS.length-1)].no+" of "+REALMS.length);
}

}

function question(){
  const R=REALMS[S.r], Q=R.q[S.i];
  if(!S.cur||S.cur.r!==S.r||S.cur.i!==S.i){S.cur={r:S.r,i:S.i,opts:shuffle(Q.o.map((t,k)=>({t,ok:k===0}))),pick:null};S.done=false}
  const said=S.done?S.cur.said:(S.i===0?"Here we go. Read slowly, then answer.":"Next corridor. Mind the walls.");
  stage.innerHTML=`<section>
    ${guide("Dr. Phil Better",said,S.mood)}
    <div class="card">
      <div class="qmeta"><span>${R.no} · ${R.name} · ${S.i+1}/${R.q.length}</span><span class="chip d${R.d}">${R.tone}</span></div>
      ${ticks()}<div class="qtext">${Q.q}</div>
      <div class="opts" id="opts">${S.cur.opts.map((o,k)=>`<button class="opt${S.cur.gone&&S.cur.gone.includes(k)?" gone":""}"${S.cur.gone&&S.cur.gone.includes(k)?" disabled":""} data-k="${k}"><span class="k">${"ABCD"[k]}</span><span>${o.t}</span></button>`).join("")}</div>

  if(S.done)return;

  S.done=true;S.cur.pick=k;S.lex.set(S.r+"-"+Q.w[0],Q.w);
  if(o.ok){S.res[S.r][S.i]="ok";S.streak++;S.mood="grin";S.cur.said=fill(SAY.streak[S.streak]||pick(SAY.right));AU.sfx("good")}
  else{S.res[S.r][S.i]="no";S.streak=0;S.lan=Math.max(0,S.lan-1);S.mood="oops";S.cur.said=fill(pick(SAY.wrong));AU.sfx("bad")}
  drawHud();updateMap();showFeedback(false);
  if(o.ok){const ob=document.querySelectorAll(".opt")[k];if(ob){const rr=ob.getBoundingClientRect();burst(rr.left+50,rr.top+rr.height/2,["#e6bd62","#fff3cf","#8fd0a8"],30,"spark")}}
}
function bindListen(){document.querySelectorAll(".listen").forEach(b=>b.onclick=()=>speak(b.dataset.say))}

/* ---- the English Gate Lock ---- */

function score(i){const att=S.res[i].filter(Boolean).length,ok=S.res[i].filter(v=>v==="ok").length;return{ok,all:REALMS[i].q.length,att}}

  stage.innerHTML=`<section class="panel">

      </div>

  const dl=$("#dlb");if(dl)dl.onclick=()=>download(badgeSVG(S.r,true).replace("<svg ",'<svg width="600" height="720" '),600,720,"badge-"+R.level.toLowerCase().replace(/\s+/g,"-")+".png");

}

function out(){
  const R=REALMS[S.r];S.mood="oops";
  stage.innerHTML=`<section class="panel">
    <div class="eyebrow">Darkness</div>
    <h2 class="big">The lanterns have gone out</h2>
    <p class="lede">You are lost in <i>${R.name}</i>. The thread is still in your hand: retrace this chamber with fresh lanterns and the questions will come again in a new order.</p>
    ${guide("Dr. Phil Better","Do not lose heart. Every pharmacist I know got lost here once. Walk it again, and read the explanations closely this time.","oops")}
    <div class="row"><button class="btn" id="retry">Retrace the chamber ➜</button><button class="btn ghost" id="leave">${R.bonus?"Leave the vault":"End my walk here"}</button></div>

function rankFor(p){
  if(p>=.9)return["Grand Master of the Labyrinth","Dr. Phil would trust you with his own prescription pad."];
  if(p>=.75)return["Master Pharmacist","A confident walk with a few scuffs. Review the notes below and you will shine."];
  if(p>=.6)return["Seasoned Explorer","You know the corridors. A second walk will tighten the weak spots."];
  return["Apprentice of the Labyrinth","Every master was lost here once. Read the notes below and walk again."];
}
function final(){
  let ok=0,att=0,tot=0;
  for(let i=0;i<MAIN;i++){const s=score(i);ok+=s.ok;att+=s.att;tot+=s.all}
  const p=att?ok/att:0,[title,sub]=rankFor(p),bonus=score(MAIN),bonusTried=bonus.att>0;

  const scoreTxt=`${ok}/${att} in the main labyrinth`;
  const bestP=+store.get("labyrinth-best-pct")||0; if(p>=bestP&&att){store.set("labyrinth-best",scoreTxt+" ("+title+")");store.set("labyrinth-best-pct",p)}

  const nb=S.gate.filter(g=>g==="badge").length;
  const lex=[...S.lex.values()];
  stage.innerHTML=`<section class="panel">
    <div class="eyebrow">Your diagnosis</div>
    <div class="rank">${title}</div>
    <p class="lede">${ok} of ${att} answered correctly in the main labyrinth${att<tot?" (the walk ended early)":""}. ${sub}</p>
    ${guide("Dr. Phil Better",p>=.75?"Excellent check-up, colleague. Side effects: confidence, and a lasting urge to read the formulary.":"A useful check-up. The notes below are your prescription: read them, then walk again.",S.mood)}
    <div class="eyebrow">Badges · ${nb} of ${REALMS.length} · Linguist stars · ${S.ling.filter(Boolean).length}</div>
    <div class="badges">${REALMS.map((R,i)=>badgeSVG(i,S.gate[i]==="badge")).join("")}</div>
    <div class="bars">
      ${REALMS.map((R,i)=>{const s=score(i);if(R.bonus&&!bonusTried)return"";const w=s.att?Math.round(100*s.ok/s.all):0;return`<div class="bar"><span>${R.no} ${R.name.replace(/^The /,"")}</span><div class="tr"><div class="fl" style="width:${w}%"></div></div><span>${s.att?s.ok+"/"+s.all:"–"}</span></div>`}).join("")}
    </div>
    <details class="lex"><summary>Your medical English lexicon · ${lex.length} words</summary><ul>${lex.map(w=>`<li><b>${esc(w[0])}</b>${esc(w[1])}</li>`).join("")||"<li>No words collected yet.</li>"}</ul></details>
    ${missed.length?`<div class="eyebrow" style="margin-top:22px">Review the chart · ${missed.length} to revisit</div><div class="review">${missed.map(m=>`<details><summary>${m.R.no} · ${m.q.q}</summary><p><span class="ans">Answer: ${m.q.o[0]}</span></p><p>${m.q.e}</p></details>`).join("")}</div>`:`<p class="lede" style="margin-top:18px">No question missed. A clean sweep.</p>`}
    <div class="row"><button class="btn" id="dip">Download my diploma</button><button class="btn ghost" id="again">Walk the labyrinth again</button>${bonusTried?"":`<button class="btn ghost" id="vault">Try the Industry Vault ✦</button>`}</div>
  </section>`;
  AU.sfx("clear");if(p>=.75)setTimeout(()=>burst(innerWidth/2,innerHeight*.28,["#e6bd62","#fff3cf","#8fd0a8","#e57d66"],130,"confetti"),300);
  $("#dip").onclick=()=>download(diplomaSVG(S.name,title,scoreTxt,lex.length,S.ling.filter(Boolean).length),2400,1700,"labyrinth-diploma.png");
  $("#again").onclick=()=>{REALMS.forEach(R=>{R.q=shuffle(R.q)});resetRun();setScreen("start")};
  const v=$("#vault");if(v)v.onclick=()=>{S.r=MAIN;S.cur=null;S.lan=LANTERNS;setScreen("realm")};
}

/* =====================================================================
   v3: INTERACTION LAYER
   ===================================================================== */
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
let twTimer=null;
function typeAll(){
  clearInterval(twTimer);
  const el=document.querySelector(".tw"); if(!el)return;
  const full=el.textContent;
  Holo.say(full);
  if(REDUCED)return;
  el.textContent=""; el.classList.add("caret");
  let i=0; twTimer=setInterval(()=>{i++;el.textContent=full.slice(0,i);if(i>=full.length){clearInterval(twTimer);el.classList.remove("caret")}},22);
  const bub=el.closest(".bubble"); if(bub)bub.onclick=()=>{clearInterval(twTimer);el.textContent=full;el.classList.remove("caret")};
}
function ticks(){const R=REALMS[S.r];return `<div class="ticks" aria-hidden="true">${R.q.map((q,j)=>{const v=S.res[S.r][j];return `<i class="${v==="ok"?"ok":v==="no"?"no":j===S.i?"cur":""}"></i>`}).join("")}</div>`}
function useHint(){
  if(S.screen!=="question"||S.done||S.hint<1||!S.cur||S.cur.gone)return;
  const wrong=S.cur.opts.map((o,k)=>k).filter(k=>!S.cur.opts[k].ok);
  S.cur.gone=shuffle(wrong).slice(0,2); S.hint--; AU.sfx("click");
  const btns=document.querySelectorAll(".opt"); S.cur.gone.forEach(k=>{btns[k].classList.add("gone");btns[k].disabled=true});
  const hr=document.querySelector(".hintrow"); if(hr)hr.remove();
  const b=document.querySelector(".guide .bubble"); if(b){b.innerHTML='<b>Dr. Phil Better</b><span class="tw">Two doors are sealed. The answer lies behind one of the others. One hint per chamber, colleague.</span>';typeAll()}
}

/* word satchel (drawer) */
const drawer=$("#drawer"),scrim=$("#scrim");
function renderDrawer(){
  const q=($("#dq").value||"").toLowerCase(), list=$("#dlist");
  const items=[...S.lex.entries()].filter(([k,w])=>!q||(w[0]+" "+w[1]).toLowerCase().includes(q));
  $("#dcount").textContent=S.lex.size+" word"+(S.lex.size===1?"":"s")+" collected";
  list.innerHTML=items.length?items.map(([k,w])=>{const R=REALMS[+k.split("-")[0]];return `<div class="item"><div class="ih"><b>${esc(w[0])}</b><span class="chip d${R.d}">${R.no}</span></div><p>${esc(w[1])}</p><button class="listen" data-say="${esc(w[0])}">🔊 Listen</button></div>`}).join(""):`<p class="empty">${S.lex.size?"No word matches your search.":"Your satchel is empty. Answer a question to collect your first word."}</p>`;
  list.querySelectorAll(".listen").forEach(b=>b.onclick=()=>speak(b.dataset.say));
}
function openDrawer(){closePop();renderDrawer();drawer.classList.add("open");drawer.setAttribute("aria-hidden","false");scrim.classList.add("on");setTimeout(()=>$("#dq").focus({preventScroll:true}),320)}
function closeDrawer(){drawer.classList.remove("open");drawer.setAttribute("aria-hidden","true");scrim.classList.remove("on")}
$("#satbtn").onclick=openDrawer; scrim.onclick=closeDrawer; $("#dclose").onclick=closeDrawer; $("#dq").oninput=renderDrawer;

/* settings popover */
const pop=$("#pop");
function closePop(){pop.hidden=true;$("#setbtn").setAttribute("aria-expanded","false")}
$("#setbtn").onclick=e=>{e.stopPropagation();const open=pop.hidden;pop.hidden=!open;$("#setbtn").setAttribute("aria-expanded",open)};
document.addEventListener("click",e=>{if(!pop.hidden&&!pop.contains(e.target))closePop()});
$("#vol").value=Math.round(AU.getVol()*100);
$("#voice").checked=store.get("labyrinth-voice")!=="off"; $("#voice").onchange=e=>Holo.setVoice(e.target.checked);
$("#vol").oninput=e=>{AU.init();AU.setVol(e.target.value/100)};
const FS=[15,16,17,19,21]; let fi=FS.indexOf(+store.get("labyrinth-fs")); if(fi<0)fi=2;
function applyFs(){document.body.style.fontSize=FS[fi]+"px";store.set("labyrinth-fs",FS[fi])}
$("#fsm").onclick=()=>{fi=Math.max(0,fi-1);applyFs()}; $("#fsp").onclick=()=>{fi=Math.min(FS.length-1,fi+1);applyFs()}; applyFs();

/* map tooltips */
const tip=$("#tip");
function showTip(el,txt){const r=el.getBoundingClientRect();tip.textContent=txt;tip.style.left=Math.max(8,Math.min(innerWidth-240,r.left+r.width/2-110))+"px";tip.style.top=Math.max(8,r.top-46)+"px";tip.classList.add("on")}
function hideTip(){tip.classList.remove("on")}
function tipFor(t){
  if(t.classList&&t.classList.contains("node")){
    const m=/^nd(\d+)_(\d+)$/.exec(t.id); if(!m)return null; const i=+m[1],j=+m[2],R=REALMS[i],v=S.res[i][j];
    const w=[...S.lex.entries()].find(([k])=>false);
    return R.no+" · Question "+(j+1)+" of "+R.q.length+(v==="ok"?" · solved":v==="no"?" · missed":" · ahead");
  }
  const g=t.closest&&t.closest('g[id^="gate"]'); if(g){const i=+g.id.slice(4),R=REALMS[i],st=S.gate[i];
    return st==="badge"?R.level+" badge earned":st==="open"?"Gate open. Score "+Math.round(MASTER*100)+"% to win the "+R.level+" badge":"Gate "+R.no+": open it with the English Gate Lock"}
  return null;
}
const mapEl=$("#map");
mapEl.addEventListener("mouseover",e=>{const t=e.target.closest(".node,g[id^=gate]");if(!t)return;const txt=tipFor(t);if(txt)showTip(t,txt)});
mapEl.addEventListener("mouseout",hideTip);
mapEl.addEventListener("touchstart",e=>{const t=e.target.closest&&e.target.closest(".node,g[id^=gate]");if(!t)return;const txt=tipFor(t);if(txt){showTip(t,txt);setTimeout(hideTip,1800)}},{passive:true});

/* particles: drifting dust, sparks, confetti */
const fx=$("#fx"),fc=fx.getContext("2d"); let PART=[],DUST=[];
function sizeFx(){fx.width=innerWidth;fx.height=innerHeight}
addEventListener("resize",sizeFx); sizeFx();
if(!REDUCED)for(let i=0;i<44;i++)DUST.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.6+.4,vx:(Math.random()-.5)*.16,vy:-Math.random()*.26-.04,a:Math.random()*.45+.12});
function burst(x,y,cols,n,kind){
  if(REDUCED)return;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,conf=kind==="confetti",sp=conf?3+Math.random()*6:1.5+Math.random()*3.6;
    PART.push({x,y,vx:Math.cos(a)*sp*(conf?1.3:1),vy:Math.sin(a)*sp-(conf?5:1),g:conf?.2:.06,l:1,d:conf?.007:.022,c:cols[i%cols.length],w:conf?5+Math.random()*6:2+Math.random()*2.4,rot:Math.random()*6,vr:(Math.random()-.5)*.3,k:kind})}
}
function loop(){
  fc.clearRect(0,0,fx.width,fx.height);
  for(const d of DUST){d.x+=d.vx;d.y+=d.vy;if(d.y<-5){d.y=fx.height+5;d.x=Math.random()*fx.width}if(d.x<-5)d.x=fx.width+5;if(d.x>fx.width+5)d.x=-5;fc.fillStyle="rgba(230,189,98,"+d.a+")";fc.beginPath();fc.arc(d.x,d.y,d.r,0,6.3);fc.fill()}
  PART=PART.filter(p=>p.l>0);
  for(const p of PART){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.992;p.l-=p.d;p.rot+=p.vr;fc.globalAlpha=Math.max(0,Math.min(1,p.l*1.4));fc.fillStyle=p.c;
    if(p.k==="confetti"){fc.save();fc.translate(p.x,p.y);fc.rotate(p.rot);fc.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);fc.restore()}
    else{fc.beginPath();fc.arc(p.x,p.y,p.w,0,6.3);fc.fill()}}
  fc.globalAlpha=1; requestAnimationFrame(loop);
}
if(!REDUCED)loop();

/* Word Match mini-game (optional, after the Gate Lock) */
function startMatch(){
  const mine=[...S.lex.entries()].filter(([k])=>k.startsWith(S.r+"-")).map(([k,w])=>w);
  const pairs=shuffle(mine).slice(0,4).map((w,id)=>({id,t:w[0],d:w[1]}));
  if(pairs.length<2){setScreen("cleared");return}
  S.match={pairs,terms:shuffle(pairs),defs:shuffle(pairs),first:null,done:new Set(),miss:0};
  setScreen("match");
}
function match(){
  const R=REALMS[S.r],M=S.match,all=M.done.size===M.pairs.length;
  const btn=(p,side)=>`<button class="mbtn${side==="t"?" term":""}${M.done.has(p.id)?" done":""}" data-side="${side}" data-id="${p.id}">${esc(side==="t"?p.t:p.d)}</button>`;
  stage.innerHTML=`<section class="panel">
    <div class="eyebrow">Word Match · optional · ${R.no}</div>
    <h2 class="big">Match the words</h2>
    <p class="lede">Tap a word, then tap its meaning. Two mistakes or fewer earns the <b style="color:var(--gold)">★ Linguist star</b> of this chamber.</p>
    <div class="match"><div class="mcol">${M.terms.map(p=>btn(p,"t")).join("")}</div><div class="mcol">${M.defs.map(p=>btn(p,"d")).join("")}</div></div>
    ${all?guide("Dr. Phil Better",M.miss<=2?"Every word in its place. That is a Linguist star, colleague.":"All matched, with a few slips. Open your word satchel to review, and try again on the next walk.",M.miss<=2?"grin":"smile"):""}
    <div class="row">${all?'<button class="btn" id="nx">Cross the threshold ➜</button>':'<button class="btn ghost" id="skip">Skip the Word Match</button>'}</div>
  </section>`;
  stage.querySelectorAll(".mbtn").forEach(b=>b.onclick=()=>pickMatch(b));
  const nx=$("#nx"),sk=$("#skip"); if(nx){nx.onclick=()=>setScreen("cleared");nx.focus({preventScroll:true})} if(sk)sk.onclick=()=>setScreen("cleared");
  if(all)typeAll();
}
function pickMatch(b){
  const M=S.match,side=b.dataset.side,id=+b.dataset.id; if(b.classList.contains("done"))return;
  if(!M.first||M.first.side===side){stage.querySelectorAll(".mbtn.sel").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");M.first={side,id};AU.sfx("click");return}
  const other=stage.querySelector('.mbtn[data-side="'+M.first.side+'"][data-id="'+M.first.id+'"]'), ok=M.first.id===id;
  stage.querySelectorAll(".mbtn.sel").forEach(x=>x.classList.remove("sel")); M.first=null;
  if(ok){
    M.done.add(id);b.classList.add("done");if(other)other.classList.add("done");AU.sfx("good");
    const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,["#e6bd62","#8fd0a8","#fff3cf"],24,"spark");
    if(M.done.size===M.pairs.length){if(M.miss<=2)S.ling[S.r]=true;S.mood=M.miss<=2?"grin":"smile";if(M.miss<=2)AU.sfx("badge");match()}
  }else{M.miss++;AU.sfx("bad");[b,other].forEach(x=>{if(!x)return;x.classList.add("bad");setTimeout(()=>x.classList.remove("bad"),450)})}
}

/* ---- cinematic opening ---- */
function intro(){
  S.mood="smile"; const nm=S.name;
  const lines=[
    (nm?"Ah, "+nm+"! Welcome, welcome, come in.":"Ah, welcome, welcome, come in.")+" I am Doctor Phil Better, and I have been expecting you.",
    "Before you lies the Labyrinth of Remedies: six chambers, rising from simple to formidable.",
    "In each chamber I shall test your pharmacology. At each gate, your medical English. Both are the languages of medicine.",
    "Answer well, and I shall cheer you on, loudly. Answer badly, and I shall tease you, mercilessly. Shall we begin?"
  ];
  stage.innerHTML=`<section class="panel">
    <div class="eyebrow">Incoming transmission · hologram link established</div>
    <div class="introgrid"><canvas class="holo hero" width="600" height="760" role="img" aria-label="Dr. Phil Better, a three-dimensional hologram"></canvas>
    <div><h1>Doctor <em>Phil Better</em></h1><div class="sub" id="sub" aria-live="polite"></div>
    <div class="row"><button class="btn" id="begin" disabled>Begin the quest ➜</button><button class="btn ghost" id="skip">Skip the briefing</button></div></div></div>
  </section>`;
  const tok=++introTok, go=()=>{introTok++;Holo.stop();AU.sfx("click");setScreen("realm")};
  $("#begin").onclick=go; $("#skip").onclick=go;
  Holo.boot(); AU.sfx("boot");
  (async()=>{
    await wait(1800);
    for(let i=0;i<lines.length;i++){
      if(tok!==introTok)return; const sub=$("#sub"); if(!sub)return; sub.textContent=lines[i];
      Holo.setMood(i===0||i===3?"good":"idle"); await Holo.say(lines[i]); if(tok!==introTok)return; await wait(380);
    }
    if(tok===introTok){const b=$("#begin");if(b){b.disabled=false;b.focus({preventScroll:true})}}
  })();
}

/* keyboard: 1-4 or A-D answer */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeDrawer();closePop();return}
  if(e.metaKey||e.ctrlKey||e.altKey||(e.target&&e.target.tagName==="INPUT"))return;
  if(e.key.toLowerCase()==="h"&&S.screen==="question"&&!S.done){useHint();return}
  const m={"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3}[e.key.toLowerCase()]; if(m===undefined)return;
  if(S.screen==="question"&&!S.done&&S.cur&&S.cur.opts[m])answer(m);
  else if(S.screen==="lock"&&S.lock&&!S.lock.done&&S.lock.cur&&S.lock.cur[m])lockAnswer(m);
});

/* header buttons */
const sb=$("#snd");
function paintSnd(){sb.setAttribute("aria-pressed",AU.isOn());sb.textContent=AU.isOn()?"♪":"♪̸";sb.title=AU.isOn()?"Music on":"Music off"}
sb.onclick=()=>{AU.init();AU.setOn(!AU.isOn());paintSnd();if(AU.isOn())music()};
paintSnd();
$("#mapbtn").onclick=()=>{const p=$("#mappane"),o=p.classList.toggle("open");$("#mapbtn").setAttribute("aria-expanded",o);$("#mapbtn").textContent=o?"Hide map":"Map"};

if(location.hash==="#debug")window.__lab={S,REALMS,go:n=>setScreen(n),burst,Holo};
buildMap();render();
})();
</script>
