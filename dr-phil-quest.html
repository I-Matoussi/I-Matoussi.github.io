<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Labyrinth of Remedies · Dr. Phil Better's Pharmacy Quest</title>
<meta name="description" content="A pharmacology, pharmacy and medical English quest: walk the labyrinth from easy to legendary, earn a badge for every chamber and a final diploma.">
<meta name="theme-color" content="#0a171b">
<link rel="manifest" href="pq-manifest.webmanifest">
<link rel="icon" href="pq-icon-192.png">
<link rel="apple-touch-icon" href="pq-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dr. Phil Quest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0a171b; --deep:#10262b; --teal:#1b4a4e;
  --moss:#7fb497; --gold:#e6bd62; --gold-deep:#b98a2e;
  --parch:#f5ecd7; --ink:#1c2929;
  --good:#2f7d5b; --good-soft:#dcefe3; --bad:#b4513a; --bad-soft:#f6e1d9;
  --acc:#e6bd62;
  --serif:"Cormorant Garamond","Palatino Linotype",Georgia,serif;
  --sans:"Karla",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#0a171b}
body{
  font-family:var(--sans);font-size:17px;line-height:1.55;color:#e9efe9;min-height:100vh;
  background:
    radial-gradient(1000px 600px at 78% -10%, rgba(230,189,98,.13), transparent 60%),
    radial-gradient(1000px 600px at 78% -10%, color-mix(in srgb, var(--acc) 16%, transparent), transparent 60%),
    radial-gradient(900px 700px at -10% 110%, rgba(35,91,95,.55), transparent 60%),
    linear-gradient(180deg,#0b1b1f,#0a171b 60%,#081316);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;transition:background 1s;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 22px 60px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0 20px}
.brand{display:flex;align-items:center;gap:12px}
.sigil{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(230,189,98,.5);background:radial-gradient(circle at 35% 30%,#1f5357,#0f2a2e);color:var(--gold);font-family:var(--serif);font-style:italic;font-size:24px}
.brand b{display:block;font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.2px;line-height:1.1}
.brand span{font-size:12.5px;color:#9fb5ae;letter-spacing:.14em;text-transform:uppercase}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.pill{border:1px solid rgba(230,189,98,.35);border-radius:999px;padding:4px 12px;font-size:13px;color:#cfdcd5;white-space:nowrap}
.pill b{color:var(--gold);font-weight:700}
.lanterns{display:flex;gap:6px;align-items:center}
.lanterns small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9fb5ae;margin-right:4px}
.lan{width:22px;height:30px}
.lan .glass{fill:rgba(230,189,98,0);stroke:rgba(230,189,98,.35);stroke-width:1.4}
.lan .flame{fill:#2a3a3a;transition:fill .5s}
.lan.on .flame{fill:var(--gold);filter:drop-shadow(0 0 5px rgba(230,189,98,.9))}
.lan.on .glass{stroke:var(--gold);fill:rgba(230,189,98,.18)}
.round{width:38px;height:38px;border-radius:50%;border:1px solid rgba(230,189,98,.45);background:transparent;color:var(--gold);display:grid;place-items:center;font-size:17px}
.round[aria-pressed="false"]{opacity:.55}
.mapbtn{display:none;border:1px solid rgba(230,189,98,.45);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--gold)}

/* layout */
.grid{display:grid;grid-template-columns:372px 1fr;gap:34px;align-items:start}
.mappane{position:sticky;top:18px}
.maphead{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px}
.maphead h2{margin:0;font-family:var(--serif);font-size:22px;font-weight:600;color:var(--gold)}
.maphead span{font-size:13px;color:#9fb5ae}
.mapbox{border:1px solid rgba(230,189,98,.25);border-radius:22px;padding:6px;background:linear-gradient(180deg,rgba(16,38,43,.9),rgba(10,23,27,.9));box-shadow:0 30px 60px -30px rgba(0,0,0,.8), inset 0 0 70px rgba(35,91,95,.28)}
#map{display:block;width:100%;height:auto}
.stoneline{stroke:rgba(255,255,255,.035);stroke-width:1}
.wall{fill:none;stroke:#0a171b;stroke-width:6;stroke-linecap:round}
.wall2{fill:none;stroke:rgba(127,180,151,.38);stroke-width:1.6;stroke-linecap:round}
.corr{fill:none;stroke:rgba(27,74,78,.62);stroke-width:36;stroke-linejoin:round;stroke-linecap:round}
.rowtint{fill:none;stroke-width:34;stroke-linecap:round;opacity:.14}
.track{fill:none;stroke:rgba(230,189,98,.3);stroke-width:2.5;stroke-dasharray:2 7;stroke-linecap:round}
.thread{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(230,189,98,.7));transition:stroke-dasharray .9s ease}
.rlabel{font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:.04em}
.row-g{transition:opacity .8s}
.row-g.lock{opacity:.3}
.node{fill:#0b1d20;stroke:rgba(230,189,98,.55);stroke-width:1.6;transition:fill .4s,stroke .4s}
.node.ok{fill:var(--gold);stroke:#fff3cf}
.node.no{fill:var(--bad);stroke:#f1b9a8}
.node.cur{stroke:#fff3cf;stroke-width:2.4}
.pulse{fill:none;stroke:var(--gold);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}
.pulse.on{animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}
#tok{transition:transform .9s cubic-bezier(.5,.1,.2,1)}
.glow{fill:url(#tg)}
.torch{animation:flick 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{0%,100%{opacity:.9;transform:scale(1)}40%{opacity:.6;transform:scale(.88,1.1)}70%{opacity:1;transform:scale(1.06,.94)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 6px 0;font-size:12.5px;color:#9fb5ae}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* stage */
#stage{min-height:560px}
#stage>section{animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.panel{background:linear-gradient(180deg,rgba(16,38,43,.74),rgba(10,23,27,.74));border:1px solid rgba(230,189,98,.18);border-radius:24px;padding:34px 36px;box-shadow:0 40px 80px -40px rgba(0,0,0,.85)}
.eyebrow{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
h1,h2.big{font-family:var(--serif);font-weight:600;line-height:1.02;margin:10px 0 14px}
h1{font-size:clamp(40px,6vw,66px)}
h1 em{font-style:italic;color:var(--gold);font-weight:500}
h2.big{font-size:clamp(34px,5vw,54px)}
.lede{font-size:19px;color:#cfdcd5;max-width:58ch}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:14px 26px;font-weight:700;letter-spacing:.02em;background:linear-gradient(180deg,#f0c96f,#d9a63f);color:#2a1e06;box-shadow:0 10px 30px -10px rgba(230,189,98,.65);transition:transform .15s, box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 34px -10px rgba(230,189,98,.8)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid rgba(230,189,98,.55);box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.field{display:grid;gap:6px;margin-top:22px;max-width:380px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#9fb5ae}
.field input{padding:12px 16px;border-radius:12px;border:1px solid rgba(230,189,98,.4);background:rgba(255,255,255,.05);color:#fff;font-size:17px;letter-spacing:0;text-transform:none}
.field input::placeholder{color:#6f8680}

.ladder{list-style:none;margin:26px 0 8px;padding:0;display:grid;gap:8px}
.ladder li{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06)}
.ladder .no{font-family:var(--serif);font-size:20px;color:var(--gold);width:30px;text-align:center}
.ladder .nm{flex:1;font-weight:600}
.ladder .nm small{display:block;font-weight:400;color:#9fb5ae;font-size:13px}
.chip{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.d1{color:#8fd0a8}.d2{color:#b7d98a}.d3{color:#e6d067}.d4{color:#eaa35e}.d5{color:#e57d66}.d6{color:#d9a0f0}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 4px}
.rules div{padding:14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);font-size:14.5px;color:#cfdcd5}
.rules b{display:block;font-family:var(--serif);font-size:19px;color:var(--gold);margin-bottom:2px}

/* guide */
.guide{display:flex;gap:16px;align-items:flex-end;margin-bottom:18px}
.doc{width:96px;flex:none}
.bubble{position:relative;background:var(--parch);color:var(--ink);border-radius:18px 18px 18px 4px;padding:12px 16px;font-size:16px;line-height:1.4;max-width:48ch;box-shadow:0 12px 30px -16px rgba(0,0,0,.7)}
.bubble b{font-family:var(--serif);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-deep);display:block;margin-bottom:2px}

/* question card */
.card{background:linear-gradient(180deg,#f8f0dc,#f1e6cb);color:var(--ink);border-radius:22px;padding:30px 30px 26px;position:relative;box-shadow:0 30px 60px -30px rgba(0,0,0,.8);border-top:6px solid var(--acc)}
.card:before{content:"";position:absolute;inset:10px;border:1px solid rgba(185,138,46,.35);border-radius:15px;pointer-events:none}
.card.lockcard{background:linear-gradient(180deg,#eef3ee,#e1eae3)}
.qmeta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:#7b5c19;font-weight:700}
.qmeta .chip{font-size:11px;color:#6a5120}
.qtext{font-family:var(--serif);font-size:clamp(25px,3.2vw,33px);line-height:1.18;font-weight:600;margin:14px 0 20px}
.opts{display:grid;gap:10px;position:relative}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid rgba(28,41,41,.18);background:rgba(255,255,255,.55);color:var(--ink);font-size:17px;transition:transform .12s, border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--gold-deep);background:#fff;transform:translateX(3px)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:16px;background:var(--teal);color:var(--gold)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.fade{opacity:.55}
.fb{margin-top:18px;border-radius:14px;padding:14px 16px;background:#fff9e8;border:1px solid rgba(185,138,46,.35);animation:rise .35s ease}
.fb.good{background:var(--good-soft);border-color:rgba(47,125,91,.4)}
.fb.bad{background:var(--bad-soft);border-color:rgba(180,81,58,.4)}
.fb strong{font-family:var(--serif);font-size:20px;display:block;margin-bottom:2px}
.fb p{margin:0;font-size:16px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.word{margin-top:12px;border-radius:14px;padding:12px 14px;background:rgba(28,41,41,.06);border:1px dashed rgba(28,41,41,.32);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;animation:rise .45s ease}
.word .wl{grid-column:1/-1;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#7b5c19;font-weight:700}
.word b{font-family:var(--serif);font-size:23px;line-height:1.1}
.word i{grid-column:1;font-style:normal;color:#38504c;font-size:15.5px}
.listen{grid-row:2/4;grid-column:2;border:1px solid rgba(28,41,41,.3);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;color:var(--ink)}
.card .row{margin-top:18px}

/* interludes */
.roman{font-family:var(--serif);font-size:92px;line-height:1;color:var(--acc);font-weight:600}
.focus{display:inline-block;margin:4px 0 6px;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:14.5px;color:#cfdcd5}
.focus b{color:var(--acc)}
.stars{display:flex;gap:8px;margin:6px 0 0}
.award{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin:16px 0 4px}
.award svg.big{width:150px;height:180px;flex:none;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55));animation:pop .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-10deg)}to{opacity:1;transform:none}}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.badges svg{width:84px;height:101px}
.bars{display:grid;gap:12px;margin:22px 0}
.bar{display:grid;grid-template-columns:200px 1fr 56px;gap:12px;align-items:center;font-size:15px}
.bar .tr{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar .fl{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold-deep),var(--gold))}
.bar span:last-child{text-align:right;color:#cfdcd5}
.rank{font-family:var(--serif);font-size:clamp(34px,5vw,52px);color:var(--gold);font-weight:600;line-height:1.05;margin:6px 0 4px}
.review{display:grid;gap:10px;margin-top:16px}
.review details,.lex{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 16px}
.review summary,.lex summary{cursor:pointer;font-weight:600}
.review p{margin:8px 0 0;color:#cfdcd5;font-size:15.5px}
.review .ans{color:var(--moss)}
.lex{margin-top:14px}
.lex ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.lex li{font-size:15px;color:#cfdcd5}
.lex li b{color:var(--gold);font-family:var(--serif);font-size:18px;margin-right:6px}
.note{font-size:13.5px;color:#8ea39b;margin-top:26px}
footer{margin-top:40px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);font-size:13px;color:#8ea39b}

@media (max-width:960px){
  .grid{grid-template-columns:1fr}
  .mappane{position:static;display:none}
  .mappane.open{display:block}
  .mapbtn{display:inline-block}
  .panel{padding:26px 22px}
  .card{padding:24px 20px 22px}
  .bar{grid-template-columns:120px 1fr 44px;font-size:14px}
  .doc{width:74px}
  .rules{grid-template-columns:1fr}
}
@media (max-width:520px){
  body{font-size:16px}
  .wrap{padding:14px 14px 50px}
  .top{flex-wrap:wrap}
  .brand b{font-size:19px}
  .roman{font-size:70px}
  .award svg.big{width:120px;height:144px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ===== v3: refinement and interaction ===== */
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;z-index:0;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.wrap{position:relative;z-index:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold-deep),var(--acc));box-shadow:0 0 12px var(--acc);z-index:60;transition:width .9s ease}
.top{position:sticky;top:0;z-index:30;margin:0 -22px;padding:12px 22px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:linear-gradient(180deg,rgba(10,23,27,.94),rgba(10,23,27,.66));border-bottom:1px solid rgba(230,189,98,.12)}
.hud{position:relative}
.mappane{top:92px}
.pill.fire b{color:#ffb15a}
.round{transition:transform .15s,background .2s,border-color .2s}
.round:hover{transform:translateY(-1px);background:rgba(230,189,98,.12);border-color:var(--gold)}
.pop{position:absolute;top:50px;right:0;width:260px;padding:16px;border-radius:16px;background:linear-gradient(180deg,#12302f,#0c1d21);border:1px solid rgba(230,189,98,.35);box-shadow:0 24px 50px -16px rgba(0,0,0,.8);z-index:40;display:grid;gap:14px;font-size:14px;color:#cfdcd5}
.pop[hidden]{display:none}
.pop label{display:grid;gap:8px}
.pop input[type=range]{width:100%;accent-color:var(--gold)}
.fsrow{display:flex;align-items:center;gap:8px}
.fsrow span{flex:1}
.fsrow button{border:1px solid rgba(230,189,98,.45);background:transparent;color:var(--gold);border-radius:10px;padding:5px 12px;font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:70}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(430px,92vw);z-index:80;display:flex;flex-direction:column;background:linear-gradient(180deg,#10262b,#0a171b);border-left:1px solid rgba(230,189,98,.3);box-shadow:-30px 0 60px -20px rgba(0,0,0,.75);transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.drawer.open{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 12px}
.drawer header b{display:block;font-family:var(--serif);font-size:26px;color:var(--gold);line-height:1}
.drawer header small{color:#9fb5ae;font-size:13px}
.drawer input[type=search]{margin:0 22px 8px;padding:11px 16px;border-radius:12px;border:1px solid rgba(230,189,98,.35);background:rgba(255,255,255,.05);color:#fff;font-size:16px}
.drawer .list{overflow:auto;padding:8px 22px 34px;display:grid;gap:10px;align-content:start}
.drawer .item{border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.04)}
.drawer .ih{display:flex;justify-content:space-between;align-items:center;gap:10px}
.drawer .ih b{font-family:var(--serif);font-size:21px;color:#f5ecd7}
.drawer .item p{margin:4px 0 8px;font-size:15px;color:#cfdcd5}
.drawer .empty{color:#9fb5ae;padding:10px 2px}
.drawer .listen{grid-row:auto;grid-column:auto;background:transparent;color:var(--gold);border-color:rgba(230,189,98,.45);padding:4px 12px;font-size:13px}
.tip{position:fixed;z-index:90;pointer-events:none;max-width:230px;padding:7px 11px;border-radius:10px;background:#f5ecd7;color:#1c2929;font-size:13px;line-height:1.35;box-shadow:0 12px 28px -10px rgba(0,0,0,.7);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.tip.on{opacity:1;transform:none}
.node,.gate-hit{cursor:help}
.doc{animation:bob 4.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.talking .mouth{animation:talk .2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes talk{to{transform:scaleY(1.8)}}
.caret:after{content:"▍";opacity:.45;margin-left:1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.opt{position:relative;overflow:hidden}
.opt:active:not(:disabled){transform:scale(.99)}
.opt.gone{opacity:.22;text-decoration:line-through;pointer-events:none}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.ticks{display:flex;gap:6px;margin:12px 0 0}
.ticks i{width:24px;height:5px;border-radius:9px;background:rgba(28,41,41,.15);transition:background .3s}
.ticks i.ok{background:var(--good)}.ticks i.no{background:var(--bad)}
.ticks i.cur{background:var(--acc);box-shadow:0 0 0 1px rgba(28,41,41,.25)}

   {q:"Which term describes an unwanted effect of a medicine at normal doses?",o:["Adverse effect","Placebo effect","Therapeutic effect","Loading effect"],e:"An adverse effect is harmful and unintended. A therapeutic effect is the desired one."}
  ]},
 {no:"V",name:"The Heart of the Labyrinth",level:"Master",tone:"Hardest",d:5,acc:"#e57d66",theme:"heart",
  focus:"Clinical safety language",
  blurb:"The deepest chamber. Antidotes, toxicity and pharmacogenetics: the questions that decide a patient's night.",
  intro:"You have come far, colleague. This is the Heart. No tricks, only clinical judgement. Breathe, then answer.",
  q:[
   {q:"Which agent partly reverses the effect of heparin?",o:["Protamine sulfate","Vitamin K","Naloxone","Flumazenil"],e:"Protamine is positively charged and binds the negatively charged heparin. Vitamin K is the antidote for warfarin.",w:["antidote","a substance that counteracts a poison or an overdose"]},
   {q:"Toxicity of high-dose methotrexate is rescued with…",o:["Folinic acid (leucovorin)","Pyridoxine","Cyanocobalamin","Acetylcysteine"],e:"Methotrexate blocks dihydrofolate reductase. Leucovorin supplies the reduced folate downstream of the block.",w:["rescue therapy","treatment given to reduce the toxic effects of another drug"]},
   {q:"Which electrolyte disturbance most increases the risk of digoxin toxicity?",o:["Hypokalaemia","Hypernatraemia","Hyperphosphataemia","Hypermagnesaemia"],e:"Digoxin and potassium compete at the Na⁺/K⁺-ATPase: with less potassium, digoxin binds more. Diuretics are a common trigger.",w:["toxicity","the degree to which a substance can harm the body"]},
   {q:"Before starting abacavir, which test is recommended?",o:["HLA-B*57:01","HLA-B*15:02","CYP2C19 genotype","Serum lithium"],e:"HLA-B*57:01 carriers are at high risk of a severe hypersensitivity reaction to abacavir. HLA-B*15:02 relates to carbamazepine.",w:["hypersensitivity reaction","an exaggerated immune response to a drug"]},
   {q:"Which drugs can raise lithium levels by reducing its renal clearance?",o:["Thiazide diuretics and NSAIDs","Paracetamol","Oral iron","Calcium carbonate"],e:"Lithium is handled by the kidney much like sodium. With a narrow therapeutic index, even a modest rise can cause toxicity.",w:["renal clearance","the rate at which the kidneys remove a substance from the blood"]},
   {q:"Malignant hyperthermia triggered by volatile anaesthetics or succinylcholine is treated with…",o:["Dantrolene","Atropine","Neostigmine","Naloxone"],e:"Dantrolene blocks calcium release from the sarcoplasmic reticulum, stopping the runaway muscle hypermetabolism.",w:["malignant hyperthermia","a rare, life-threatening rise in body temperature triggered by certain anaesthetics"]},
   {q:"Acetylcysteine is the antidote for overdose of…",o:["Paracetamol", "Digoxin", "Warfarin", "Morphine"],e:"Acetylcysteine replenishes glutathione and protects the liver from the toxic metabolite NAPQI.",w:["antidote", "a substance that counteracts a poison or overdose"]},
   {q:"Flumazenil is used to reverse the effects of…",o:["Benzodiazepines", "Opioids", "Heparin", "Beta-blockers"],e:"It competitively blocks the benzodiazepine site on the GABA-A receptor. Naloxone is used for opioids.",w:["reversal agent", "a drug that cancels the effect of another drug"]},
   {q:"Which adverse effects are associated with long-term amiodarone?",o:["Thyroid disorders and pulmonary fibrosis", "Ototoxicity and nephrotoxicity", "Gingival hyperplasia and hirsutism", "Gout and hyperkalaemia"],e:"Amiodarone is rich in iodine and accumulates in tissues, so thyroid, lung, liver and eye effects need monitoring.",w:["pulmonary fibrosis", "scarring of the lung tissue that makes breathing difficult"]},
   {q:"Torsades de pointes is linked to prolongation of which ECG interval?",o:["The QT interval", "The PR interval", "The P wave", "The RR interval"],e:"Many drugs prolong the QT interval, such as some macrolides, antipsychotics and class III antiarrhythmics.",w:["QT interval", "the ECG interval that reflects ventricular repolarisation"]}
  ],
  lock:[
   {q:"To “titrate” a dose means to…",o:["Adjust it step by step to reach the desired effect","Stop it suddenly","Crush the tablet","Give it by injection"],e:"Titration = careful stepwise adjustment, usually guided by response or blood levels."},
   {q:"A patient has “overdosed”. This means they…",o:["Took more than the recommended dose","Missed a dose","Took the drug with water","Stored it incorrectly"],e:"An overdose is an excessive dose that can cause toxicity."},
   {q:"“Onset of action” refers to…",o:["How quickly a drug begins to work","How long a drug lasts","How a drug tastes","Where a drug is made"],e:"Onset = time to first effect. Duration = how long the effect lasts."}
  ]},
 {no:"VI",name:"The Hall of Centuries",level:"Historian",tone:"Scholar",d:3,acc:"#d6b36a",theme:"history",
  focus:"Historical and scientific vocabulary",
  blurb:"Walk through eight centuries of medicine and pharmacy. Each question opens with a headline from its time.",
  intro:"Welcome to the Hall of Centuries, colleague. Every great medicine began as a surprise. Read each headline, then judge the discovery.",
  q:[
   {h:"c. 1240 · Emperor orders physicians and apothecaries to work apart",q:"Around 1240, Emperor Frederick II decreed that apothecaries and physicians should be separate professions. Why is this seen as a milestone?",o:["It is often seen as the birth of pharmacy as an independent profession", "It created the first hospital in Europe", "It banned the use of all plant medicines", "It introduced compulsory vaccination"],e:"Separating the people who prescribe from the people who prepare medicines is a founding principle of modern pharmacy, and it still protects patients through a double check.",w:["apothecary", "an old word for a person who prepared and sold medicines; today, a pharmacist"]},
   {h:"1796 · Country doctor injects a boy with cowpox",q:"Edward Jenner's 1796 experiment introduced the first…",o:["Vaccine, against smallpox", "Antibiotic, against syphilis", "Anaesthetic, for surgery", "Antidepressant"],e:"Jenner showed that material from cowpox protected against smallpox. The word “vaccine” comes from the Latin vacca, a cow.",w:["vaccine", "a preparation that trains the immune system to recognise a disease"]},
   {h:"1846 · Boston surgeons operate on a patient who feels no pain",q:"At Massachusetts General Hospital in 1846, William Morton publicly demonstrated surgery under which agent?",o:["Ether", "Chloroform", "Penicillin", "Aspirin"],e:"The demonstration of ether anaesthesia opened modern surgery. Chloroform was introduced by James Simpson in 1847.",w:["anaesthesia", "loss of sensation, induced to allow painless medical procedures"]},
   {h:"1847 · Vienna doctor orders handwashing in the maternity ward",q:"Ignaz Semmelweis reduced deaths from puerperal fever in 1847 by introducing…",o:["Handwashing with a chlorinated lime solution before examining patients", "Antibiotics for all mothers", "Longer hospital stays", "Quarantine of newborn babies"],e:"Doctors were carrying infection from the autopsy room to the maternity ward. Hand disinfection sharply cut the death rate.",w:["antisepsis", "the use of chemicals to destroy germs on living tissue"]},
   {h:"1854 · London street pump handle removed to stop cholera",q:"John Snow traced the 1854 London cholera outbreak to a contaminated water pump. He is therefore considered a pioneer of…",o:["Epidemiology", "Pharmacology", "Surgery", "Dentistry"],e:"By mapping cases he showed that cholera spread through water, years before bacteria were accepted as its cause.",w:["epidemiology", "the study of how diseases spread and what determines their frequency in populations"]},
   {h:"1899 · Chemists launch a new painkiller in powder form",q:"Aspirin (acetylsalicylic acid), marketed by Bayer in 1899, is derived from salicin, a compound found in…",o:["Willow bark", "Cinchona bark", "Foxglove leaves", "Opium poppy"],e:"Willow bark had long been used for pain and fever. Chemists modified salicylic acid into a more tolerable form, acetylsalicylic acid.",w:["derivative", "a compound made by chemically modifying another compound"]},
   {h:"1921 · Toronto team extracts a hormone that keeps diabetics alive",q:"Banting, Best, Macleod and Collip's discovery of insulin transformed the treatment of…",o:["Diabetes mellitus", "Tuberculosis", "Epilepsy", "Pernicious anaemia"],e:"The first patient was treated in 1922. Before insulin, type 1 diabetes was fatal within months or years.",w:["hormone", "a chemical messenger produced by a gland and carried in the blood"]},
   {h:"1928 · Mould on a forgotten dish kills bacteria",q:"Fleming noticed in 1928 that a mould killed bacteria. Who developed penicillin into a usable medicine around 1940?",o:["Florey, Chain and the Oxford team", "Pasteur and Koch", "Banting and Best", "Salk and Sabin"],e:"Fleming made the observation, but the Oxford group purified penicillin, tested it and enabled mass production during the Second World War.",w:["antibiotic", "a medicine that kills or stops the growth of bacteria"]},
   {h:"1962 · Birth-defect tragedy forces tougher drug laws",q:"The thalidomide disaster of the early 1960s led to…",o:["Much stricter testing and proof of safety and efficacy before marketing", "A ban on all sedatives", "The end of generic medicines", "The first pharmacy schools"],e:"Thalidomide caused severe birth defects when taken in pregnancy. Regulators then demanded stronger evidence and better monitoring.",w:["teratogenic", "able to cause birth defects"]},
   {h:"1980 · World Health Assembly declares a disease gone for ever",q:"Which disease was declared eradicated worldwide by the WHO in 1980?",o:["Smallpox", "Polio", "Measles", "Cholera"],e:"Smallpox is the only human disease eradicated so far, thanks to a worldwide vaccination and surveillance campaign.",w:["eradication", "the permanent removal of a disease from the world"]},
   {h:"2020 · First mRNA vaccines authorised in record time",q:"What does an mRNA vaccine deliver into the body's cells?",o:["Instructions for making a viral protein that trains the immune system", "A weakened live virus", "Ready-made antibodies", "An antiviral enzyme"],e:"The cells briefly produce the antigen, and the immune system learns to recognise it. The mRNA is then broken down.",w:["antigen", "a substance that triggers an immune response"]}
  ],
  lock:[
   {q:"A “landmark” discovery is one that…",o:["Marks an important turning point", "Is made on a hill", "Is quickly forgotten", "Was made by accident only"],e:"A landmark study or discovery changes the way people think or practise."},
   {q:"To “isolate” a compound from a plant means to…",o:["Separate it from the other components", "Store it in a dark place", "Make the plant grow", "Taste it"],e:"Chemists isolate the active compound from extracts, as with morphine from opium or quinine from cinchona bark."},
   {q:"“Pioneer” in a sentence such as “She was a pioneer of vaccination” means…",o:["One of the first people to develop a new idea or method", "A person who opposes new ideas", "A pharmacist in a rural area", "An assistant of a famous doctor"],e:"Pioneers open the way for others."}
  ]},
 {no:"✦",name:"The Industry Vault",level:"Vault Keeper",tone:"Bonus",d:6,acc:"#d9a0f0",theme:"vault",bonus:true,
  focus:"Industry and regulatory English",
  blurb:"A hidden door beneath the Heart: how medicines are made, tested and monitored, and how a Tunisian manufacturer works.",
  intro:"You found the Vault! Quality, trials and pharmacovigilance live here, along with some Tunisian industry. Mind the dust.",
  q:[
   {q:"In pharmaceutical manufacturing, GMP stands for…",o:["Good Manufacturing Practice","General Medicines Protocol","Global Market Permit","Graded Medicine Purity"],e:"GMP is the quality system that ensures medicines are consistently produced and controlled to the standards required for their intended use.",w:["batch","a defined quantity of a medicine made in one production cycle"]},
   {q:"A bioequivalence study for a generic compares which parameters with the reference product?",o:["Rate and extent of absorption (Cmax and AUC)","Tablet colour and taste","Price and packaging","Shelf life of the tablets"],e:"Two products are bioequivalent when the rate (Cmax) and extent (AUC) of absorption of the active substance fall within accepted limits of each other.",w:["Cmax","the maximum concentration of a drug reached in the blood"]},
   {q:"Pharmacovigilance is the science and activity of…",o:["Detecting, assessing and preventing adverse effects and other drug-related problems","Setting the price of medicines","Synthesising new active substances","Training pharmacy technicians"],e:"It follows the safety of medicines after authorisation, collecting reports of adverse reactions to detect new risks.",w:["post-marketing surveillance","monitoring the safety of a medicine after it has been authorised"]},
   {q:"Which phase of clinical development typically first tests a new drug in a small group of people, often healthy volunteers, to study safety and kinetics?",o:["Phase I","Phase II","Phase III","Phase IV"],e:"Phase I explores safety, tolerability and pharmacokinetics. Phase II tests efficacy and dose in patients, Phase III confirms efficacy in large trials, Phase IV follows after marketing.",w:["clinical trial","a research study that tests a medicine in people"]},
   {q:"Phase III clinical trials are mainly designed to…",o:["Confirm efficacy and safety in large groups of patients","Find the first safe dose in volunteers","Monitor rare side effects after marketing","Synthesise the active substance"],e:"They are large, usually randomised and controlled, and provide the main evidence for marketing authorisation.",w:["randomised controlled trial","a study in which participants are randomly assigned to a treatment or a comparison group"]},
   {q:"Teriak, a major Tunisian pharmaceutical company, is a subsidiary of which group?",o:["The Kilani group","The Hikma group","The Pfizer group","The Poulina group"],e:"Teriak Laboratories belong to the Kilani group, which is also active in distribution and medical promotion.",w:["subsidiary","a company owned or controlled by a larger parent company"]},
   {q:"Teriak built its activity first through…",o:["Manufacturing under licence for multinational companies","Exporting raw medicinal herbs","Running retail pharmacies","Producing veterinary vaccines"],e:"It started with licensed manufacturing for multinational partners, then developed its own generic products.",w:["licensor","a company that grants another the right to make or sell its product"]},
   {q:"Five of Teriak's licensors rank among the top how many pharmaceutical companies in the world?",o:["Top eight","Top three","Top twenty","Top hundred"],e:"Teriak says that five of the multinational companies it manufactures for are among the world's top eight.",w:["marketing authorisation","official approval to sell a medicine in a country"]},
   {q:"A “Certificate of Analysis” (CoA) states…",o:["The test results of a specific batch against its specifications", "The price per box", "The results of clinical trials in patients", "The opening hours of the factory"],e:"A CoA shows that a batch was tested and met its quality specifications before release.",w:["batch", "a defined quantity of a product made in one production cycle"]},
   {q:"In pharmacovigilance, a “serious adverse event” includes…",o:["Death, hospitalisation, disability or a life-threatening event", "Any mild rash that resolves quickly", "Every complaint about taste", "A delay in delivery"],e:"Seriousness is based on the outcome for the patient, not on how common the event is.",w:["serious adverse event", "an untoward event causing death, hospitalisation, disability or a life-threatening situation"]},
   {q:"In manufacturing, “API” stands for…",o:["Active Pharmaceutical Ingredient", "Approved Patient Index", "Automated Packaging Instruction", "Applied Pharmacy Information"],e:"The API is the biologically active substance, which is made first and then formulated into the final dosage form.",w:["API", "active pharmaceutical ingredient: the substance that produces the therapeutic effect"]}
  ],
  lock:[
   {q:"A “recall” of a medicine batch means…",o:["It is withdrawn from the market because of a quality or safety problem","It is given a new price","It is approved for children","It is moved to another shelf"],e:"A recall removes affected batches from distribution and from patients."},
   {q:"A “package leaflet” is…",o:["The printed information for patients inside the medicine box","A sales brochure for doctors","A manufacturing record","An invoice"],e:"The package leaflet (patient information leaflet) explains how to use the medicine and its possible side effects."},
   {q:"The “shelf life” of a medicine is…",o:["The period during which it stays within quality specifications","The size of the pharmacy shelf","The time needed to make a batch","The duration of a treatment"],e:"After the expiry date, the manufacturer no longer guarantees the quality of the product."}
  ]}
];

const LAB=[{"id": "roots", "name": "Word Roots, Prefixes & Suffixes", "icon": "Ω", "blurb": "Build any medical word from its parts.", "items": [{"q": "The prefix “hyper-” means…", "o": ["Above normal, excessive", "Below normal", "Around", "Without"], "e": "Hypertension is high blood pressure.", "w": ["hyper-", "a prefix meaning above normal or excessive"]}, {"q": "“Hypoglycaemia” literally means…", "o": ["Low blood sugar", "High blood sugar", "Blood in the urine", "Sugar in the tissues"], "e": "Hypo- = below, glyc- = sugar, -aemia = in the blood.", "w": ["hypoglycaemia", "a condition of abnormally low blood glucose"]}, {"q": "The suffix “-itis” means…", "o": ["Inflammation", "Removal", "Tumour", "Pain relief"], "e": "Arthritis is inflammation of a joint; hepatitis is inflammation of the liver.", "w": ["-itis", "a suffix meaning inflammation"]}, {"q": "“Cardio-” refers to the…", "o": ["Heart", "Lungs", "Kidney", "Brain"], "e": "A cardiologist is a heart specialist.", "w": ["cardio-", "a prefix relating to the heart"]}, {"q": "The suffix “-ectomy” means…", "o": ["Surgical removal", "Surgical repair", "Examination", "Inflammation"], "e": "An appendectomy is the removal of the appendix.", "w": ["-ectomy", "a suffix meaning surgical removal"]}, {"q": "“Nephro-” relates to the…", "o": ["Kidney", "Nerve", "Liver", "Bone"], "e": "Nephrotoxic means harmful to the kidneys.", "w": ["nephro-", "a prefix relating to the kidney"]}, {"q": "“Bradycardia” is a heart rate that is…", "o": ["Abnormally slow", "Abnormally fast", "Irregular", "Absent"], "e": "Brady- = slow; tachy- = fast, so tachycardia is a fast heart rate.", "w": ["bradycardia", "an abnormally slow heart rate"]}, {"q": "In “hepatotoxic”, the root “hepat-” refers to the…", "o": ["Liver", "Heart", "Stomach", "Spleen"], "e": "Hepatotoxic drugs can damage the liver, for example in paracetamol overdose.", "w": ["hepatotoxic", "harmful to the liver"]}]}, {"id": "abbr", "name": "Abbreviations & Prescription Shorthand", "icon": "Rx", "blurb": "Read an order or a label without hesitation.", "items": [{"q": "“NPO” on a chart means…", "o": ["Nothing by mouth", "Normal pulse observed", "No pain observed", "New patient order"], "e": "From the Latin nil per os. It is used before surgery, for example.", "w": ["NPO", "nil per os: nothing by mouth"]}, {"q": "“STAT” in an order means…", "o": ["Immediately", "Once a day", "Only if needed", "After meals"], "e": "A stat dose must be given at once.", "w": ["STAT", "immediately"]}, {"q": "“h.s.” on a prescription means…", "o": ["At bedtime", "Every hour", "Half a dose", "With a snack"], "e": "From the Latin hora somni, at the hour of sleep.", "w": ["h.s.", "at bedtime"]}, {"q": "“a.c.” means…", "o": ["Before meals", "After coffee", "Twice a day", "As directed"], "e": "From the Latin ante cibum. After meals is p.c., post cibum.", "w": ["a.c.", "ante cibum: before meals"]}, {"q": "“IM” as a route of administration means…", "o": ["Intramuscular", "Intramural", "Intramedullary", "Immediate"], "e": "An IM injection is given into a muscle.", "w": ["IM", "intramuscular"]}, {"q": "“SL” as a route means…", "o": ["Sublingual, under the tongue", "Slow-release", "Skin lotion", "Single dose"], "e": "Sublingual glyceryl trinitrate acts quickly for angina.", "w": ["SL", "sublingual: under the tongue"]}, {"q": "“mg/kg” indicates a dose per…", "o": ["Kilogram of body weight", "Kilometre travelled", "Kilocalorie", "Kilogram of tablet"], "e": "Paediatric doses are often calculated in mg/kg.", "w": ["mg/kg", "milligrams of drug per kilogram of body weight"]}, {"q": "“PO” means…", "o": ["By mouth", "After operation", "Per organ", "Patient only"], "e": "From the Latin per os.", "w": ["PO", "per os: by mouth"]}]}, {"id": "patient", "name": "Talking to Patients", "icon": "💬", "blurb": "Say it simply, clearly and kindly.", "items": [{"q": "How would you explain “hypertension” to a patient?", "o": ["High blood pressure", "Low blood sugar", "A fast heartbeat", "A kind of headach function pickVoice(){
  try{

/* =====================================================================

   ===================================================================== */
const X0=54,X1=306,Y0=84,DY=80;
const NODES=[],NODELEN=[],RSTART=[],GATEPOS=[],GATELEN=[]; let PATH,THREAD,TOK,TOTAL=0;
const rowDir=i=>i%2===0?1:-1;
function roundPath(p,r){
  let d=`M ${p[0][0]} ${p[0][1]}`;
  for(let k=1;k<p.length-1;k++){
    const a=p[k-1],b=p[k],c=p[k+1],l1=Math.hypot(b[0]-a[0],b[1]-a[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]),rr=Math.min(r,l1/2,l2/2);
    const p1=[b[0]-(b[0]-a[0])/l1*rr,b[1]-(b[1]-a[1])/l1*rr],p2=[b[0]+(c[0]-b[0])/l2*rr,b[1]+(c[1]-b[1])/l2*rr];
    d+=` L ${p1[0]} ${p1[1]} Q ${b[0]} ${b[1]} ${p2[0]} ${p2[1]}`;
  }
  const z=p[p.length-1]; return d+` L ${z[0]} ${z[1]}`;
}
function buildMap(){
  const svg=$("#map"), pts=[];
  REALMS.forEach((R,i)=>{const y=Y0+i*DY;pts.push([rowDir(i)>0?X0:X1,y],[rowDir(i)>0?X1:X0,y])});
  const d=roundPath(pts,22), H=Y0+(REALMS.length-1)*DY+46;
  svg.setAttribute("viewBox","0 0 360 "+(H+14));
  let h=`<defs>
    <radialGradient id="tg"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".95"/><stop offset="1" stop-color="#e6bd62" stop-opacity="0"/></radialGradient>
    <radialGradient id="tch"><stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient></defs>`;
  // stone texture
  for(let y=34;y<H;y+=14) h+=`<path class="stoneline" d="M20 ${y} H340"/>`;
  for(let y=34,r=0;y<H;y+=14,r++) for(let x=20+(r%2?18:0);x<340;x+=36) h+=`<path class="stoneline" d="M${x} ${y} v14"/>`;
  // walls (dark body + light edge)
  h+=`<rect class="wall" x="18" y="28" width="324" height="${H-28}" rx="22"/><rect class="wall2" x="18" y="28" width="324" height="${H-28}" rx="22"/>`;
  for(let i=0;i<REALMS.length-1;i++){const y=Y0+i*DY+DY/2,dd=rowDir(i)>0?`M18 ${y} H268`:`M92 ${y} H342`;h+=`<path class="wall" d="${dd}"/><path class="wall2" d="${dd}"/>`;
    h+=`<g transform="translate(${rowDir(i)>0?150:210} ${y-2})"><g class="torch" style="animation-delay:${i*.37}s"><circle r="13" fill="url(#tch)"/><path d="M0 -9 Q5 -2 3 3 Q0 6 -3 3 Q-5 -2 0 -9Z" fill="#ffb84a"/><path d="M0 -4 Q2 0 1 2 Q0 3 -1 2 Q-2 0 0 -4Z" fill="#fff0b8"/><rect x="-1.5" y="3" width="3" height="6" fill="#6b4a2a"/></g></g>`}
  h+=`<path class="corr" d="${d}"/>`;
  REALMS.forEach((R,i)=>{const y=Y0+i*DY;h+=`<path class="rowtint" d="M ${X0} ${y} H ${X1}" style="stroke:${R.acc}"/>`});
  h+=`<path id="pth" class="track" d="${d}"/><path id="thr" class="thread" d="${d}"/>`;
  svg.innerHTML=h; PATH=$("#pth"); THREAD=$("#thr"); TOTAL=PATH.getTotalLength(); THREAD.style.strokeDasharray="0 "+TOTAL;
  const samples=[]; for(let s=0;s<=TOTAL;s+=2){const p=PATH.getPointAtLength(s);samples.push([s,p.x,p.y])}
  const lenAt=(x,y)=>{let best=0,bd=1e9;for(const q of samples){const dd=(q[1]-x)**2+(q[2]-y)**2;if(dd<bd){bd=dd;best=q[0]}}return best};
  let g="";
  REALMS.forEach((R,i)=>{
    const y=Y0+i*DY,k=R.q.length,xs=rowDir(i)>0?X0:X1,xe=rowDir(i)>0?X1:X0;
    RSTART[i]=lenAt(xs,y); GATEPOS[i]={x:xe,y}; GATELEN[i]=lenAt(xe,y);
    g+=`<g class="row-g lock" id="row${i}"><text class="rlabel" x="${rowDir(i)>0?78:284}" y="${y-22}" text-anchor="${rowDir(i)>0?"start":"end"}" fill="${R.acc}">${R.no} · ${R.name}</text>`;
    NODES[i]=[];NODELEN[i]=[];
    for(let j=0;j<k;j++){
      const x=xs+(xe-xs)*(j+1)/(k+1);NODES[i][j]={x,y};NODELEN[i][j]=lenAt(x,y);
      g+=`<circle class="pulse" id="pu${i}_${j}" cx="${x}" cy="${y}" r="9"/><circle class="node" id="nd${i}_${j}" cx="${x}" cy="${y}" r="7.5"/>`;
    }
    g+=`</g>`;
  });
  REALMS.forEach((R,i)=>{g+=`<g id="gate${i}" transform="translate(${GATEPOS[i].x} ${GATEPOS[i].y})"></g>`});
  g+=`<g id="tok" style="transform:translate(${X0}px,${Y0}px)"><circle class="glow" r="26"/><circle r="9.5" fill="#fff3cf" stroke="#b98a2e" stroke-width="2"/><path d="M-3 -2 Q0 -8 3 -2 Q4 3 0 5 Q-4 3 -3 -2Z" fill="#c98a2a"/></g>`;
  svg.insertAdjacentHTML("beforeend",g); TOK=$("#tok");
}
function gateHTML(i){
  const R=REALMS[i], st=S.gate[i];
  if(st==="badge") return `<circle r="14" fill="${R.acc}" stroke="#fff3cf" stroke-width="2"/><circle r="10" fill="none" stroke="#0b1d20" stroke-width="1" opacity=".5"/><text y="5" text-anchor="middle" font-family="Georgia,serif" font-size="${R.no.length>2?9:12}" font-weight="700" fill="#0b1d20">${R.no==="✦"?"★":R.no}</text>`;
  if(st==="open") return `<circle r="13" fill="#0b1d20" stroke="${R.acc}" stroke-width="2"/><path d="M-4 3 V-2 Q-4 -7 0 -7 Q4 -7 4 -4" fill="none" stroke="${R.acc}" stroke-width="1.8" stroke-linecap="round"/><rect x="-5" y="2" width="10" height="7" rx="1.5" fill="${R.acc}"/>`;

}
function updateMap(){
  REALMS.forEach((R,i)=>{
    const row=$("#row"+i); if(row)row.classList.toggle("lock",!(i<=S.maxR));
    $("#gate"+i).innerHTML=gateHTML(i);
    R.q.forEach((q,j)=>{

  let pos={x:X0,y:Y0},len=0;
  if(S.screen==="question"||S.screen==="out"){pos=NODES[S.r][S.i];len=NODELEN[S.r][S.i]}
  else if(S.screen==="lock"||S.screen==="lockres"||S.screen==="match"||S.screen==="cleared"){pos=GATEPOS[S.r];len=GATELEN[S.r]}

  TOK.style.transform=`translate(${pos.x}px,${pos.y}px)`;
  THREAD.style.strokeDasharray=Math.max(0,len)+" "+TOTAL;
  $("#mapnote").textContent=S.screen==="start"?"Seven chambers, rising":(S.screen==="final"?"Your walk":"Chamber "+REALMS[Math.min(S.r,REALMS.length-1)].no+" of "+REALMS.length);
}

/* particles: drifting dust, sparks, confetti */
const fx=$("#fx"),fc=fx.getContext("2d"); let PART=[],DUST=[];
function sizeFx(){fx.width=innerWidth;fx.height=innerHeight}
addEventListener("resize",sizeFx); sizeFx();
if(!REDUCED)for(let i=0;i<44;i++)DUST.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.6+.4,vx:(Math.random()-.5)*.16,vy:-Math.random()*.26-.04,a:Math.random()*.45+.12});
function burst(x,y,cols,n,kind){
  if(REDUCED)return;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,conf=kind==="confetti",sp=conf?3+Math.random()*6:1.5+Math.random()*3.6;
    PART.push({x,y,vx:Math.cos(a)*sp*(conf?1.3:1),vy:Math.sin(a)*sp-(conf?5:1),g:conf?.2:.06,l:1,d:conf?.007:.022,c:cols[i%cols.length],w:conf?5+Math.random()*6:2+Math.random()*2.4,rot:Math.random()*6,vr:(Math.random()-.5)*.3,k:kind})}
}
function loop(){
  fc.clearRect(0,0,fx.width,fx.height);
  for(const d of DUST){d.x+=d.vx;d.y+=d.vy;if(d.y<-5){d.y=fx.height+5;d.x=Math.random()*fx.width}if(d.x<-5)d.x=fx.width+5;if(d.x>fx.width+5)d.x=-5;fc.fillStyle="rgba(230,189,98,"+d.a+")";fc.beginPath();fc.arc(d.x,d.y,d.r,0,6.3);fc.fill()}
  PART=PART.filter(p=>p.l>0);
  for(const p of PART){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.992;p.l-=p.d;p.rot+=p.vr;fc.globalAlpha=Math.max(0,Math.min(1,p.l*1.4));fc.fillStyle=p.c;
    if(p.k==="confetti"){fc.save();fc.translate(p.x,p.y);fc.rotate(p.rot);fc.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);fc.restore()}
    else{fc.beginPath();fc.arc(p.x,p.y,p.w,0,6.3);fc.fill()}}
  fc.globalAlpha=1; requestAnimationFrame(loop);
}
if(!REDUCED)loop();

}
function labAnswer(k){
  const L=S.labs; if(L.done)return; const it=L.items[L.idx],ok=L.cur[k].ok;
  L.done=true; LEX2.set("L"+L.ri+"-"+it.w[0],it.w); drawHud();
  if(ok){L.ok++;AU.sfx("good");S.mood="grin"}else{AU.sfx("bad");S.mood="oops"}
  document.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(L.cur[i].ok)b.classList.add("right");else if(i===k)b.classList.add("wrong");else b.classList.add("fade")});
  const last=L.idx===LABN-1;
  $("#fb").innerHTML=`<div class="fb ${ok?"good":"bad"}"><strong>${ok?"Correct.":"Not quite."}</strong><p>${it.e}</p></div>${wordBlock(it.w)}<div class="row"><button class="btn" id="nx">${last?"See my result ➜":"Next ➜"}</button></div>`;
  Holo.react(ok?"good":"bad");
  const gb=document.querySelector(".guide .bubble");if(gb){const line=fill(ok?pick(SAY.right):pick(SAY.wrong));gb.className="bubble "+(ok?"pos":"neg");gb.innerHTML='<b>Dr. Phil Better</b><span class="tw">'+line+'</span>';typeAll()}
  bindListen();
  const chip=document.querySelector(".qmeta .chip");if(chip)chip.textContent="Score "+L.ok;
  $("#nx").onclick=()=>{if(last)setScreen("labres");else{L.idx++;L.cur=null;S.mood="smile";setScreen("labq")}};
  $("#nx").focus({preventScroll:true});
}
function labres(){
  const L=S.labs,R=LAB[L.ri],sc=L.ok,good=sc>=LABSTAR; S.mood=good?"grin":"oops";
  const b=labBest(); if(!(b[R.id]>=sc)){b[R.id]=sc;store.set("labyrinth-lab",JSON.stringify(b))}
  if(good)AU.sfx("unlock");
  const line=sc===LABN?"Perfect, "+(S.name||"colleague")+"! Flawless. I am wiping away a tear of pure light.":good?"Well done! A star for you. Bravo!":sc>=LABN/2?"Hmm. Half-way fluent. Even my stethoscope expected more.":"Oh dear. Back to the dictionary with you, and quickly.";
  stage.innerHTML=`<section class="panel">
    <div class="eyebrow">Result · ${R.name}</div>
    <h2 class="big">${sc} / ${LABN} ${good?"★":""}</h2>
    <p class="lede">${good?"You have earned a Linguist star for this rubric.":LABSTAR+" correct answers earn the star. Try again, the words are now in your satchel."}</p>
    ${guide("Dr. Phil Better",line,S.mood)}
    <div class="btnrow"><button class="btn" id="again">Try again</button><button class="btn ghost" id="other">Choose another rubric</button><button class="btn ghost" id="home">Back to the entrance</button></div>
  </section>`;
  if(good)burst(innerWidth/2,innerHeight/3,["#e6bd62","#fff3cf","#8fd0a8"],60,"confetti");
  $("#again").onclick=()=>labStart(L.ri);$("#other").onclick=()=>setScreen("lab");$("#home").onclick=()=>setScreen("start");
}
function gazette(){
  S.mood="smile"; let h="",cur="";
  HEADS.forEach(x=>{if(x[1]!==cur){cur=x[1];h+=`<h3>${cur}</h3>`}h+=`<div class="gz"><div class="yr">${x[0]}</div><div><b>${esc(x[2])}</b><p>${esc(x[3])}</p></div></div>`});
  stage.innerHTML=`<section class="panel gaz">
    <div class="eyebrow">The Labyrinth Gazette</div>
    <h1>Eight centuries <em>of medicine</em></h1>
    <p class="lede">Headlines from the history of medicine and pharmacy. The Hall of Centuries, chamber VI, tests what you read here.</p>
    ${guide("Dr. Phil Better","Every medicine on my shelf was once a headline. Read, then test yourself in the Hall of Centuries.","smile")}
    ${h}
    <div class="row" style="margin-top:20px"><button class="btn" id="back">Back to the entrance</button></div>
  </section>`;
  $("#back").onclick=()=>setScreen("start");
}
let deferredInstall=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e});
function showInstall(){
  const box=$("#instbox"); if(!box)return;
  if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null});return}
  box.innerHTML=`<div class="install"><b>Install as an app</b><ul>
    <li><b>Android (Chrome):</b> menu ⋮ → “Install app” or “Add to Home screen”.</li>
    <li><b>iPhone / iPad (Safari):</b> Share button → “Add to Home Screen”.</li>
    <li><b>Computer (Chrome or Edge):</b> click the install icon at the right of the address bar.</li></ul>
    <p style="margin:0 0 10px">After the first visit the game also works offline. You can also keep a copy as a single file:</p>
    <button class="btn ghost small" id="dl">⬇ Download the game file</button></div>`;
  $("#dl").onclick=async()=>{let t;try{t=await (await fetch(location.href.split("#")[0])).text()}catch(e){t="<!DOCTYPE html>\n"+document.documentElement.outerHTML}
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/html"}));a.download="dr-phil-quest.html";document.body.appendChild(a);a.click();a.remove()};
}
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){addEventListener("load",()=>navigator.serviceWorker.register("pq-sw.js").catch(()=>{}))}

/* ---- cinematic opening ---- */
function intro(){
  S.mood="smile"; const nm=S.name;
  const lines=[
    (nm?"Ah, "+nm+"! Welcome, welcome, come in.":"Ah, welcome, welcome, come in.")+" I am Doctor Phil Better, and I have been expecting you.",
    "Before you lies the Labyrinth of Remedies: six chambers, rising from simple to formidable.",
    "In each chamber I shall test your pharmacology. At each gate, your medical English. Both are the languages of medicine.",
    "Answer well, and I shall cheer you on, loudly. Answer badly, and I shall tease you, mercilessly. Shall we begin?"
  ];
  stage.innerHTML=`<section class="panel">
    <div class="eyebrow">A word from your guide</div>
    <div class="introgrid"><canvas class="holo hero" width="600" height="760" role="img" aria-label="Dr. Phil Better, a three-dimensional cartoon doctor"></canvas>
    <div><h1>Doctor <em>Phil Better</em></h1><div class="sub" id="sub" aria-live="polite"></div>
    <div class="row"><button class="btn" id="begin" disabled>Begin the quest ➜</button><button class="btn ghost" id="skip">Skip the briefing</button></div></div></div>
  </section>`;
  const tok=++introTok, go=()=>{introTok++;Holo.stop();AU.sfx("click");setScreen("realm")};
  $("#begin").onclick=go; $("#skip").onclick=go;
  Holo.boot(); AU.sfx("unlock");
  (async()=>{
    await wait(1800);
    for(let i=0;i<lines.length;i++){
      if(tok!==introTok)return; const sub=$("#sub"); if(!sub)return; sub.textContent=lines[i];
      Holo.setMood(i===0||i===3?"good":"idle"); await Holo.say(lines[i]); if(tok!==introTok)return; await wait(380);
    }
    if(tok===introTok){const b=$("#begin");if(b){b.disabled=false;b.focus({preventScroll:true})}}
  })();
}

/* keyboard: 1-4 or A-D answer */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeDrawer();closePop();return}
  if(e.metaKey||e.ctrlKey||e.altKey||(e.target&&e.target.tagName==="INPUT"))return;
  if(e.key.toLowerCase()==="h"&&S.screen==="question"&&!S.done){useHint();return}
  const m={"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3}[e.key.toLowerCase()]; if(m===undefined)return;
  if(S.screen==="question"&&!S.done&&S.cur&&S.cur.opts[m])answer(m);
  else if(S.screen==="lock"&&S.lock&&!S.lock.done&&S.lock.cur&&S.lock.cur[m])lockAnswer(m);
});

sb.onclick=()=>{AU.init();AU.setOn(!AU.isOn());paintSnd();if(AU.isOn())music()};
paintSnd();
$("#mapbtn").onclick=()=>{const p=$("#mappane"),o=p.classList.toggle("open");$("#mapbtn").setAttribute("aria-expanded",o);$("#mapbtn").textContent=o?"Hide map":"Map"};

if(location.hash==="#debug")window.__lab={S,REALMS,go:n=>setScreen(n),burst,Holo};
buildMap();render();
})();
