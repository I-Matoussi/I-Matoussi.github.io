<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Golden Dinar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:wght@400;500;700;800&family=Aref+Ruqaa:wght@700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: one-column game board on lapis night. Real photographs sit in gilded frames with a slow cinematic drift; drawn scenes stay underneath as a fallback. Splash → quest map → question card → medal. All text paired English / Arabic, switchable. */
:root{
  --lapis:#0b1f3a; --lapis-2:#122d52; --lapis-3:#1c3f6c; --ink:#07152a;
  --gold:#e0ac45; --gold-hi:#f6d27a; --gold-lo:#9c6c1d;
  --sand:#f1e4c8; --sand-dim:#b9ab8e;
  --teal:#2a9d8f; --pom:#d0503f;
  --display:"Marcellus","Palatino Linotype",Georgia,serif;
  --body:"Alegreya Sans","Gill Sans","Trebuchet MS",sans-serif;
  --arabic:"Noto Naskh Arabic","Amiri","Traditional Arabic","Arial",serif;
  --ruqaa:"Aref Ruqaa","Amiri","Traditional Arabic",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--lapis);color:var(--sand);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(circle at 50% -10%,var(--lapis-3),transparent 60%),
   repeating-conic-gradient(from 22.5deg at 50% 50%,rgba(224,172,69,.035) 0 45deg,transparent 45deg 90deg);
  background-size:auto,64px 64px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--lapis)}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.ar{font-family:var(--arabic);direction:rtl;unicode-bidi:isolate}
body.only-en .ar{display:none!important}
body.only-ar .en{display:none!important}
body.only-ar .q-ar{font-size:1.4rem}
.mosaic{height:12px;border-radius:2px;background-size:48px 12px;animation:slide 8s linear infinite;
  background-image:repeating-linear-gradient(90deg,var(--gold) 0 10px,var(--lapis) 10px 12px,var(--teal) 12px 22px,var(--lapis) 22px 24px,var(--sand) 24px 34px,var(--lapis) 34px 36px,var(--pom) 36px 46px,var(--lapis) 46px 48px);}
@keyframes slide{to{background-position:48px 0}}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;cursor:pointer}
.brand h1,.splash h1{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.02em;line-height:1.1;
  background:linear-gradient(100deg,var(--gold-lo) 0%,var(--gold-hi) 30%,#fff7d6 45%,var(--gold-hi) 60%,var(--gold) 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
.brand h1{font-size:1.55rem}
@keyframes shine{from{background-position:120% 0}to{background-position:-130% 0}}
.brand .ruq{font-family:var(--ruqaa);color:var(--gold);font-size:1.1rem;line-height:1.3;direction:rtl}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--gold-lo);border-radius:999px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 10px;font-weight:800;font-size:.85rem;color:var(--sand-dim)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.seg button:focus-visible,.iconbtn:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.iconbtn{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;border:1px solid var(--gold-lo);display:grid;place-items:center;color:var(--gold-hi)}
.iconbtn svg{width:18px;height:18px}
.purse{display:flex;align-items:center;gap:8px;background:var(--lapis-2);border:1px solid var(--gold-lo);border-radius:999px;padding:5px 14px 5px 5px;font-weight:800;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.purse svg{width:28px;height:28px;animation:coinspin 4s linear infinite}
@keyframes coinspin{0%,70%{transform:rotateY(0)}85%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.purse.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.2);box-shadow:0 0 18px var(--gold)}}

/* photos */
.photo{position:relative;overflow:hidden;aspect-ratio:16/8;max-width:100%;background:var(--ink);display:block}
.photo .svgfb,.photo .svgfb svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease;animation:kenburns 20s ease-in-out infinite alternate;max-width:none}
.photo img.in{opacity:1}
@keyframes kenburns{from{transform:scale(1.05) translate(0,0)}to{transform:scale(1.18) translate(-2.5%,-1.5%)}}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,21,42,0) 40%,rgba(7,21,42,.88));pointer-events:none;z-index:1}
.photo .sheen{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(105deg,transparent 42%,rgba(255,232,170,.22) 50%,transparent 58%);transform:translateX(-120%);animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.photo .cap{position:absolute;left:12px;right:12px;bottom:8px;z-index:3;display:flex;flex-direction:column;font-size:.78rem;line-height:1.35;color:var(--sand);opacity:0;transition:opacity .8s .4s}
.photo .cap .ar{font-size:.85rem;color:var(--gold-hi)}
.photo.ok .cap{opacity:1}
.photo .chip-era{position:absolute;top:10px;left:10px;z-index:3;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;background:rgba(7,21,42,.7);border:1px solid var(--gold-lo);color:var(--gold-hi);padding:3px 8px;border-radius:999px}
.frame{border:2px solid var(--gold-lo);box-shadow:0 0 0 4px var(--ink),0 0 0 5px var(--gold-lo),0 10px 30px rgba(0,0,0,.45)}

/* splash */
.splash{position:relative;border-radius:14px;overflow:hidden;min-height:420px;display:grid;align-items:end}
.splash .slides{position:absolute;inset:0}
.splash .slides .svgfb,.splash .slides .svgfb svg{position:absolute;inset:0;width:100%;height:100%}
.splash .slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;max-width:none;animation:slideshow 24s linear infinite,kenburns 24s ease-in-out infinite alternate}
@keyframes slideshow{0%{opacity:0}4%,25%{opacity:1}30%,100%{opacity:0}}
.splash::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,21,42,.15),rgba(7,21,42,.55) 45%,rgba(7,21,42,.96));z-index:1}
.splash-in{position:relative;z-index:2;padding:28px 22px 26px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.splash h1{font-size:clamp(2.2rem,8vw,3.4rem)}
.splash .ruq{font-family:var(--ruqaa);font-size:clamp(1.8rem,7vw,2.6rem);color:var(--gold);direction:rtl;line-height:1.2;animation:rise .8s .2s both}
.splash p{margin:0;max-width:52ch}
.splash .medallion{width:82px;height:82px;animation:spinslow 22s linear infinite}
@keyframes spinslow{to{transform:rotate(360deg)}}
.btn.big{font-size:1.15rem;padding:15px 30px;animation:glowpulse 2.2s ease-in-out infinite}
@keyframes glowpulse{50%{box-shadow:0 3px 0 var(--gold-lo),0 0 26px rgba(246,210,122,.7)}}

/* intro, sections, tiles */
.intro{display:flex;flex-direction:column;gap:6px}
.intro p{margin:0;max-width:62ch}
.intro b{color:var(--gold-hi)}
.intro .ar{font-size:1rem;color:var(--sand-dim)}
.sect{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--lapis-3);padding-bottom:4px}
.sect h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.15rem;color:var(--gold-hi)}
.sect .ar{font-family:var(--ruqaa);color:var(--gold);font-size:1.15rem}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{all:unset;cursor:pointer;display:flex;flex-direction:column;background:var(--lapis-2);border:1px solid var(--lapis-3);border-radius:10px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;animation:rise .55s both}
.tile .photo{aspect-ratio:16/10}
.tile .photo img{animation:none;transform:scale(1.02);transition:opacity 1.2s ease,transform 1.2s ease}
.tile:hover,.tile:focus-visible{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 10px 24px rgba(0,0,0,.4),0 0 0 1px var(--gold-lo)}
.tile:hover .photo img,.tile:focus-visible .photo img{transform:scale(1.12)}
.tile:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
@keyframes rise{from{transform:translateY(16px);opacity:.15}}
.tile .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.tile .span{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sand-dim)}
.tile .name{font-family:var(--display);font-size:1.06rem;color:var(--sand);line-height:1.2}
.tile .name-ar{font-size:1rem;color:var(--gold);line-height:1.5}
.tile .medal{font-size:.8rem;font-weight:700;color:var(--sand-dim);display:flex;align-items:center;gap:6px;margin-top:4px}
.dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--lapis-3);border:1px solid var(--sand-dim)}
.dot.gold{background:var(--gold);border-color:var(--gold-hi);box-shadow:0 0 8px var(--gold);animation:pulse 1.6s ease-in-out infinite} .dot.silver{background:#c9cfd6;border-color:#eef} .dot.bronze{background:#b0703a;border-color:#d9955a}

/* buttons */
.btn{all:unset;cursor:pointer;text-align:center;font-weight:800;padding:12px 20px;border-radius:999px;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink);box-shadow:0 3px 0 var(--gold-lo);transition:transform .1s;line-height:1.3}
.btn .ar{display:block;font-weight:700;font-size:.92em}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-lo)}
.btn:focus-visible{outline:2px solid var(--sand);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--gold-hi);border:1px solid var(--gold-lo);box-shadow:none;animation:none}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* quiz card */
.card{background:var(--lapis-2);border:1px solid var(--lapis-3);border-radius:12px;overflow:hidden;animation:cardin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes cardin{from{transform:translateY(16px) scale(.97);opacity:.2}}
.card > .photo{aspect-ratio:16/8}
.qbody{padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sand-dim);flex-wrap:wrap}
.streak{color:var(--gold-hi);font-weight:800;letter-spacing:.06em;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.bars{display:flex;flex-direction:column;gap:5px}
.progress,.timer{height:6px;background:var(--ink);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));transition:width .5s}
.timer i{display:block;height:100%;background:var(--teal);width:100%}
.timer.low i{background:var(--pom);animation:pulse .5s infinite}
.qtext{display:flex;flex-direction:column;gap:4px}
.q{font-family:var(--display);font-weight:400;font-size:1.3rem;line-height:1.3;margin:0;text-wrap:balance}
.q-ar{font-family:var(--arabic);direction:rtl;font-size:1.2rem;line-height:1.7;margin:0;color:var(--gold-hi);font-weight:600}
.opts{display:grid;gap:10px}
.opt{all:unset;cursor:pointer;padding:10px 14px;border-radius:8px;background:var(--ink);border:1px solid var(--lapis-3);display:flex;align-items:center;gap:12px;transition:border-color .15s,background .15s,transform .15s;animation:optin .45s both}
@keyframes optin{from{transform:translateX(-18px);opacity:0}}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;border:1px solid var(--gold-lo);color:var(--gold)}
.opt .txt{display:flex;flex-direction:column;min-width:0;flex:1}
.opt .txt .en{font-weight:600}
.opt .txt .ar{color:var(--sand-dim);font-size:.98rem;line-height:1.5}
.opt:hover:not([disabled]){border-color:var(--gold);transform:translateX(4px)}
.opt:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.right{background:color-mix(in srgb,var(--teal) 32%,var(--ink));border-color:var(--teal);animation:pop .45s;box-shadow:0 0 18px rgba(42,157,143,.45)}
.opt.wrong{background:color-mix(in srgb,var(--pom) 28%,var(--ink));border-color:var(--pom);animation:shake .45s}
.opt.gone{opacity:.2;transform:scale(.97)}
@keyframes pop{50%{transform:scale(1.05)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.slots{display:grid;gap:8px}
.slot{min-height:48px;border:1px dashed var(--gold-lo);border-radius:8px;display:flex;align-items:center;gap:10px;padding:6px 12px;color:var(--sand-dim)}
.slot .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ink);font-weight:800;display:grid;place-items:center;font-size:.8rem}
.slot.filled{border-style:solid;background:var(--ink);color:var(--sand);cursor:pointer;animation:pop .3s}
.slot.filled.right{border-color:var(--teal)} .slot.filled.wrong{border-color:var(--pom)}
.slot .yr{margin-left:auto;font-weight:800;color:var(--gold-hi);font-variant-numeric:tabular-nums;white-space:nowrap}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;background:var(--lapis-3);border:1px solid var(--lapis-3);display:flex;flex-direction:column;line-height:1.35;max-width:100%;animation:optin .4s both}
.chip .ar{font-size:.92rem;color:var(--gold)}
.chip:hover{border-color:var(--gold)} .chip:focus-visible{outline:2px solid var(--gold-hi)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{all:unset;cursor:pointer;font-size:.85rem;font-weight:700;color:var(--gold-hi);border:1px dashed var(--gold-lo);padding:6px 12px;border-radius:999px;line-height:1.35;text-align:center}
.hint .ar{display:block;font-size:.9em}
.hint[disabled]{opacity:.35;cursor:default}
.hint:focus-visible{outline:2px solid var(--gold-hi)}
.feedback{border-radius:10px;border:1px solid var(--lapis-3);background:var(--ink);display:flex;flex-direction:column;overflow:hidden;animation:cardin .4s}
.feedback .fb-in{padding:14px;display:flex;flex-direction:column;gap:6px}
.feedback .reveal{aspect-ratio:16/9;clip-path:circle(0% at 50% 50%);animation:iris 1s .15s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes iris{to{clip-path:circle(75% at 50% 50%)}}
.feedback .quip{font-weight:800;font-size:1.04rem}
.feedback .quip .ar{display:block;font-weight:700}
.feedback.ok{border-color:var(--teal)} .feedback.no{border-color:var(--pom)}
.feedback.ok .quip{color:var(--gold-hi)} .feedback.no .quip{color:#f08a7c}
.feedback .fact{color:var(--sand);font-size:.97rem;max-width:62ch}
.feedback .fact.ar{font-size:1rem;line-height:1.8}
.feedback .fact b{color:var(--gold-hi)}
.feedback .gain{font-size:.88rem;color:var(--sand-dim)}
.feedback .gain strong{color:var(--gold-hi);font-size:1.05rem}

/* effects */
.burst{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.burst svg{position:absolute;left:0;top:0;width:26px;height:26px}
.burst i{position:absolute;width:8px;height:12px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.floater{position:fixed;z-index:21;pointer-events:none;font-weight:800;color:var(--gold-hi);font-size:1.4rem;text-shadow:0 2px 8px rgba(0,0,0,.6);animation:floatup 1.2s ease-out forwards}
@keyframes floatup{to{transform:translateY(-70px);opacity:0}}

/* result */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 18px;position:relative}
.medalwrap{position:relative;width:200px;height:200px;display:grid;place-items:center}
.rays{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(246,210,122,.35) 0 8deg,transparent 8deg 20deg);animation:spinslow 14s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.bigmedal{position:relative;width:150px;height:150px;animation:spinin 1.2s ease-out}
@keyframes spinin{from{transform:rotateY(720deg) scale(.2);opacity:0}}
.result h2{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0;color:var(--gold-hi);text-wrap:balance}
.result p{margin:0;max-width:52ch}
.rank{font-family:var(--ruqaa);font-size:1.4rem;color:var(--gold)}
.small{font-size:.85rem;color:var(--sand-dim)}
span.en+span.ar{margin-left:.45em}
.bankp>span{display:block}
.bankp>span.ar{margin-left:0;margin-top:4px}
.result p>span,.credits p>span,.result>.small>span{display:block}
.result p>span.ar{margin:2px 0 0}
.statrow{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:center}
.stat b{font-size:1.4rem;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.credits{font-size:.8rem;color:var(--sand-dim)}
.credits summary{cursor:pointer;font-weight:700;color:var(--gold-hi)}
.credits ul{margin:8px 0;padding-left:18px;columns:2;column-gap:20px}
.credits li{break-inside:avoid;margin-bottom:3px}
.credits a{color:var(--sand)}
footer{font-size:.8rem;color:var(--sand-dim);text-align:center;display:flex;flex-direction:column;gap:2px}
@media (max-width:460px){.tiles{gap:10px}.tile .name{font-size:.95rem}.q{font-size:1.18rem}.q-ar{font-size:1.1rem}.credits ul{columns:1}.brand h1{font-size:1.3rem}}


/* English learning */
.learn{border-top:1px solid var(--lapis-3);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.learn .lhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;background:var(--teal);color:var(--ink);padding:3px 9px;border-radius:999px}
.gram .badge{background:var(--gold)}
.newwords{font-size:.82rem;color:var(--gold-hi);font-weight:700;animation:pulse 1.1s 3}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:8px}
.wcard{background:var(--lapis-2);border:1px solid var(--lapis-3);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;animation:optin .4s both}
.wcard.locked{opacity:.45;border-style:dashed;align-items:center;justify-content:center;min-height:84px}
.wtop{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ww{font-weight:800;color:var(--gold-hi);font-size:1.02rem}
.pos{font-size:.72rem;color:var(--sand-dim);font-style:italic}
.say{all:unset;cursor:pointer;margin-inline-start:auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--gold-hi);border:1px solid var(--gold-lo)}
.say:hover{background:var(--gold);color:var(--ink)}
.say:focus-visible{outline:2px solid var(--gold-hi)}
.war{font-family:var(--arabic);color:var(--sand);font-size:1rem}
.wdef{font-size:.86rem;color:var(--sand-dim)}
.gram strong{color:var(--sand)}
.gram .inq{font-size:.88rem;color:var(--sand-dim)}
.gram mark{background:rgba(224,172,69,.22);color:var(--gold-hi);padding:0 4px;border-radius:3px}
.gram > .en,.gram > .ar{font-size:.94rem}
.bankbtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;border:1px solid var(--gold-lo);background:linear-gradient(120deg,var(--lapis-2),var(--lapis-3));color:var(--gold-hi);transition:transform .2s,box-shadow .2s}
.bankbtn:hover,.bankbtn:focus-visible{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.bankbtn:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.bankbtn svg{flex:none}
.bankbtn .bt{display:flex;flex-direction:column;font-weight:800;color:var(--sand);min-width:0}
.bankbtn .bt .small{font-weight:400}
.bank{margin-top:4px}



.wctx{font-size:.84rem;color:var(--sand);font-style:italic;border-left:2px solid var(--gold-lo);padding-left:8px;margin-top:3px}
.wctx b{color:var(--gold-hi);font-style:normal}
/* navigation */
.wrap{transition:opacity .23s ease,transform .23s ease}
.wrap.leaving{opacity:0;transform:translateY(10px)}
.navrow .btn:first-child{flex:1 1 220px}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(5,14,28,.72);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}}
.sheetcard{max-width:420px;width:100%;background:var(--lapis-2);border:2px solid var(--gold-lo);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:cardin .3s cubic-bezier(.2,.8,.2,1)}
.sheetcard h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.35rem;color:var(--gold-hi)}
.sheetcard h3>span,.sheetcard p>span{display:block}
.sheetcard h3>span.ar,.sheetcard p>span.ar{margin-left:0;margin-top:2px}
.sheetcard p{margin:0;color:var(--sand)}

/* drawn-scene animations (fallback art) */
.a-wave{animation:wave 7s linear infinite}
@keyframes wave{to{transform:translateX(-80px)}}
.a-bob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
.a-glow{animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{opacity:.7}}
.a-twinkle{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.15}}
.a-sway{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(4deg)}}
.a-fly{animation:flyacross 12s linear infinite}
@keyframes flyacross{from{transform:translateX(-60px)}to{transform:translateX(380px)}}
.a-flag{animation:flag 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes flag{50%{transform:skewY(-4deg) scaleX(.96)}}
.a-fall{animation:petal 6s linear infinite}
@keyframes petal{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(200px) rotate(300deg)}}
.a-spin{animation:spin 18s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.a-flame{animation:flame .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flame{to{transform:scale(.85,1.12) skewX(4deg)}}
.a-page{animation:page 5s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes page{0%,40%{transform:scaleX(1)}60%,100%{transform:scaleX(-1)}}
.a-ink{stroke-dasharray:300;stroke-dashoffset:300;animation:ink 5s ease-in-out infinite}
@keyframes ink{60%,100%{stroke-dashoffset:0}}
.a-stamp{animation:stamp 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes stamp{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.a-ink{stroke-dashoffset:0}.photo img{opacity:1}.feedback .reveal{clip-path:none}.splash .slides img:first-of-type{opacity:1}}

{id:"figures",kind:"special",name:"Great Figures",nameAr:"أعلام تونس",span:"Thinkers, poets, pioneers",qs:[
 M("Which early Christian writer was born in Carthage around 155 CE?","أي كاتب مسيحي مبكر وُلد في قرطاج نحو سنة 155م؟",["Tertullian","ترتليان"],[["Saint Augustine","القديس أوغسطين"],["Apuleius","أبوليوس"],["Origen","أوريجانوس"]],"<b>Tertullian</b> was among the first major Christian authors to write in Latin. Augustine was born in today's Algeria.","كان <b>ترتليان</b> من أوائل كبار الكتّاب المسيحيين باللاتينية، أما أوغسطين فوُلد في الجزائر الحالية."),
 M("Which 10th-century Kairouan doctor wrote 'Zad al-Musafir', later translated into Latin?","أي طبيب قيرواني من القرن العاشر ألّف «زاد المسافر» الذي تُرجم إلى اللاتينية؟",["Ibn al-Jazzar","ابن الجزار"],[["Ibn Sina","ابن سينا"],["al-Razi","الرازي"],["Ibn Rushd","ابن رشد"]],"His works reached the medical school of Salerno in Italy.","وصلت مؤلفاته إلى مدرسة سالرنو الطبية في إيطاليا."),

 M("Which Zitouna scholar wrote the Quran commentary 'al-Tahrir wa al-Tanwir'?","أي عالم زيتوني ألّف تفسير «التحرير والتنوير»؟",["Mohamed Tahar Ben Achour","محمد الطاهر بن عاشور"],[["Sahnun","سحنون"],["Ibn Arafa","ابن عرفة"],["Salem Bouhageb","سالم بوحاجب"]],"He worked on it for about forty years.","اشتغل عليه نحو أربعين سنة."),
 M("Lines by which poet appear in Tunisia's national anthem?","أبياتُ أيّ شاعر وردت في النشيد الوطني التونسي؟",["Aboul-Qacem Chebbi","أبو القاسم الشابي"],[["Mahmoud Messadi","محمود المسعدي"],["Moncef Ghachem","المنصف غاشم"],["Ali Douagi","علي الدوعاجي"]],"They come from his poem <b>'The Will to Live'</b>. Born in Tozeur in 1909, he died in 1934 aged 25.","وردت من قصيدته <b>«إرادة الحياة»</b>. وُلد في توزر سنة 1909 وتوفي سنة 1934 في الخامسة والعشرين."),

 M("Which 17th-century princess is remembered for her charity, giving her name to a hospital in Tunis?","أي أميرة من القرن السابع عشر خلّدت أعمالها الخيرية اسمها على مستشفى في تونس؟",["Aziza Othmana","عزيزة عثمانة"],[["Elissa","عليسة"],["al-Kahina","الكاهنة"],["Bchira Ben Mrad","بشيرة بن مراد"]],"She freed her slaves and left her wealth to charitable foundations.","أعتقت عبيدها وأوقفت ثروتها على أعمال البر."),
 M("Who founded the Muslim Women's Union of Tunisia in 1936?","من أسّست الاتحاد النسائي الإسلامي التونسي سنة 1936؟",["Bchira Ben Mrad","بشيرة بن مراد"],[["Habiba Menchari","حبيبة المنشاري"],["Aziza Othmana","عزيزة عثمانة"],["Radhia Haddad","راضية الحداد"]],"Her union was one of the first Tunisian women's organisations.","كان اتحادها من أوائل المنظمات النسائية التونسية."),
 M("Which union leader was assassinated on 5 December 1952?","أي زعيم نقابي اغتيل يوم 5 ديسمبر 1952؟",["Farhat Hached","فرحات حشاد"],[["Habib Achour","الحبيب عاشور"],["Mohamed Ali El Hammi","محمد علي الحامي"],["Ahmed Tlili","أحمد التليلي"]],"He was killed by the colonial terror group <b>La Main Rouge</b> (the Red Hand).","اغتالته منظمة <b>اليد الحمراء</b> الإرهابية الاستعمارية."),

 M("Khayr al-Din al-Tunisi came to Tunis as a young mamluk from which region?","من أي منطقة جاء خير الدين التونسي إلى تونس مملوكًا شابًا؟",["The Caucasus","القوقاز"],[["Andalusia","الأندلس"],["Egypt","مصر"],["Anatolia","الأناضول"]],"A Circassian by birth, he rose to prime minister of Tunisia and later grand vizier in Istanbul.","شركسيّ المولد، ارتقى إلى الوزارة الكبرى في تونس ثم الصدارة العظمى في إسطنبول."),

{id:"leaders",kind:"special",name:"Rulers & Leaders",nameAr:"الحكام والزعماء",span:"Kings, beys, presidents",qs:[
 M("Who was Hannibal's father?","من هو والد حنبعل؟",["Hamilcar Barca","حملقار برقة"],[["Hasdrubal","صدربعل"],["Mago","ماغون"],["Massinissa","ماسينيسا"]],"Legend says <b>Hamilcar</b> made the boy Hannibal swear eternal hostility to Rome.","تقول الرواية إن <b>حملقار</b> جعل حنبعل الصغير يقسم على العداء الأبدي لروما."),

 M("Which Numidian king waged war against Rome from 112 to 105 BCE?","أي ملك نوميدي حارب روما من 112 إلى 105 ق.م؟",["Jugurtha","يوغرطة"],[["Massinissa","ماسينيسا"],["Juba II","يوبا الثاني"],["Syphax","سيفاقس"]],"He is said to have called Rome 'a city for sale'.","يُروى أنه وصف روما بأنها «مدينة للبيع»."),

 M("Who became the first president elected by direct popular vote after 2011, in 2014?","من أصبح سنة 2014 أول رئيس منتخب بالاقتراع المباشر بعد 2011؟",["Béji Caïd Essebsi","الباجي قائد السبسي"],[["Moncef Marzouki","المنصف المرزوقي"],["Kais Saied","قيس سعيد"],["Fouad Mebazaa","فؤاد المبزع"]],"Marzouki had been chosen by the Constituent Assembly in 2011. Essebsi died in office on 25 July 2019.","كان المرزوقي قد انتُخب من المجلس التأسيسي سنة 2011، وتوفي السبسي وهو في منصبه يوم 25 جويلية 2019."),

 M("The Antonine Baths of Carthage are named after which emperor?","سُمّيت حمامات قرطاج باسم أي إمبراطور؟",["Antoninus Pius","أنطونيوس التقي"],[["Hadrian","هادريان"],["Trajan","تراجان"],["Constantine","قسطنطين"]],"They were the largest Roman baths in Africa, built by the sea in the 2nd century.","كانت أكبر الحمامات الرومانية في إفريقيا، وبُنيت على البحر في القرن الثاني."),
 M("The famous Bardo mosaic of a poet between two Muses shows...","تُظهر فسيفساء باردو الشهيرة لشاعر بين ربّتين من ربات الفنون...",["Virgil","فرجيل"],[["Homer","هوميروس"],["Ovid","أوفيد"],["Apuleius","أبوليوس"]],"<b>Virgil</b> holds the Aeneid, the poem that tells of Dido and Aeneas. It was found in Sousse.","يحمل <b>فرجيل</b> ملحمة الإنيادة التي تروي قصة عليسة وإينياس، ووُجدت الفسيفساء في سوسة."),
 M("Which brother of Hannibal was killed at the Metaurus in 207 BCE?","أي أخ لحنبعل قُتل في معركة الميتاوروس سنة 207 ق.م؟",["Hasdrubal","صدربعل"],[["Mago","ماغون"],["Hamilcar","حملقار"],["Hanno","حنون"]],"<b>Hasdrubal</b> was bringing reinforcements from Spain to Italy.","كان <b>صدربعل</b> يجلب المدد من إسبانيا إلى إيطاليا."),
 M("Which language did the Carthaginians speak?","بأي لغة كان القرطاجيون يتكلمون؟",["Punic","البونية"],[["Latin","اللاتينية"],["Greek","اليونانية"],["Arabic","العربية"]],"Punic was a Semitic language. It was still spoken in the countryside in Saint Augustine's time.","البونية لغة سامية، وظلّت متداولة في الأرياف حتى زمن القديس أوغسطين."),
 T("True or false: Saint Augustine was bishop of Carthage.","صواب أم خطأ: كان القديس أوغسطين أسقفًا لقرطاج.",false,"<b>False.</b> He studied in Carthage but was bishop of Hippo, today's Annaba in Algeria.","<b>خطأ.</b> درس في قرطاج لكنه كان أسقفًا لهيبون، عنابة الحالية في الجزائر."),
 M("In which ancient town stands the Libyco-Punic Mausoleum?","في أي مدينة قديمة يقف الضريح الليبي البوني؟",["Dougga","دقة"],[["Carthage","قرطاج"],["Kerkouane","كركوان"],["El Jem","الجم"]],"Its bilingual inscription, in Libyc and Punic, helped scholars read the Libyc script.","ساعد نقشه المزدوج باللوبية والبونية العلماء على قراءة الخط اللوبي."),
 O([["First Punic War begins","بداية الحرب البونية الأولى","264 BCE","264 ق.م",-264],["Hannibal crosses the Alps","حنبعل يعبر الألب","218 BCE","218 ق.م",-218],["Battle of Cannae","معركة كاناي","216 BCE","216 ق.م",-216],["Battle of Zama","معركة زاما","202 BCE","202 ق.م",-202]],"In BCE dates, the bigger number is the older date.","في التواريخ قبل الميلاد، الرقم الأكبر هو الأقدم.")

kairouan:[
 M("Where was Uqba ibn Nafi killed in 683?","أين قُتل عقبة بن نافع سنة 683م؟",["Near Biskra (Algeria)","قرب بسكرة (الجزائر)"],[["In Kairouan","في القيروان"],["Near Fez","قرب فاس"],["In Tripoli","في طرابلس"]],"His tomb is in the town of Sidi Okba, named after him.","قبره في بلدة سيدي عقبة التي تحمل اسمه."),
 M("Which Berber leader defeated Uqba ibn Nafi in 683?","أي قائد أمازيغي هزم عقبة بن نافع سنة 683م؟",["Kusayla","كسيلة"],[["al-Kahina","الكاهنة"],["Jugurtha","يوغرطة"],["Tariq ibn Ziyad","طارق بن زياد"]],"<b>Kusayla</b> then held Kairouan for a few years.","سيطر <b>كسيلة</b> بعد ذلك على القيروان بضع سنوات."),
 M("Which governor completed the conquest of North Africa and sent Tariq to Spain in 711?","أي والٍ أتمّ فتح شمال إفريقيا وأرسل طارقًا إلى الأندلس سنة 711م؟",["Musa ibn Nusayr","موسى بن نصير"],[["Hassan ibn al-Nu'man","حسان بن النعمان"],["Uqba ibn Nafi","عقبة بن نافع"],["Ibrahim ibn al-Aghlab","إبراهيم بن الأغلب"]],"<b>Musa ibn Nusayr</b> governed from Kairouan.","حكم <b>موسى بن نصير</b> من القيروان."),
 M("What was the Arabic name of the province that roughly matched Tunisia?","ما الاسم العربي للولاية التي كانت تقابل تونس تقريبًا؟",["Ifriqiya","إفريقية"],[["al-Andalus","الأندلس"],["Barqa","برقة"],["al-Maghrib al-Aqsa","المغرب الأقصى"]],"<b>Ifriqiya</b> comes from the Roman province of Africa.","اسم <b>إفريقية</b> مأخوذ من الولاية الرومانية «إفريقيا»."),
 M("Which Abbasid caliph appointed Ibrahim ibn al-Aghlab in 800?","أي خليفة عباسي عيّن إبراهيم بن الأغلب سنة 800م؟",["Harun al-Rashid","هارون الرشيد"],[["al-Ma'mun","المأمون"],["al-Mansur","المنصور"],["al-Mu'tasim","المعتصم"]],"In return, the Aghlabids paid a yearly tribute to Baghdad.","في المقابل، دفع الأغالبة إتاوة سنوية إلى بغداد."),
 M("In which century was the Zitouna Mosque rebuilt in its present form?","في أي قرن أُعيد بناء جامع الزيتونة على شكله الحالي؟",["The 9th century","القرن التاسع"],[["The 7th century","القرن السابع"],["The 12th century","القرن الثاني عشر"],["The 16th century","القرن السادس عشر"]],"The Aghlabids rebuilt it in the 9th century. Its minaret was rebuilt in 1894.","أعاد الأغالبة بناءه في القرن التاسع، وأعيد بناء صومعته سنة 1894."),
 M("Which Berber tribe helped the Fatimids take power?","أي قبيلة أمازيغية ساعدت الفاطميين على الوصول إلى الحكم؟",["The Kutama","كتامة"],[["The Banu Hilal","بنو هلال"],["The Zenata","زناتة"],["The Masmuda","مصمودة"]],"The <b>Kutama</b> lived in the mountains of today's eastern Algeria.","عاشت <b>كتامة</b> في جبال شرق الجزائر الحالية."),
 M("Which missionary prepared the Fatimid takeover among the Kutama?","أي داعية مهّد لقيام الدولة الفاطمية بين كتامة؟",["Abu Abdallah al-Shi'i","أبو عبد الله الشيعي"],[["Ubayd Allah al-Mahdi","عبيد الله المهدي"],["Sahnun","سحنون"],["Abu Yazid","أبو يزيد"]],"He conquered the Aghlabid state, then handed power to Ubayd Allah in 909.","فتح الدولة الأغلبية ثم سلّم الحكم لعبيد الله سنة 909م."),
 M("Under which Fatimid caliph was Cairo founded, in 969?","في عهد أي خليفة فاطمي تأسست القاهرة سنة 969م؟",["al-Mu'izz li-Din Allah","المعز لدين الله"],[["al-Mahdi","المهدي"],["al-Qa'im","القائم"],["al-Hakim","الحاكم"]],"His general Jawhar, who had left from Ifriqiya, conquered Egypt.","فتح قائده جوهر مصر بعد أن انطلق من إفريقية."),
 M("Which rebel, 'the man on the donkey', besieged Mahdia in 944–947?","أي ثائر، «صاحب الحمار»، حاصر المهدية بين 944 و947م؟",["Abu Yazid","أبو يزيد"],[["Kusayla","كسيلة"],["Ali Ben Ghedahem","علي بن غذاهم"],["Abu Abdallah al-Shi'i","أبو عبد الله الشيعي"]],"<b>Abu Yazid</b> was a Kharijite Berber. The Fatimids defeated him in 947.","كان <b>أبو يزيد</b> أمازيغيًا خارجيًا، وهزمه الفاطميون سنة 947م."),
 T("True or false: Mahdia was built on a narrow peninsula.","صواب أم خطأ: بُنيت المهدية على شبه جزيرة ضيقة.",true,"<b>True.</b> The sea protected it on three sides.","<b>صواب.</b> كان البحر يحميها من ثلاث جهات."),
 M("The Blue Quran is written on blue parchment in which colour?","بأي لون كُتب المصحف الأزرق على رقّه الأزرق؟",["Gold","الذهبي"],[["Black","الأسود"],["Red","الأحمر"],["White","الأبيض"]],"Most of its surviving pages are kept in Tunisia, at the Raqqada museum near Kairouan.","تُحفظ معظم أوراقه الباقية في تونس، بمتحف رقادة قرب القيروان."),
 M("What is a ribat?","ما هو الرباط؟",["A fortified post for defenders of the coast","حصن لحماية الساحل"],[["A covered market","سوق مسقوف"],["A royal palace","قصر ملكي"],["A public bath","حمام عمومي"]],"Men lived in the <b>ribat</b> to pray, study and watch the sea.","كان الرجال يقيمون في <b>الرباط</b> للعبادة والعلم ومراقبة البحر."),
 M("From which port did Asad ibn al-Furat's fleet sail to Sicily in 827?","من أي ميناء أبحر أسطول أسد بن الفرات إلى صقلية سنة 827م؟",["Sousse","سوسة"],[["Bizerte","بنزرت"],["Gabès","قابس"],["Tabarka","طبرقة"]],"<b>Sousse</b> was the main Aghlabid naval base.","كانت <b>سوسة</b> القاعدة البحرية الرئيسية للأغالبة."),
 T("True or false: the Aghlabids recognised the Abbasid caliph in Baghdad.","صواب أم خطأ: اعترف الأغالبة بسلطة الخليفة العباسي في بغداد.",true,"<b>True.</b> They ruled almost independently but in the caliph's name.","<b>صواب.</b> حكموا شبه مستقلين لكن باسم الخليفة."),
 M("Why is the 9th-century minbar of Kairouan's Great Mosque famous?","لماذا يشتهر منبر جامع القيروان من القرن التاسع؟",["It is among the oldest minbars still in place","من أقدم المنابر الباقية في مكانها"],[["It is made of gold","مصنوع من الذهب"],["It is made of glass","مصنوع من الزجاج"],["It came from Mecca","جُلب من مكة"]],"It is carved from teak wood brought from far away.","نُحت من خشب الساج المجلوب من بلاد بعيدة."),
 M("What did the Arabs call the ancient city of Carthage?","بماذا سمّى العرب مدينة قرطاج القديمة؟",["Qartajanna","قرطاجنة"],[["Qayrawan","القيروان"],["Susa","سوسة"],["Tunis","تونس"]],"Arab geographers described its huge ruins with wonder.","وصف الجغرافيون العرب أطلالها الضخمة بإعجاب."),
 M("What was Raqqada?","ما هي رقادة؟",["The Aghlabid royal city near Kairouan","المدينة الملكية الأغلبية قرب القيروان"],[["A Roman temple","معبد روماني"],["A port near Bizerte","ميناء قرب بنزرت"],["A Berber village","قرية أمازيغية"]],"Ibrahim II built <b>Raqqada</b> in 876. It now houses the Museum of Islamic Art.","بنى إبراهيم الثاني <b>رقادة</b> سنة 876م، وتضم اليوم متحف الفنون الإسلامية."),
 M("What were the 'Aghlabid Basins' used for?","فيمَ كانت تُستعمل فسقية الأغالبة؟",["Storing water for Kairouan","تخزين الماء للقيروان"],[["Bathing horses","غسل الخيول"],["Breeding fish","تربية الأسماك"],["Royal swimming","سباحة الملوك"]],"Water came from the hills when it rained and was kept for the dry season.","كان الماء يأتي من التلال عند نزول المطر ويُحفظ لفصل الجفاف."),
 O([["Death of Uqba ibn Nafi","مقتل عقبة بن نافع","683","683م",683],["Hassan takes Carthage","حسان يستولي على قرطاج","698","698م",698],["Great Berber revolt","الثورة الأمازيغية الكبرى","740","740م",740],["Fleet sails for Sicily","الأسطول يبحر إلى صقلية","827","827م",827]],"In 150 years Ifriqiya went from conquered land to a sea power.","في 150 سنة تحوّلت إفريقية من أرض مفتوحة إلى قوة بحرية.")

hafsid:[
 M("Who became Fatimid governor of Ifriqiya in 973, founding Zirid power?","من أصبح واليًا فاطميًا على إفريقية سنة 973م فأسّس حكم الزيريين؟",["Buluggin ibn Ziri","بلكين بن زيري"],[["al-Mu'izz ibn Badis","المعز بن باديس"],["Abu Zakariya","أبو زكرياء"],["Roger II","روجر الثاني"]],"The Zirids were named after his father, Ziri ibn Manad.","سُمّي الزيريون نسبةً إلى أبيه زيري بن مناد."),
 M("To which Berber group did the Zirids belong?","إلى أي مجموعة أمازيغية ينتمي الزيريون؟",["Sanhaja","صنهاجة"],[["Kutama","كتامة"],["Zenata","زناتة"],["Masmuda","مصمودة"]],"That is why the Arabic title of Idris's book is <i>al-Dawla al-Sanhajiyya</i>.","ولهذا يحمل كتاب إدريس عنوان <i>الدولة الصنهاجية</i>."),
 M("Which caliphate did al-Mu'izz ibn Badis recognise after breaking with the Fatimids?","أي خلافة اعترف بها المعز بن باديس بعد قطيعته مع الفاطميين؟",["The Abbasids","العباسيون"],[["The Umayyads of Cordoba","أمويو قرطبة"],["The Almohads","الموحدون"],["The Ottomans","العثمانيون"]],"He also returned Ifriqiya fully to Sunni Maliki practice.","وأعاد إفريقية كليًا إلى المذهب السني المالكي."),
 M("Which Hafsid ruler claimed the title of caliph in 1253?","أي حاكم حفصي تلقّب بالخليفة سنة 1253م؟",["al-Mustansir","المستنصر"],[["Abu Zakariya","أبو زكرياء"],["Abu Faris","أبو فارس"],["Mulay Hassan","مولاي الحسن"]],"Even Mecca briefly recognised him after the fall of Baghdad in 1258.","اعترفت به مكة لفترة قصيرة بعد سقوط بغداد سنة 1258م."),
 M("Which famous traveller from Tangier visited Tunis in 1325?","أي رحالة شهير من طنجة زار تونس سنة 1325م؟",["Ibn Battuta","ابن بطوطة"],[["Ibn Jubayr","ابن جبير"],["Marco Polo","ماركو بولو"],["al-Idrisi","الإدريسي"]],"He was on his way to Mecca, at the start of a journey of almost 30 years.","كان في طريقه إلى مكة، في بداية رحلة دامت قرابة 30 سنة."),
 M("The Kasbah Mosque of Tunis (1230s) was built by which dynasty?","أي دولة بنت جامع القصبة بتونس (ثلاثينيات القرن 13)؟",["The Hafsids","الحفصيون"],[["The Almohads","الموحدون"],["The Ottomans","العثمانيون"],["The Fatimids","الفاطميون"]],"Abu Zakariya built it next to his palace. Its minaret follows Almohad style.","بناه أبو زكرياء قرب قصره، وتتبع صومعته الطراز الموحدي."),
 M("What is a madrasa?","ما هي المدرسة (madrasa)؟",["A school for religious sciences","مدرسة للعلوم الشرعية"],[["A covered market","سوق مسقوف"],["A fortress","حصن"],["A harbour","ميناء"]],"The first madrasa of Tunis, al-Shamma'iya, was founded under the Hafsids in 1249.","تأسست أول مدرسة في تونس، المدرسة الشماعية، في العهد الحفصي سنة 1249م."),
 T("True or false: many refugees from al-Andalus settled in Tunisia in the Hafsid period.","صواب أم خطأ: استقرّ كثير من اللاجئين الأندلسيين في تونس خلال العهد الحفصي.",true,"<b>True.</b> They brought skills in farming, crafts, music and administration.","<b>صواب.</b> جلبوا معهم خبرات في الفلاحة والحِرف والموسيقى والإدارة."),
 M("Which epidemic struck Tunis in 1348, killing Ibn Khaldun's parents?","أي وباء ضرب تونس سنة 1348م وأودى بوالدَي ابن خلدون؟",["The Black Death","الطاعون الأسود"],[["Cholera","الكوليرا"],["Smallpox","الجدري"],["Spanish flu","الإنفلونزا الإسبانية"]],"The same plague killed perhaps a third of Europe's people.","قتل الطاعون نفسه ربما ثلث سكان أوروبا."),
 M("Which conqueror did Ibn Khaldun meet outside Damascus in 1401?","أي فاتح التقى به ابن خلدون خارج دمشق سنة 1401م؟",["Timur (Tamerlane)","تيمورلنك"],[["Genghis Khan","جنكيز خان"],["Saladin","صلاح الدين"],["Baybars","بيبرس"]],"Ibn Khaldun described their conversations in his autobiography.","وصف ابن خلدون حواراتهما في سيرته الذاتية."),
 M("Which Italian city-states traded with Hafsid Tunis under treaties?","أي مدن إيطالية تاجرت مع تونس الحفصية بموجب معاهدات؟",["Genoa, Pisa and Venice","جنوة وبيزا والبندقية"],[["Paris and London","باريس ولندن"],["Vienna and Prague","فيينا وبراغ"],["Moscow and Kiev","موسكو وكييف"]],"European merchants had their own warehouses, called <i>funduqs</i>, in Tunis.","كان للتجار الأوروبيين مخازنهم الخاصة في تونس، وتُسمّى <i>الفنادق</i>."),
 M("During the Eighth Crusade, Louis IX's army camped near which ruins?","خلال الحملة الصليبية الثامنة، أين عسكر جيش لويس التاسع؟",["Carthage","قرطاج"],[["El Jem","الجم"],["Dougga","دقة"],["Kairouan","القيروان"]],"Disease spread in the hot camp, and the king died there.","انتشر المرض في المعسكر الحار ومات الملك هناك."),
 M("After 1535 Spain kept a fortress at which port near Tunis?","بعد 1535 احتفظت إسبانيا بحصن في أي ميناء قرب تونس؟",["La Goulette","حلق الوادي"],[["Bizerte","بنزرت"],["Sousse","سوسة"],["Sfax","صفاقس"]],"The Spanish held <b>La Goulette</b> until the Ottomans took it in 1574.","احتفظ الإسبان بـ<b>حلق الوادي</b> حتى استولى عليه العثمانيون سنة 1574."),
 T("True or false: Charles V's conquest of Tunis is shown in a famous series of tapestries.","صواب أم خطأ: يُصوَّر احتلال شارلكان لتونس في سلسلة شهيرة من النسيج المزخرف.",true,"<b>True.</b> They were designed by Jan Vermeyen, who travelled with the army.","<b>صواب.</b> صمّمها الرسام يان فيرمين الذي رافق الجيش."),
 M("Which Hafsid sultan ruled from 1394 to 1434, a golden age for Tunis?","أي سلطان حفصي حكم من 1394 إلى 1434، عصرًا ذهبيًا لتونس؟",["Abu Faris Abd al-Aziz","أبو فارس عبد العزيز"],[["al-Mustansir","المستنصر"],["Mulay Hassan","مولاي الحسن"],["Abu Zakariya","أبو زكرياء"]],"He restored order and built schools, fountains and hospitals.","أعاد النظام وبنى المدارس والسقايات والمستشفيات."),
 M("Where did the Banu Hilal live just before they came to Ifriqiya?","أين كان يقيم بنو هلال قبيل قدومهم إلى إفريقية؟",["Upper Egypt","صعيد مصر"],[["al-Andalus","الأندلس"],["Sicily","صقلية"],["Persia","فارس"]],"Originally from Arabia, they had been settled in <b>Upper Egypt</b> by the Fatimids.","أصلهم من الجزيرة العربية، وكان الفاطميون قد أسكنوهم <b>صعيد مصر</b>."),

function grammarFor(q){const t=plain([q.q,q.f].join(" "));const hits=[];
 GRAM.forEach((g,i)=>{const m=t.match(g.re);if(m)hits.push([i,m[0],m])});
 if(!hits.length)return null;const pick=hits.find(h=>!S.recentTips.includes(h[0]))||hits[0];
 S.recentTips=[pick[0],...S.recentTips].slice(0,4);
 const g=GRAM[pick[0]];let x=g.x;
 if(!x){const v=pick[2][1];const base=IRREG[v.toLowerCase()];x=[`<b>${v}</b> is the past of <b>${base}</b>. Irregular verbs don't take -ed, so learn them by heart: ${base} – ${v}.`,`<b>${v}</b> ماضي الفعل <b>${base}</b>، وهو فعل شاذ لا يأخذ ed فيُحفظ: ${base} – ${v}.`]}
 return {t:g.t,x,m:pick[1]}}

  if(q.t==="mc"){S.opts=q.tf?[["True","صواب"],["False","خطأ"]]:shuffle([q.a,...q.o])}
  else{S.pool=shuffle(q.items.map((_,k)=>k));S.placed=[]}
  S.limit=(q.t==="order"?TIME_ORDER:TIME_MC)*1000;S.deadline=performance.now()+S.limit;
  renderQ();startTimer();
}
function startTimer(){stopTimer();const tick=()=>{const bar=document.querySelector(".timer i"),wrap=document.querySelector(".timer");if(!bar)return;
  const left=Math.max(0,S.deadline-performance.now());bar.style.width=(left/S.limit*100)+"%";wrap.classList.toggle("low",left<S.limit*.25);
  const sec=Math.ceil(left/1000);if(sec<=5&&sec>0&&sec!==S.lastTick){S.lastTick=sec;sfx.tick()}
  if(left<=0&&!S.answered){S.late=true;const q=S.list[S.qi];if(q.t==="mc")answer(null,null);else checkOrder(true);return}timerRAF=requestAnimationFrame(tick)};timerRAF=requestAnimationFrame(tick)}

function sceneFor(q){const id=ALL[S.ch].id==="mix"?chOf(q):ALL[S.ch].id;const list=CH_PH[id];return [list[S.qi%list.length],id]}
function renderQ(){
  S.screen="quiz";musicLevel(.22);
  const c=ALL[S.ch],q=S.list[S.qi],n=S.list.length;const [pk,scene]=sceneFor(q);
  const head=`<div class="qhead"><span>${c.name} · ${S.qi+1} / ${n}</span><span class="streak">${S.streak>=2?bi("Streak ×"+S.streak,"سلسلة ×"+S.streak):""}</span></div>
   <div class="bars"><div class="progress"><i style="width:${(S.qi/n)*100}%"></i></div>${S.answered?"":`<div class="timer"><i></i></div>`}</div>
   <div class="qtext"><h2 class="q ${q.eng?"":"en"}">${q.q}</h2>${q.qa?`<p class="q-ar ar" lang="ar">${q.qa}</p>`:""}</div>`;
  let body="";
  const anim=S.fresh;
  if(q.t==="mc"){
    body=`<div class="opts">${S.opts.map((o,k)=>{let cl="";if(S.answered){if(o[0]===q.a[0])cl="right";else if(S.last&&o[0]===S.last[0])cl="wrong"}if(S.gone.includes(o[0]))cl+=" gone";
      return `<button class="opt ${cl}" data-o="${k}" style="${anim?`animation-delay:${200+k*90}ms`:"animation:none"}" ${S.answered||S.gone.includes(o[0])?"disabled":""}><span class="k">${"ABCD"[k]}</span><span class="txt">${q.eng?`<span>${o[0]}</span>`:`<span class="en">${o[0]}</span><span class="ar" lang="ar">${o[1]}</span>`}</span></button>`}).join("")}</div>`;
  }else{
    const done=S.answered;
    body=`<div class="slots">${q.items.map((_,k)=>{const idx=S.placed[k];if(idx===undefined)return `<div class="slot"><span class="n">${k+1}</span><span class="small">${q.build?"Tap a word below":bi("Tap an event below","اختر حدثًا من الأسفل")}</span></div>`;
      const it=q.items[idx];const ok=done?(sortedIdx(q)[k]===idx):null;
      return `<div class="slot filled ${done?(ok?"right":"wrong"):""}" data-s="${k}" ${done?"":'role="button" tabindex="0"'}><span class="n">${k+1}</span><span style="display:flex;flex-direction:column;min-width:0">${q.eng?`<span>${it[0]}</span>`:bi(it[0],it[1])}</span>${done?`<span class="yr">${it[2]}</span>`:""}</div>`}).join("")}</div>
     ${done?"":`<div class="pool">${S.pool.filter(k=>!S.placed.includes(k)).map((k,j)=>`<button class="chip" data-p="${k}" style="${anim?`animation-delay:${150+j*80}ms`:"animation:none"}">${q.eng?`<span>${q.items[k][0]}</span>`:bi(q.items[k][0],q.items[k][1])}</button>`).join("")}</div>`}`;
  }
  const canHint=!S.answered&&!S.hinted&&q.t==="mc"&&!q.tf&&S.coins>=15;
  const tools=S.answered?feedback(q):`<div class="tools">${q.t==="mc"?`<button class="hint" id="hint" ${canHint?"":"disabled"}>${q.eng?"<span>Ask Ibn Khaldun · remove 2 · 15 dinars</span>":'<span class="en">Ask Ibn Khaldun · remove 2 · 15 dinars</span><span class="ar" lang="ar">استشر ابن خلدون · احذف إجابتين · 15 دينارًا</span>'}</button>`:`<button class="btn" id="check" ${S.placed.length===q.items.length?"":"disabled"}>${q.build?"<span>Check my sentence</span>":'<span class="en">Check order</span><span class="ar" lang="ar">تحقّق من الترتيب</span>'}</button>`}<button class="btn ghost" id="quit"><span class="en">Map</span><span class="ar" lang="ar">الخريطة</span></button></div>`;
  const keepCard=!S.fresh&&document.querySelector(".card > .photo");
  app.innerHTML=header()+`<div class="card frame" ${S.fresh?"":'style="animation:none"'}>${photoHTML(pk,scene,{chip:ALL[S.ch].span})}<div class="qbody">${head}${body}${tools}</div></div>`;
  if(keepCard){const ph=app.querySelector(".card > .photo img");if(ph&&keepCard.classList.contains("ok")){ph.classList.add("in");ph.parentNode.classList.add("ok");ph.style.transition="none"}}
  S.fresh=false;
  wireHeader();
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(S.opts[+b.dataset.o],b));
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{sfx.click();S.placed.push(+b.dataset.p);renderQ()});
  app.querySelectorAll(".slot.filled[role]").forEach(s=>{const rm=()=>{S.placed.splice(+s.dataset.s,1);renderQ()};s.onclick=rm;s.onkeydown=e=>{if(e.key==="Enter")rm()}});
  const h=document.getElementById("hint");if(h)h.onclick=useHint;
  const ck=document.getElementById("check");if(ck)ck.onclick=()=>checkOrder(false);
  const qb=document.getElementById("quit");if(qb)qb.onclick=()=>leave(goMap,"map");
  const qb2=document.getElementById("quit2");if(qb2)qb2.onclick=()=>leave(goMap,"map");
  wireSay();
  const nb=document.getElementById("next");if(nb){nb.onclick=()=>{sfx.click();advance()};nb.focus({preventScroll:true})}
}

function feedback(q){
  const ok=S.ok,quip=S.quip,rk=revealKey(q);
  let right="";
  if(!ok){right=q.eng?(q.t==="mc"?`<span class="gain">Right answer: <b>${q.a[0]}</b></span>`:`<span class="gain">Correct sentence: <b>${sortedIdx(q).map(k=>q.items[k][0]).join(" ")}</b></span>`):(q.t==="mc"?`<span class="gain">${bi(`Right answer: <b>${q.a[0]}</b>`,`الإجابة الصحيحة: <b>${q.a[1]}</b>`)}</span>`:`<span class="gain">${bi("Correct order: ","الترتيب الصحيح: ")}${sortedIdx(q).map(k=>q.items[k][2]).join(" → ")}</span>`)}
  const gainTxt=ok?(q.eng?`<span class="gain"><strong>+${S.gain}</strong> dinars${S.bonusEn.length?" · "+S.bonusEn.join(" · "):""}</span>`:`<span class="gain"><strong>+${S.gain}</strong> ${bi("dinars","دينارًا")}${S.bonus.length?" · "+S.bonus.join(" · "):""}</span>`):"";
  return `<div class="feedback ${ok?"ok":"no"}">${rk?photoHTML(rk,null,{cls:"reveal",removeOnFail:true}):""}<div class="fb-in"><span class="quip">${q.eng?`<span>${quip[0]}</span>`:`<span class="en">${quip[0]}</span><span class="ar" lang="ar">${quip[1]}</span>`}</span>${q.eng?`<span class="fact">${q.f}</span>`:`<span class="fact en">${q.f}</span><span class="fact ar" lang="ar">${q.fa}</span>`}${gainTxt}${right}</div>${learnHTML(q)}</div>
  <div class="row navrow"><button class="btn" id="next">${q.eng?(S.qi+1<S.list.length?"<span>Next question</span>":"<span>See your reward</span>"):(S.qi+1<S.list.length?`<span class="en">Next question</span><span class="ar" lang="ar">السؤال التالي</span>`:`<span class="en">See your reward</span><span class="ar" lang="ar">اكتشف جائزتك</span>`)}</button><button class="btn ghost" id="quit2">${q.eng?"<span>Map</span>":'<span class="en">Map</span><span class="ar" lang="ar">الخريطة</span>'}</button></div>`}

function useHint(){const q=S.list[S.qi];S.coins-=15;S.shown=S.coins;S.hinted=true;S.gone=shuffle(S.opts.filter(o=>o[0]!==q.a[0]).map(o=>o[0])).slice(0,2);save();sfx.click();renderQ()}

function reward(ok,base,el){
  S.answered=true;S.ok=ok;S.stats.played++;S.bonus=[];
  const left=Math.max(0,S.deadline-performance.now());stopTimer();
  const from=el&&el.getBoundingClientRect?el.getBoundingClientRect():null;
  if(ok){S.streak++;S.score++;S.stats.right++;S.stats.best=Math.max(S.stats.best,S.streak);
    S.bonusEn=[];let g=base;if(S.streak>=3){g*=2;S.bonus.push(bi("streak ×2","سلسلة ×2"));S.bonusEn.push("streak ×2")}
    if(left>S.limit/2){g+=5;S.bonus.push(bi("speed +5","سرعة +5"));S.bonusEn.push("speed +5")}
    S.gain=g;S.coins+=g;S.earned+=g;S.quip=pick(YES);sfx.cash()}
  else{S.streak=0;S.gain=0;S.quip=S.late?pick(LATE):pick(NO);sfx.wrong()}
  save();renderQ();
  if(ok)flyCoins(from,S.gain);
}
function answer(o,btn){if(S.answered)return;const q=S.list[S.qi];S.last=o;reward(!!o&&o[0]===q.a[0],10,btn)}
function checkOrder(timeout){if(S.answered)return;const q=S.list[S.qi];
  if(timeout){const rest=S.pool.filter(k=>!S.placed.includes(k));S.placed=S.placed.concat(rest)}
  const ok=!timeout&&S.placed.every((idx,k)=>sortedIdx(q)[k]===idx);reward(ok,25,document.querySelector(".slots"))}
function advance(){S.qi++;if(S.qi<S.list.length)nextQ();else renderResult();window.scrollTo(0,0)}

/* ================= coins fly into the purse ================= */
function setShown(v){S.shown=v;const c=document.getElementById("coins");if(c)c.textContent=v}
function flyCoins(r,gain){
  const purse=document.getElementById("purse");const target=S.coins;
  if(!purse||!r||reduce()){setShown(target);sfx.coin();return}
  const pr=purse.getBoundingClientRect(),box=document.getElementById("burst");
  const n=Math.max(3,Math.min(10,Math.round(gain/4)));const step=Math.max(1,Math.round(gain/n));let start=S.shown;
  const fl=document.createElement("div");fl.className="floater";fl.textContent="+"+gain;fl.style.left=(r.left+r.width/2-20)+"px";fl.style.top=(r.top-10)+"px";document.body.appendChild(fl);setTimeout(()=>fl.remove(),1300);
  for(let i=0;i<n;i++){const d=document.createElement("div");d.innerHTML=COIN;const s=d.firstChild;box.appendChild(s);
    const x0=r.left+r.width*(.3+Math.random()*.4)-13,y0=r.top+r.height/2-13,x1=pr.left+8,y1=pr.top+4,mx=(x0+x1)/2+(Math.random()*160-80),my=Math.min(y0,y1)-60-Math.random()*90;
    const a=s.animate([{transform:`translate(${x0}px,${y0}px) scale(.4) rotate(0)`,opacity:0},{transform:`translate(${x0}px,${y0-20}px) scale(1.1)`,opacity:1,offset:.15},{transform:`translate(${mx}px,${my}px) scale(1.25) rotate(200deg)`,offset:.55},{transform:`translate(${x1}px,${y1}px) scale(.6) rotate(400deg)`,opacity:1}],{duration:850,delay:i*85,easing:"cubic-bezier(.45,0,.55,1)",fill:"both"});
    a.onfinish=()=>{s.remove();sfx.coin();setShown(i===n-1?S.coins:Math.max(S.shown,Math.min(S.coins,start+=step)));const p=document.getElementById("purse");if(p){p.classList.remove("bump");void p.offsetWidth;p.classList.add("bump")}}}
}

/* ================= result ================= */
function renderResult(){
  S.screen="result";stopTimer();musicLevel(.08);setTimeout(()=>{if(app.querySelector('.result .medalwrap'))musicLevel(.4)},5500);
  const c=ALL[S.ch],n=S.list.length,m=medalOf(S.score,n);
  const prev=S.medals[c.id],order=["bronze","silver","gold"];
  let bonus=0;
  if(m&&(!prev||order.indexOf(m)>order.indexOf(prev))){S.medals[c.id]=m;if(m==="gold"){bonus=50;S.coins+=50;S.earned+=50}}
  save();
  const col={gold:["#f6d27a","#e0ac45","#9c6c1d"],silver:["#ffffff","#c9cfd6","#7d8692"],bronze:["#f0b07a","#b0703a","#6f3f17"]}[m||"bronze"];
  const lines={gold:["A perfect quest. The treasury of the Bey is yours!","تحدٍّ كامل. خزينة الباي ملكك!"],silver:["Nearly flawless. The vizier is impressed, but the Bey wants perfection.","شبه كامل. الوزير معجب، لكن الباي يريد الكمال."],bronze:["A respectable start. The archives of Kairouan await your return.","بداية محترمة. خزائن القيروان تنتظر عودتك."],none:["Oh no... the chroniclers lost the scroll. Try again!","يا للخيبة... أضاع المؤرخون المخطوط. حاول من جديد!"]}[m||"none"];
  const nextI=S.ch+1<ALL.length?S.ch+1:null;
  app.innerHTML=header()+`<div class="card frame result">
   <div class="medalwrap">${m?'<div class="rays"></div>':""}<svg class="bigmedal" viewBox="0 0 100 100" role="img" aria-label="${m?ML[m][0]:"No medal"}"><defs><radialGradient id="mg" cx="35%" cy="30%"><stop offset="0" stop-color="${col[0]}"/><stop offset=".55" stop-color="${col[1]}"/><stop offset="1" stop-color="${col[2]}"/></radialGradient></defs><circle cx="50" cy="50" r="46" fill="url(#mg)" stroke="${col[2]}" stroke-width="3" ${m?"":'opacity=".35"'}/><circle cx="50" cy="50" r="36" fill="none" stroke="${col[2]}" stroke-width="1.5" stroke-dasharray="3 3"/><text x="50" y="50" text-anchor="middle" font-family="Aref Ruqaa,serif" font-size="17" fill="${col[2]}">تونس</text><text x="50" y="67" text-anchor="middle" font-family="Marcellus,serif" font-size="9" fill="${col[2]}">TUNIS</text></svg></div>
   <h2 class="en">${m?ML[m][0]:"No medal yet"}</h2><div class="rank">${m?ML[m][1]:"لا وسام بعد"}</div>
   <p>${bi(`${c.name}: <b>${S.score} / ${n}</b> correct, <b id="earnedEn">0</b> dinars earned${bonus?" (including a 50-dinar bonus)":""}.`,`${c.nameAr}: <b>${S.score} / ${n}</b> إجابات صحيحة، و<b id="earnedAr">0</b> دينارًا${bonus?" (منها مكافأة 50 دينارًا)":""}.`)}</p>
   <p>${bi(lines[0],lines[1])}</p>
   <div class="row">${nextI!==null?`<button class="btn" id="nx"><span class="en">Next: ${ALL[nextI].name}</span><span class="ar" lang="ar">التالي: ${ALL[nextI].nameAr}</span></button>`:""}<button class="btn ghost" id="again"><span class="en">Play again</span><span class="ar" lang="ar">العب مجددًا</span></button><button class="btn ghost" id="map"><span class="en">Map</span><span class="ar" lang="ar">الخريطة</span></button></div>
  </div>`;
  setShown(S.coins);
  wireHeader();
  const tgt=S.earned,t0=performance.now();(function count(){const k=Math.min(1,(performance.now()-t0)/1200);const v=Math.round(tgt*k);["earnedEn","earnedAr"].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=v});if(k<1)requestAnimationFrame(count)})();
  setTimeout(()=>{
    if(m==="gold"){sfx.fanfare();setTimeout(()=>{sfx.cheer();sfx.applause(3.6,1.2)},550);burst(document.querySelector(".bigmedal"),26);confetti()}
    else if(m==="silver"){sfx.fanfare(true);setTimeout(()=>sfx.applause(2.6,.9),300);burst(document.querySelector(".bigmedal"),14)}
    else if(m==="bronze"){sfx.applause(1.6,.45);burst(document.querySelector(".bigmedal"),8)}
    else sfx.sad();
  },350);
  const nx=document.getElementById("nx");if(nx)nx.onclick=()=>{sfx.click();startCh(nextI)};
  document.getElementById("again").onclick=()=>{sfx.click();startCh(S.ch)};
  document.getElementById("map").onclick=goMap;
}

/* ================= effects ================= */
const reduce=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(el,count){
  if(!el||reduce())return;
  const r=el.getBoundingClientRect(),box=document.getElementById("burst");
  for(let i=0;i<count;i++){const d=document.createElement("div");d.innerHTML=COIN;const s=d.firstChild;box.appendChild(s);
    const x=r.left+r.width/2-13,y=r.top+r.height/2-13,dx=Math.random()*320-160,dy=-80-Math.random()*200;
    s.animate([{transform:`translate(${x}px,${y}px) scale(.5)`,opacity:1},{transform:`translate(${x+dx}px,${y+dy}px) scale(1.2) rotate(${Math.random()*720-360}deg)`,opacity:0}],{duration:1200,delay:i*25,easing:"cubic-bezier(.2,.7,.3,1)",fill:"both"}).onfinish=()=>s.remove()}
}
function confetti(){if(reduce())return;const box=document.getElementById("burst"),cols=["#e70013","#ffffff","#e0ac45","#2a9d8f","#2f6fb3"];
  for(let i=0;i<90;i++){const c=document.createElement("i");c.style.left=Math.random()*100+"vw";c.style.top="-20px";c.style.background=cols[i%cols.length];
    c.style.animationDelay=Math.random()*1+"s";c.style.setProperty("--dx",(Math.random()*180-90)+"px");c.style.setProperty("--r",(Math.random()*900)+"deg");box.appendChild(c);setTimeout(()=>c.remove(),3800)}}
(function dust(){const cv=document.getElementById("dust"),cx=cv.getContext&&cv.getContext("2d");if(!cx)return;let W,H,P2=[];
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener("resize",size);
  for(let i=0;i<45;i++)P2.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,v:Math.random()*.25+.05,a:Math.random()*Math.PI*2});
  function draw(){cx.clearRect(0,0,W,H);for(const p of P2){p.y-=p.v;p.a+=.01;p.x+=Math.sin(p.a)*.2;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
    cx.globalAlpha=.25+.25*Math.sin(p.a*2);cx.fillStyle="#e0ac45";cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}if(!reduce())requestAnimationFrame(draw)}
  draw()})();

function start(){load();applyLang();renderSplash()}
window.claude?.hot?.snapshot?.(()=>({}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start();

</script>
