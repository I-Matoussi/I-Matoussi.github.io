  ["Two heads are better than one.","Two people working together find better solutions than one alone.","Let's translate this text together; two heads are better than one.","يد واحدة لا تصفّق","Deux avis valent mieux qu'un."],
  ["When in Rome, do as the Romans do.","Follow the customs of the place where you are.","In a formal email, use formal greetings. When in Rome, do as the Romans do.","يا غريب كن أديب","À Rome, fais comme les Romains."],
  ["Every cloud has a silver lining.","Something good can come out of a bad situation.","I failed the first test, but every cloud has a silver lining: I learned how to revise.","ربّ ضارّة نافعة","À quelque chose malheur est bon."],
  ["Haste makes waste.","If you do things too quickly, you make mistakes.","Check your translation twice. Haste makes waste.","في العجلة الندامة وفي التأنّي السلامة","Hâte-toi lentement."],
  ["The pen is mightier than the sword.","Writing and ideas have more power than violence.","A good article can change minds: the pen is mightier than the sword.","القلم أقوى من السيف","La plume est plus forte que l'épée."],
  ["Silence is golden.","Sometimes it is wiser to say nothing.","He wanted to argue, but he knew that silence is golden.","إذا كان الكلام من فضّة فالسكوت من ذهب","La parole est d'argent, le silence est d'or."],
  ["Birds of a feather flock together.","People with similar interests like to be together.","The book lovers always sit together. Birds of a feather flock together.","الطيور على أشكالها تقع","Qui se ressemble s'assemble."],
  ["Out of sight, out of mind.","We forget people or things we no longer see.","Put your vocabulary list on the wall, or it will be out of sight, out of mind.","بعيد عن العين بعيد عن القلب","Loin des yeux, loin du cœur."],
  ["All that glitters is not gold.","Something attractive on the outside is not always valuable.","That website looks impressive, but all that glitters is not gold: check your sources.","ليس كلّ ما يلمع ذهبًا","Tout ce qui brille n'est pas or."],
  ["Don't count your chickens before they hatch.","Don't be sure of a result before it happens.","Wait for the official marks. Don't count your chickens before they hatch.","لا تبع جلد الدبّ قبل صيده","Il ne faut pas vendre la peau de l'ours avant de l'avoir tué."],
  ["There's no smoke without fire.","If people talk about something, it is probably partly true.","Everyone says the exam will be hard. There's no smoke without fire.","لا دخان بلا نار","Il n'y a pas de fumée sans feu."],
  ["Necessity is the mother of invention.","When we really need something, we find creative ways to get it.","With no printer, she shared the booklet online. Necessity is the mother of invention.","الحاجة أمّ الاختراع","La nécessité est mère de l'invention."],
  ["A word to the wise is enough.","An intelligent person understands a short warning.","The deadline is Friday. A word to the wise is enough.","اللبيب بالإشارة يفهم","À bon entendeur, salut."],

  ["Look before you leap.","Think carefully before you act.","Read the whole text before you translate. Look before you leap.","فكّر قبل أن تُقدِم","Il faut réfléchir avant d'agir."],
  ["You reap what you sow.","The results you get depend on what you did before.","She worked hard all year and got excellent marks. You reap what you sow.","كما تزرع تحصد","On récolte ce que l'on sème."],
  ["Honesty is the best policy.","Telling the truth is always the best choice.","Always cite your sources. Honesty is the best policy.","الصدق منجاة","L'honnêteté est toujours récompensée."],
  ["No pain, no gain.","You need effort to achieve something good.","Learning 20 new words a week is hard, but no pain, no gain.","من طلب العُلا سهر الليالي","On n'a rien sans peine."],
  ["Strike while the iron is hot.","Act quickly while you have a good opportunity.","The teacher is offering extra help this week. Strike while the iron is hot.","اضرب الحديد وهو حامٍ","Il faut battre le fer pendant qu'il est chaud."],
  ["Don't put all your eggs in one basket.","Don't depend on only one plan or option.","Apply to several programmes. Don't put all your eggs in one basket.","لا تضع كلّ البيض في سلّة واحدة","Il ne faut pas mettre tous ses œufs dans le même panier."],
  ["It's never too late to learn.","You can learn new things at any age.","My grandfather started English at seventy. It's never too late to learn.","اطلبوا العلم من المهد إلى اللحد","Il n'est jamais trop tard pour apprendre."],

  ["Curiosity killed the cat.","Being too curious can get you into trouble.","Don't read other people's messages. Curiosity killed the cat.","من تدخّل فيما لا يعنيه لقي ما لا يُرضيه","La curiosité est un vilain défaut."]

function dayIndex(){ var n=new Date(), s=new Date(n.getFullYear(),0,0); return Math.floor((n-s)/86400000) + n.getFullYear()*366; }
function weekIndex(){ return Math.floor(dayIndex()/7); }
function todayProverb(){ return PROVERBS[dayIndex() % PROVERBS.length]; }
function todayWord(){ return WORDS[(dayIndex()*7+3) % WORDS.length]; }
function weekQuote(){ return QUOTES[weekIndex() % QUOTES.length]; }

var COURSE_QUIZ = {"aw": {"label": "Academic Writing", "course": "Academic Writing · L3", "units": [{"id": "s1-genres", "label": "Semester 1 · Genres and register", "qs": [{"p": "“This study examines code-switching in 24 recorded EFL lessons at two Tunisian universities. Results indicate that…”\nWhich genre is this extract most likely from?", "o": ["A research article", "A report with recommendations", "An argumentative essay", "A thesis chapter plan"], "w": "It presents new findings to specialists (“This study examines… Results indicate…”): the typical moves of a research article."}, {"p": "“Following the survey, we recommend that the library extend its opening hours during examination periods.”\nWhich genre is this?", "o": ["A report", "A research article", "An abstract", "An essay"], "w": "Reports inform decision-makers and end with recommendations; the verb “recommend” is the clue."}, {"p": "Which sentence is in the most appropriate academic register?", "o": ["Many readers consider that social media has reduced sustained reading.", "Lots of people think social media is killing reading.", "It’s obvious that social media kills reading.", "Everybody knows reading is dying because of phones."], "w": "Academic register means precision, economy and distance: no contractions, no exaggeration, no vague “lots of”."}, {"p": "According to Swales and Feak, which list gives the six considerations for planning every text?", "o": ["Audience, purpose, organisation, style, flow, presentation", "Title, author, date, edition, abstract, index", "Claim, reasons, evidence, warrant, qualifier, rebuttal", "Background, aim, method, results, conclusion, keywords"], "w": "Swales and Feak plan every text around audience, purpose, organisation, style, flow and presentation."}]}, {"id": "s1-summary", "label": "Semester 1 · Writing a summary", "qs": [{"p": "A summary answers the question “What does the text do, how, and how well?”. What kind of summary is it?", "o": ["An analytical summary", "A descriptive summary", "A list summary", "A closest-cousin summary"], "w": "Descriptive summaries say what a text says; analytical summaries examine what it does, how, and how well."}, {"p": "Graff and Birkenstein warn against the “closest-cousin” summary. What is the problem with it?", "o": ["The writer’s own views slip into the summary", "It lists points with no focus", "It is too short", "It quotes too much"], "w": "In a closest-cousin summary the writer’s own opinions replace the author’s. The list summary is the other failure: points with no focus."}, {"p": "Which reporting verb signals critical distance from the author’s claim?", "o": ["claims", "states", "demonstrates", "notes"], "w": "“Claims, alleges, assumes, purports” keep distance. “States, notes” are neutral; “demonstrates” is strong and accepting."}, {"p": "Which is the best way to begin a summary?", "o": ["Ben Salah (2024) argues that screen reading weakens slow, connected reading.", "In this text there are many interesting ideas about reading.", "I think the author is right about phones.", "The text says a lot of things about students."], "w": "Name the author early with a reporting verb, then give the main claim in your own words."}]}, {"id": "s1-paraphrase", "label": "Semester 1 · Paraphrasing and plagiarism", "qs": [{"p": "Original: “What seems to suffer is not attention as such but slow, connected reading.” (Ben Salah, 2024, p. 23)\nVersion: “What seems to be damaged is not attention in itself but slow, linked reading.”\nWhat is this version?", "o": ["Patchwriting: the original structure with a few words changed", "An acceptable paraphrase", "A correct direct quotation", "A summary of the whole article"], "w": "Keeping the author’s sentence pattern and swapping a few synonyms is patchwriting, which counts as plagiarism, even with a citation."}, {"p": "Which version is an acceptable paraphrase of the same sentence?", "o": ["According to Ben Salah (2024), screens harm the ability to read slowly and connect ideas more than they harm attention itself.", "What appears to suffer is not attention as such but slow, connected reading.", "Not attention but slow connected reading suffers.", "Screens harm slow, connected reading (no source needed because the words are mine)."], "w": "A paraphrase restructures the idea in your own words and still cites the source."}, {"p": "“Critics have largely ignored her later poems.” → “Her later poems have received little critical attention.” Which technique is used?", "o": ["Change of voice", "Change of word class only", "Splitting the sentence", "Keeping technical terms"], "w": "The agent (critics) disappears and the poems become the subject: a change of voice."}, {"p": "Which of these counts as plagiarism under the department’s rules?", "o": ["Submitting a paragraph written by a generative-AI tool as your own", "Quoting a sentence in quotation marks with a citation", "Paraphrasing an idea and citing its author", "Keeping the technical term “free indirect discourse” in a paraphrase"], "w": "Submitting text produced by an AI tool or another person as your own is listed among the forms of plagiarism."}]}, {"id": "s1-critical", "label": "Semester 1 · Reading critically", "qs": [{"p": "“The Waste Land was first published in 1922.” What is this statement?", "o": ["A fact: it can be checked", "An opinion", "A claim to be argued", "A false “fact”"], "w": "A fact can be checked. An opinion expresses a preference; a claim is an arguable position supported by evidence."}, {"p": "Which source is “reliable by default” according to Booth et al.?", "o": ["An article in a peer-reviewed journal", "An anonymous web page", "A blog post with no references", "An AI-generated summary"], "w": "Start with reputable presses, peer-reviewed journals and recognised scholars, then still check currency, relevance and evidence."}, {"p": "A website gives a striking statistic with no source. What should you do?", "o": ["Check it laterally in other trusted sources before using it", "Cite it, because numbers are always facts", "Use it but remove the number", "Quote it as an opinion"], "w": "Numbers with no source may be false “facts”: check them laterally in other trusted sources."}]}, {"id": "s1-apa", "label": "Semester 1 · APA citation and annotations", "qs": [{"p": "Which APA reference for a book is correctly formatted?", "o": ["Murray, N. (2012). Writing essays in English language and linguistics. Cambridge University Press.", "Murray, Neil. Writing Essays in English Language and Linguistics. Cambridge UP, 2012.", "N. Murray, Writing Essays (Cambridge, 2012)", "Murray (2012) Writing Essays in English Language and Linguistics, Cambridge University Press"], "w": "APA: surname and initials, year in brackets, title in sentence case (in italics), publisher. The second option is MLA."}, {"p": "What is the correct APA parenthetical citation for a work by three or more authors?", "o": ["(Booth et al., 2024)", "(Booth, Colomb, Williams, et al. 2024)", "(Booth et al. 2024, p.)", "(Booth and others, 2024)"], "w": "APA uses the first author + et al., a comma, then the year: (Booth et al., 2024)."}, {"p": "“Its examples are clear, but it rarely addresses literary essays.” Which type of annotation is this sentence typical of?", "o": ["Evaluative", "Descriptive", "Summative", "Reflective"], "w": "Evaluative annotations summarise, then assess strengths and limits."}, {"p": "“This framework will structure my second section.” Which type of annotation is this?", "o": ["Reflective", "Descriptive", "Summative", "Evaluative"], "w": "Reflective annotations explain how the source serves your own project."}]}, {"id": "s1-synthesis", "label": "Semester 1 · Synthesizing sources and revision", "qs": [{"p": "How should the body paragraphs of a synthesis paper be organised?", "o": ["Theme by theme, showing how sources agree, extend or contradict each other", "One source per paragraph", "In the order you read the sources", "Chronologically, by publication date only"], "w": "A synthesis discusses one idea per paragraph and puts sources in dialogue; source-by-source writing is a series of summaries."}, {"p": "How do you list several sources in one APA parenthesis?", "o": ["(Ayari, 2020; Brown & Lee, 2018; Chen, 2022)", "(Chen, 2022, Ayari, 2020, Brown & Lee, 2018)", "(Ayari 2020 / Brown & Lee 2018 / Chen 2022)", "(Ayari et al., 2018–2022)"], "w": "List them alphabetically, separated by semicolons."}, {"p": "“Your second paragraph discusses only Brown & Lee; the theme of exposure disappears; could you bring Chen in?” Which feedback pattern is this?", "o": ["Describe → Evaluate → Suggest", "Praise → Criticise → Praise", "Summary → Quotation → Comment", "Claim → Reason → Evidence"], "w": "Useful peer feedback is specific, text-based and actionable: describe, evaluate, then suggest."}, {"p": "Booth et al. recommend revising “from the outside in”. What comes first?", "o": ["The claim and the structure", "Spelling and punctuation", "Word choice", "Formatting the reference list"], "w": "Revise the argument and organisation first, then paragraphs, then sentences and words; proofreading comes last."}]}, {"id": "s1-stance", "label": "Semester 1 · Expressing stance", "qs": [{"p": "“The evidence suggests that this may partly explain the decline.” Which stance markers dominate?", "o": ["Hedges", "Boosters", "Attitude markers", "Self-mention"], "w": "“Suggests”, “may”, “partly” withhold full commitment: they are hedges."}, {"p": "Which word is a booster?", "o": ["undoubtedly", "possibly", "tend to", "appear"], "w": "Boosters express certainty and close down alternatives: clearly, demonstrate, in fact, undoubtedly."}, {"p": "“Brown and Lee claim that…” vs “Brown and Lee show that…”. What changes?", "o": ["With “claim” the writer keeps distance; with “show” the writer accepts the finding", "Nothing: they are synonyms", "“Claim” is more formal", "“Show” is a hedge"], "w": "Reporting verbs carry stance: “show” accepts the finding, “claim” distances the writer from it."}]}, {"id": "s1-data", "label": "Semester 1 · Data commentaries", "qs": [{"p": "What should a data commentary NOT do?", "o": ["Repeat every figure in the table", "Highlight the most significant results", "Explain and qualify the results", "Point to the table and state its overall message"], "w": "Swales and Feak: a data commentary highlights what is significant, explains it and qualifies it; it does not repeat every figure."}, {"p": "Which sentence uses the right tenses?", "o": ["Table 2 shows that the essays collected in 2025 were longer.", "Table 2 showed that the essays collected in 2025 are longer.", "Table 2 will show that the essays are collected in 2025.", "Table 2 has shown that the essays were being collected."], "w": "Present for what the table shows; past for what was done."}, {"p": "Which wording is appropriate for interpreting data?", "o": ["This may indicate a preference for screen reading.", "This proves that students prefer screens.", "This is the absolute proof of our hypothesis.", "Obviously, everyone prefers screens."], "w": "Qualify interpretations (may indicate, appears to); avoid “prove”."}, {"p": "Following APA, how should these numbers appear in running text?", "o": ["seven essays, 14 students, 13%", "7 essays, fourteen students, thirteen percent", "seven essays, fourteen students, 13 per cent", "7 essays, 14 students, thirteen %"], "w": "APA: words for one to nine, figures for 10 and above, figures for percentages."}]}, {"id": "s1-abstract", "label": "Semester 1 · Writing the abstract", "qs": [{"p": "What is the usual APA maximum length for an abstract?", "o": ["250 words", "100 words", "500 words", "One page, any length"], "w": "APA limits abstracts to 250 words; many journals ask for 150–250 words plus 3–5 keywords."}, {"p": "“The paper discusses irony in Chopin’s story.” What kind of abstract sentence is this?", "o": ["Indicative: it only describes what the paper covers", "Informative: it reports a finding", "A results move", "A citation"], "w": "An indicative abstract describes the content; an informative one reports what was found (“The analysis shows that…”)."}, {"p": "Which element should an abstract NOT contain?", "o": ["Citations of other sources", "The aim and thesis", "The method", "The main results"], "w": "An abstract stands alone: no citations and no information absent from the paper."}]}, {"id": "s2-argument", "label": "Semester 2 · What is argument?", "qs": [{"p": "A literary argument shows the writer’s accuracy, fairness to other readings and careful citation. Which appeal is this?", "o": ["Ethos", "Logos", "Pathos", "Kairos"], "w": "Ethos persuades through the writer’s credibility; logos through reasoning and evidence; pathos through the audience’s values."}, {"p": "In Toulmin’s model, “Repeated private speech reveals a character’s true feeling” links the evidence to the claim. What is it?", "o": ["The warrant", "The grounds", "The qualifier", "The rebuttal"], "w": "The warrant is the general principle explaining why the evidence supports the claim."}, {"p": "Which is an arguable claim?", "o": ["The mother’s instructions in “Girl” protect as much as they oppress.", "“Girl” was written by Jamaica Kincaid.", "“Girl” is set in Antigua.", "I really like “Girl”."], "w": "A claim must be specific and arguable: not a fact, not a plot detail, not a personal preference."}, {"p": "How does a developed academic argument differ from the five-paragraph essay?", "o": ["It includes a naysayer section where an objection is stated and answered", "It always has exactly three body paragraphs", "It repeats the thesis in the conclusion", "It avoids opposing views"], "w": "A developed argument plants a naysayer, builds sections on each other and ends with implications, not repetition."}]}, {"id": "s2-literature", "label": "Semester 2 · Arguing about literature and close reading", "qs": [{"p": "Which sentence follows the convention of the literary present?", "o": ["The mother instructs her daughter in how to behave.", "The mother instructed her daughter in how to behave.", "The mother had instructed her daughter.", "The mother will instruct her daughter."], "w": "Write about literary texts in the present tense: the mother warns, not warned."}, {"p": "“Is ‘Girl’ a short story, a prose poem or a dramatic monologue?” Which type of issue is this?", "o": ["Definition", "Theme", "Symbolism", "Social policy"], "w": "Questions about what category a text belongs to are issues of definition."}, {"p": "“How does colonial Antigua shape the mother’s values?” Which type of issue is this?", "o": ["Contextualisation", "Fact", "Evaluation", "Pattern"], "w": "Placing a text in its historical or cultural context is contextualisation."}, {"p": "In close reading, what is the third reading for?", "o": ["Interpretation: choosing a pattern and asking what it means", "Orientation: who speaks, to whom", "Checking the spelling of names", "Summarising the plot"], "w": "First reading: orientation; second: annotation; third: interpretation, which becomes your issue."}]}, {"id": "s2-comparative", "label": "Semester 2 · The comparative paper and quotations", "qs": [{"p": "Which organisation is better for a sustained comparison, though it needs strong transitions?", "o": ["Point by point (issue by issue)", "Block (text by text)", "Chronological", "Alphabetical"], "w": "Point-by-point treats both texts in each section; block organisation risks two separate essays."}, {"p": "Which is a strong comparative thesis?", "o": ["Although both stories present a speaker who instructs a silent listener, Orozco hides violence behind routine while Kincaid makes judgement explicit.", "Both stories are interesting and have similarities and differences.", "“Orientation” and “Girl” are two stories.", "This essay will compare two stories."], "w": "A comparative claim names the similarity, the difference within it, and what that difference reveals."}, {"p": "What is the “quotation sandwich”?", "o": ["Introduce the quotation, quote only what matters, then explain it", "Put two quotations around your own sentence", "Quote, then quote again in the conclusion", "Use only block quotations"], "w": "Quotations do not speak for themselves: introduce, quote, explain (Graff and Birkenstein)."}, {"p": "In MLA, how do you show that words were left out of a quotation?", "o": ["With an ellipsis: …", "With square brackets around the whole quotation", "With a dash", "With “etc.”"], "w": "MLA: omit words with an ellipsis; add or change words in [square brackets]."}]}, {"id": "s2-mla", "label": "Semester 2 · Research and MLA style", "qs": [{"p": "Which MLA in-text citation is correct?", "o": ["(Kincaid 3)", "(Kincaid, 3)", "(Kincaid, p. 3)", "(Kincaid, 1978, p. 3)"], "w": "MLA: author + page, no comma and no “p.”. (Kincaid, 1978, p. 3) is APA."}, {"p": "In a database search, what does Kincaid AND colonialism do?", "o": ["Narrows the results to sources containing both terms", "Widens the results", "Excludes colonialism", "Searches for the exact phrase"], "w": "AND narrows, OR widens, NOT excludes; quotation marks search for an exact phrase."}, {"p": "How do you cite a source quoted inside another source in MLA?", "o": ["(qtd. in Surname 27)", "(Surname, cited 27)", "(in Surname, p. 27)", "(Surname et al. 27)"], "w": "For an indirect source MLA uses “qtd. in”."}, {"p": "Which is the standard index of scholarship on literature, language and linguistics?", "o": ["MLA International Bibliography", "Google Images", "Wikipedia", "A general newspaper archive"], "w": "The MLA International Bibliography is the standard index; JSTOR and Project MUSE provide full texts."}]}]}, "tt": {"label": "Technical Translation", "course": "Technical Translation · L3", "units": [{"id": "tt-foundations", "label": "Foundations · What is technical translation?", "qs": [{"p": "Newmark (1988) distinguishes scientific from technological language. Which pairing is his?", "o": ["Scientific language is concept-centred; technological language is object-centred", "Scientific language is object-centred; technological language is concept-centred", "Both are expressive", "Both are literary"], "w": "Newmark: scientific language is concept-centred, technological language object-centred."}, {"p": "What is the “golden rule” of the technical translator?", "o": ["Understand before you translate", "Translate word for word", "Always use machine translation first", "Never consult a specialist"], "w": "If you cannot explain the source to a non-specialist in your own words, you are not ready to translate it."}, {"p": "Which of these must stay unchanged in a technical translation?", "o": ["Numbers, units and version numbers (400 mg, 45 °C, version 3.2)", "The order of every word", "The English punctuation", "The source text’s font"], "w": "One of the five questions: what must stay unchanged? Numbers, units, names and formatting."}]}, {"id": "tt-skopos", "label": "Foundations · Skopos and the translation brief", "qs": [{"p": "A translated notice is posted in a building so that Arabic-speaking tenants can act on it. Which kind of translation is this (Nord)?", "o": ["Instrumental", "Documentary", "Literal", "Interlinear"], "w": "Instrumental translation works on its own as a message in the target culture (a notice, a leaflet, a manual)."}, {"p": "A birth certificate is translated for use as evidence before an authority. Which kind of translation is required?", "o": ["Documentary", "Instrumental", "Transcreation", "Gist translation"], "w": "Documentary translation documents the source for readers who know they are reading a translation."}, {"p": "In skopos theory, what determines the translation strategy?", "o": ["The purpose of the target text", "The form of the source text", "The length of the source text", "The translator’s personal taste"], "w": "Reiss and Vermeer: the purpose (skopos) of the target text, not the form of the source, decides the strategy."}]}, {"id": "tt-terms", "label": "Foundations · Terminology", "qs": [{"p": "“computer → حاسوب (root ح-س-ب)”. Which Arabic term-formation strategy is this?", "o": ["Derivation (اشتقاق)", "Arabicisation (تعريب)", "Calque", "Blending (نحت)"], "w": "A new word on an Arabic root and pattern is derivation."}, {"p": "“cloud computing → الحوسبة السحابية”. Which strategy is this?", "o": ["Calque (rendering the parts one by one)", "Derivation", "Arabicisation", "Acronym"], "w": "Each element is translated in turn: a calque."}, {"p": "“virus → فيروس”. Which strategy is this?", "o": ["Arabicisation (تعريب)", "Semantic extension", "Blending", "Derivation"], "w": "The foreign term is adapted to Arabic sound and script."}, {"p": "A manual says «حاسوب» on page 1 and «كمبيوتر» on page 12. What principle is broken?", "o": ["Consistency: one concept, one term", "Monosemy of general words", "Arabicisation", "Documentary translation"], "w": "Record each decision in a termbase and keep one term per concept throughout the text."}]}, {"id": "tt-syntax", "label": "Foundations · English and Arabic sentence structure", "qs": [{"p": "How should “engine oil pressure warning light” be translated into Arabic?", "o": ["مصباح تحذير ضغط زيت المحرك", "محرك زيت ضغط تحذير مصباح", "ضوء المحرك الزيتي المحذر", "مصباح زيت المحرك"], "w": "English pre-modifiers are read from right to left: in Arabic the head noun comes first, then the genitive chain (الإضافة)."}, {"p": "“The sample was heated.” Which Arabic rendering does the booklet recommend?", "o": ["سُخِّنت العيّنة", "تمّ تسخين العيّنة", "سوف يتم تسخين العينة", "العينة كانت ساخنة"], "w": "Prefer a true passive or an active verb; the calque «يتم + verbal noun» is widespread but heavy."}, {"p": "“If the level drops, refill the tank.” How is the real condition usually rendered?", "o": ["إذا انخفض المستوى، املأ الخزان.", "لو كان المستوى ينخفض، كنت ستملأ الخزان.", "إن ينخفض المستوى يملأ الخزان.", "عندما المستوى ينخفض املأ."], "w": "A real condition: إذا + past tense."}]}, {"id": "tt-medical-pil", "label": "Medical · Patient information leaflets", "qs": [{"p": "A patient leaflet says “Take one tablet twice daily”. Which Arabic rendering keeps the leaflet’s conventions?", "o": ["تناول قرصًا واحدًا مرتين يوميًا.", "يتم تناول الأقراص حسب الحاجة.", "يُنصح بتناول الدواء أحيانًا.", "تناول الدواء يوميًا."], "w": "Leaflets use direct address and imperatives, and dose and frequency must be exact."}, {"p": "The source says only “Take daily.” What should the translator do?", "o": ["Query the client before translating", "Add “twice” to be helpful", "Translate “take when needed”", "Leave the instruction out"], "w": "Never add, omit or soften safety information; if the source is unclear, ask the client."}, {"p": "How should a frequency label such as “Common (may affect up to 1 in 10 people)” be treated?", "o": ["With the standard formula: شائعة (قد تصيب ما يصل إلى شخص واحد من كل 10 أشخاص)", "Freely, as the translator prefers", "By deleting the figures", "As «أحيانًا» only"], "w": "Side-effect frequency labels follow a standard, regulated formula."}]}, {"id": "tt-medical-terms", "label": "Medical · Terms, abbreviations and ethics", "qs": [{"p": "“appendectomy”: the suffix -ectomy means surgical removal. Which Arabic equivalent follows the established pattern?", "o": ["استئصال الزائدة الدودية", "التهاب الزائدة الدودية", "فغر الزائدة الدودية", "فحص الزائدة الدودية"], "w": "-ectomy → استئصال; -itis → التهاب; -ostomy → فغر."}, {"p": "“hepatitis” is built with -itis. What does it mean in Arabic?", "o": ["التهاب الكبد", "استئصال الكبد", "فقر الدم", "تضخم الكبد"], "w": "-itis means inflammation: hepatitis → التهاب الكبد."}, {"p": "A test result is “positive”. Why can this be a trap?", "o": ["In medicine a positive result often means the condition is present, i.e. bad news", "Positive always means good news", "It must always be translated as «جيد»", "It is an eponym"], "w": "False friends: a positive test (نتيجة إيجابية) often means the disease was detected."}, {"p": "You must translate a patient’s discharge letter. What must you do before using an online tool?", "o": ["Anonymise the data, and never paste patient texts into public tools", "Paste it directly to save time", "Ask the patient on social media", "Remove the diagnosis"], "w": "Confidentiality: anonymise patient data and never upload patient texts to public online tools."}]}, {"id": "tt-legal-contracts", "label": "Legal · Contracts", "qs": [{"p": "“The tenant shall pay the rent on the first day of each month.” How is “shall” best rendered?", "o": ["يلتزم المستأجر بدفع معين الكراء في اليوم الأول من كل شهر.", "سوف يدفع المستأجر الكراء في اليوم الأول من كل شهر.", "يمكن للمستأجر أن يدفع الكراء.", "ربما يدفع المستأجر الكراء."], "w": "In legal English “shall” expresses obligation, not the future: use يلتزم / يجب / the present tense, and avoid «سوف»."}, {"p": "“The buyer may terminate the contract.” Which Arabic verb renders “may”?", "o": ["يحقّ للمشتري / يجوز للمشتري", "يجب على المشتري", "يُحظر على المشتري", "سوف يفسخ المشتري"], "w": "“May” expresses permission or a right: يجوز / يحقّ له."}, {"p": "A Tunisian contract refers to “Article 5”. Which word do Tunisian codes use?", "o": ["الفصل", "المادة", "الباب", "القسم"], "w": "Tunisian codes use «الفصل»; many Mashreq countries use «المادة». The choice depends on the target readers."}, {"p": "“tort” has no exact Tunisian equivalent. The booklet proposes «المسؤولية التقصيرية». Which strategy is this?", "o": ["Functional equivalent", "Formal equivalent (calque)", "Borrowing without gloss", "Omission"], "w": "A functional equivalent is the nearest concept in the target legal system."}]}, {"id": "tt-legal-docs", "label": "Legal · Official documents and judgments", "qs": [{"p": "A birth certificate has a stamp and a signature. How does a sworn translator render them?", "o": ["In square brackets: [Stamp], [Signature]", "By describing them in a long footnote", "By leaving them out", "By drawing them"], "w": "Documentary translation marks non-verbal elements in square brackets."}, {"p": "How should a personal name be handled in a certified translation?", "o": ["Transliterated exactly as in the passport or ID", "Translated by its meaning", "Spelled as the translator prefers", "Replaced by initials"], "w": "Never translate names; follow the spelling in the official ID."}, {"p": "In an Arabic judgment, «حيث إن…» introduces the reasoning. How is it usually rendered in English?", "o": ["Whereas / Considering that…", "Therefore the court held…", "In the name of the people", "Whoever… shall be punished"], "w": "«حيث إن» is the reasoning marker; «قضت المحكمة» introduces the operative part (The court held / ruled)."}]}, {"id": "tt-instructions", "label": "Technical · Instructions and safety warnings", "qs": [{"p": "Which signal word indicates an imminent hazard that can cause death or serious injury?", "o": ["DANGER → خطر", "WARNING → تحذير", "CAUTION → تنبيه", "NOTICE → ملاحظة"], "w": "Keep the hierarchy of signal words (ISO 3864, ANSI Z535): DANGER is the highest level."}, {"p": "What is the main quality criterion for translating a user manual (Byrne)?", "o": ["Usability: the user can act correctly on it", "Mirroring the source sentence by sentence", "Using the longest Arabic words", "Keeping all English punctuation"], "w": "Quality is usability: effectiveness, efficiency and satisfaction."}, {"p": "The English says “tighten firmly” but gives no torque value. What do you do?", "o": ["Ask the author or client; if impossible, choose the safest reading and add a translator’s note", "Invent a value", "Delete the step", "Translate it as «اربط قليلًا»"], "w": "Never guess silently: query, or make the safest reading explicit in a note."}, {"p": "Why should each step of an instruction contain only one action?", "o": ["So that users can follow the steps in order without missing an action", "To make the manual longer", "Because Arabic forbids long sentences", "To save ink"], "w": "Instructions: one action per step, chronological and numbered."}]}, {"id": "tt-software", "label": "Technical · Software, scientific texts and machine translation", "qs": [{"p": "How should the UI string “%d files selected” be translated?", "o": ["الملفات المحدّدة: %d", "%d ملفات محددة جدًا", "الملفات المحددة", "تم تحديد الملفات"], "w": "Keep placeholders such as %d intact, and rephrase to avoid number agreement problems."}, {"p": "A scientific abstract says “The results suggest that…”. Which Arabic is proportionate?", "o": ["تشير النتائج إلى أن…", "تثبت النتائج بشكل قاطع أن…", "من المؤكد أن…", "تبرهن النتائج نهائيًا أن…"], "w": "Hedging must be preserved: never turn “suggests” into “proves”."}, {"p": "What is light post-editing of machine translation?", "o": ["Correcting only meaning, terminology and basic grammar errors", "Bringing the text to full human quality", "Retranslating from scratch", "Reformatting the layout"], "w": "Light post-editing fixes meaning, terms and basic grammar; full post-editing reaches human-translation quality."}, {"p": "What should you check first in a machine-translated technical text?", "o": ["Numbers, negation, names and terms", "Font size", "Paragraph length", "The colour of headings"], "w": "NMT is fluent but can hide errors: check numbers, negation, names and terms first."}]}, {"id": "tt-news", "label": "Media · News translation", "qs": [{"p": "Selecting, condensing, reordering and rewriting news for a new audience is called:", "o": ["Transediting", "Transcreation", "Subtitling", "Back-translation"], "w": "News translation is transediting (Stetting 1989; Bielsa & Bassnett 2009)."}, {"p": "“Inflation eases to 7%”. Which Arabic headline follows Arabic conventions?", "o": ["تراجع التضخم إلى 7%", "التضخم يسهل إلى 7%", "تضخم سهل 7%", "سوف يتراجع التضخم"], "w": "Arabic headlines are often nominal; do not imitate English article-dropping or translate “eases” literally."}, {"p": "A minister “said” something. Which Arabic reporting verb is accurate?", "o": ["قال", "حذّر", "هاجم", "اعترف"], "w": "Match the source: “said” is neutral (قال). Do not add stance with a more dramatic verb."}]}, {"id": "tt-avt", "label": "Media · Subtitling and campaigns", "qs": [{"p": "What is the usual maximum number of lines for a subtitle?", "o": ["2", "1", "3", "4"], "w": "Subtitles: maximum two lines, about 35–42 characters per line."}, {"p": "What is a usual reading speed for subtitles?", "o": ["About 12–17 characters per second", "About 50 characters per second", "About 2 words per minute", "There is no limit"], "w": "Reading speed is around 12–17 characters per second, depending on the audience."}, {"p": "A slogan is recreated for its effect rather than its words. What is this called?", "o": ["Transcreation", "Documentary translation", "Calque", "Back-translation"], "w": "Campaign texts are often transcreated: the effect is recreated, respecting cultural sensitivities."}, {"p": "In a two-speaker subtitle, how is the change of speaker shown?", "o": ["A dash at the start of each speaker’s line", "Quotation marks", "Different colours only", "Brackets around the second speaker"], "w": "Dialogue: a dash at the start of each speaker’s line."}]}]}};
function newCourseQuiz(cid, uid){
  var c = COURSE_QUIZ[cid]; if (!c) return;
  var unit = null, pool = [];
  c.units.forEach(function(u){ if (uid && u.id===uid) unit = u; });
  if (unit) pool = unit.qs.map(function(q){ return {q:q, label:unit.label}; });
  else c.units.forEach(function(u){ u.qs.forEach(function(q){ pool.push({q:q, label:u.label}); }); });
  var picked = shuffle(pool).slice(0, unit ? pool.length : 10);
  QUIZ = {kind:"course", cid:cid, uid:uid||"", title: c.label + (unit ? " · " + unit.label.split(" · ").slice(-1)[0] : " · Mixed test"), i:0, score:0, picked:null,
    qs: picked.map(function(x){ return {prompt:x.q.p, hint:x.label, opts:shuffle(x.q.o), answer:x.q.o[0], extra:x.q.w, long:true}; })};
}
function quizMenu(){
  var courses = Object.keys(COURSE_QUIZ).map(function(cid){
    var c = COURSE_QUIZ[cid], n = c.units.reduce(function(a,u){ return a+u.qs.length; },0);
    return '<div class="cq-card'+(ui.qpick===cid?' focus':'')+'" id="cq-'+cid+'"><div class="cq-head"><span class="cc-arch">'+svg(RI.courses,20)+'</span><div><h3>'+esc(c.label)+'</h3><small>'+n+' questions from your course booklet · '+c.units.length+' units</small></div></div>'
      + '<button class="btn btn-primary" data-act="cquiz" data-c="'+cid+'" data-u="">Mixed test · 10 questions</button>'
      + '<div class="cq-units">'+c.units.map(function(u){ return '<button class="cq-unit" data-act="cquiz" data-c="'+cid+'" data-u="'+u.id+'">'+esc(u.label)+'<span>'+u.qs.length+'</span></button>'; }).join("")+'</div></div>';
  }).join("");
  return '<div class="cq-grid">'+courses+'</div>'
    + '<div class="wz-quiz-start cq-games"><h3>Language games</h3><p>Eight quick questions on proverbs or vocabulary.</p><div class="owner-actions"><button class="btn btn-ghost" data-act="quiz" data-kind="proverbs">Proverbs quiz</button><button class="btn btn-ghost" data-act="quiz" data-kind="words">Vocabulary quiz</button></div></div>';
}

var QUIZ = null;
function shuffle(a){ a=a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function newQuiz(kind){
  var pool = kind==="words" ? WORDS : PROVERBS;
  var qs = shuffle(pool).slice(0,8).map(function(item){
    var others = shuffle(pool.filter(function(x){ return x.id!==item.id; })).slice(0,3);
    var opts = shuffle([item].concat(others));
    return kind==="words"
      ? {prompt:item.def, hint:"Which word matches this definition?", opts:opts.map(function(o){return o.word;}), answer:item.word, extra:item.ex}
      : {prompt:item.en, hint:"What does this proverb mean?", opts:opts.map(function(o){return o.meaning;}), answer:item.meaning, extra:"Arabic: "+item.ar+"  ·  French: "+item.fr};
  });
  QUIZ = {kind:kind, title: kind==='words' ? 'Vocabulary quiz' : 'Proverbs quiz', qs:qs, i:0, score:0, picked:null};
}
function proverbCard(p, big){
  return '<article class="wz-card wz-proverb'+(big?' big':'')+'">'+(big?'<span class="wz-label">Proverb of the day</span>':'')
    + '<blockquote>'+esc(p.en)+'</blockquote><p class="wz-mean">'+esc(p.meaning)+'</p>'
    + '<p class="wz-ex"><span>Example</span>'+esc(p.ex)+'</p>'
    + '<div class="wz-eq"><div lang="ar" class="ar"><span>Arabic</span>'+esc(p.ar)+'</div><div lang="fr"><span>French</span>'+esc(p.fr)+'</div></div></article>';
}
function wordCard(w, big){

/* ---------- Continue reading + search inside PDFs ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lastRead(){ var id=lsGet("wm-last"); if(!id) return null; var m=state.materials.find(function(x){return x.id===id && hasPdf(x);}); if(!m) return null; return {m:m, page: parseInt(lsGet("wm-p-"+m.assetId)||"1",10)||1}; }
var PDFTEXT = {}, SEARCH = {busy:false, q:"", results:null, note:""};
async function pdfPages(m){
  if (PDFTEXT[m.assetId]) return PDFTEXT[m.assetId];
  await loadPdfjs();
  var pdf = await window.pdfjsLib.getDocument({url:pdfUrl(m), disableRange:true, disableStream:true}).promise, out=[];
  for (var p=1; p<=pdf.numPages; p++){ var tc = await (await pdf.getPage(p)).getTextContent(); out.push(tc.items.map(function(it){return it.str;}).join(" ").replace(/\s+/g," ")); }
  try{ pdf.destroy(); }catch(e){}
  PDFTEXT[m.assetId] = out; return out;
}
async function searchPdfs(q){
  q = q.trim(); if (q.length<2){ SEARCH.note="Type at least 2 letters."; SEARCH.results=null; render(); return; }
  var list = state.materials.filter(hasPdf); SEARCH.busy=true; SEARCH.q=q; SEARCH.results=[]; SEARCH.note="Searching…"; render();
  var ql=q.toLowerCase();
  for (var i=0;i<list.length;i++){
    SEARCH.note = "Searching "+(i+1)+" of "+list.length+" PDFs…"; var nt=document.getElementById("ps-note"); if(nt) nt.textContent=SEARCH.note;
    try { var pages = await pdfPages(list[i]);
      pages.forEach(function(txt, k){ var at = txt.toLowerCase().indexOf(ql); if (at>=0 && SEARCH.results.length<60){
        var a=Math.max(0,at-70), b=Math.min(txt.length, at+q.length+70);
        SEARCH.results.push({m:list[i], page:k+1, pre:(a>0?"…":"")+txt.slice(a,at), hit:txt.slice(at,at+q.length), post:txt.slice(at+q.length,b)+(b<txt.length?"…":"")}); } });
    } catch(e){}
  }
  SEARCH.busy=false; SEARCH.note = SEARCH.results.length ? SEARCH.results.length+" result"+(SEARCH.results.length>1?"s":"")+" for “"+q+"”" : "No result for “"+q+"”. Scanned PDFs (pictures of pages) can't be searched."; render();
}
function readExtras(){
  var lr = lastRead(), html = "";
  if (lr) html += '<button class="continue" data-act="read" data-id="'+lr.m.id+'"><span class="cc-arch">'+svg(RI.booklets,20)+'</span><span class="ct"><small>Continue reading</small><b>'+esc(lr.m.title)+'</b><span>Page '+lr.page+' · '+esc(lr.m.course)+'</span></span><span class="cc-go">Resume '+I.arrow+'</span></button>';
  html += '<form class="psearch" id="ps-form"><label class="field search">'+I.search+'<input id="ps-q" type="search" placeholder="Search inside all PDFs (a word or phrase)" value="'+esc(SEARCH.q)+'" aria-label="Search inside all PDFs"></label><button class="btn btn-primary" type="submit"'+(SEARCH.busy?' disabled':'')+'>Search</button></form>';
  if (SEARCH.note) html += '<p class="ps-note" id="ps-note">'+esc(SEARCH.note)+'</p>';
  if (SEARCH.results && SEARCH.results.length) html += '<ul class="ps-results">'+SEARCH.results.map(function(r){
    return '<li><button class="ps-item" data-act="read-at" data-id="'+r.m.id+'" data-page="'+r.page+'"><span class="ps-meta"><b>'+esc(r.m.title)+'</b> · page '+r.page+'</span><span class="ps-snip">'+esc(r.pre)+'<mark>'+esc(r.hit)+'</mark>'+esc(r.post)+'</span></button></li>'; }).join("")+'</ul>';
  return html;
}

    .then(function(){ window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS+"pdf.worker.min.js"; });

   + '<button class="r-ib" data-r="out" aria-label="Zoom out">−</button><span class="r-zoom" id="r-z">Fit</span><button class="r-ib" data-r="in" aria-label="Zoom in">+</button>'

    cv.style.width=Math.floor(vp.width/dpr)+"px"; cv.style.height=Math.floor(vp.height/dpr)+"px";
    rRender = page.render({canvasContext:cv.getContext("2d"), viewport:vp}); rRender.promise.catch(function(){});
    var tl=R.el.querySelector("#r-text"), cssVp=page.getViewport({scale:R.scale});
    tl.innerHTML=""; tl.style.width=Math.floor(cssVp.width)+"px"; tl.style.height=Math.floor(cssVp.height)+"px";
    tl.style.setProperty("--scale-factor", R.scale);
    try { var tt = window.pdfjsLib.renderTextLayer({textContentSource:page.streamTextContent(), container:tl, viewport:cssVp, textDivs:[]});
      if (tt && tt.promise) tt.promise.then(function(){ var e=document.createElement("div"); e.className="endOfContent"; tl.appendChild(e); }).catch(function(){}); } catch(e){}
    hideDict();

  });

/* ---------- Dictionary ---------- */
function dictSources(w){
  var q=encodeURIComponent(w);
  return [
    ["Meaning in English","Cambridge Dictionary","EN","https://dictionary.cambridge.org/search/direct/?datasetsearch=english&q="+q],
    ["Learner's definition & pronunciation","Oxford Learner's","EN","https://www.oxfordlearnersdictionaries.com/search/english/?q="+q],
    ["English → Arabic","Cambridge Dictionary","AR","https://dictionary.cambridge.org/search/direct/?datasetsearch=english-arabic&q="+q],
    ["English → Arabic","Almaany","AR","https://www.almaany.com/en/dict/ar-en/"+q+"/"],
    ["English → French","WordReference","FR","https://www.wordreference.com/enfr/"+q]
  ];
}
function cleanWord(t){ t=String(t||"").replace(/\s+/g," ").trim(); try{ t=t.replace(/^[^\p{L}]+|[^\p{L}]+$/gu,""); }catch(e){ t=t.replace(/^[^A-Za-zÀ-ɏ؀-ۿ]+|[^A-Za-zÀ-ɏ؀-ۿ]+$/g,""); } return t; }
function dictList(w){
  if (!w) return '<div class="empty-w">Type a word above to see where to look it up.</div>';
  return '<ul>'+dictSources(w).map(function(d){ return '<li><a href="'+esc(d[3])+'" target="_blank" rel="noopener"><span><b>'+esc(d[0])+'</b><small>'+esc(d[1])+'</small></span><span class="lang">'+d[2]+'</span></a></li>'; }).join("")+'</ul>';
}

    + '<div id="r-dlist">'+dictList(word)+'</div><div class="ft">Opens in a new tab</div>';
  box.hidden=false;

  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferred = e; root.classList.add("can-install"); });
  window.addEventListener("appinstalled", function(){ deferred = null; root.classList.remove("can-install"); });
  function sheet(html){
    var old = document.querySelector(".pwa-sheet"); if (old) old.remove();
    var d = document.createElement("div"); d.className = "pwa-sheet"; d.setAttribute("role","dialog"); d.setAttribute("aria-label","Install the app");
    d.innerHTML = '<button class="pwa-close" aria-label="Close">×</button>' + html;
    d.querySelector(".pwa-close").onclick = function(){ d.remove(); };
    document.body.appendChild(d);
  }
  document.addEventListener("click", function(ev){
    var b = ev.target.closest && ev.target.closest('[data-act="install-app"]'); if (!b) return;
    ev.preventDefault(); ev.stopPropagation();
    if (deferred) { deferred.prompt(); deferred.userChoice.finally(function(){ deferred = null; }); return; }
    if (ios) sheet('<h3>Add to your Home Screen</h3><ol><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button <span aria-hidden="true">(□↑)</span>.</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol><p>The site then opens from its own icon, full screen. Booklets you have opened stay readable offline.</p>');
    else sheet('<h3>Install the app</h3><ol><li>Open your browser menu <b>⋮</b>.</li><li>Choose <b>Install app</b> or <b>Add to Home screen</b>.</li></ol><p>The site then opens from its own icon. Booklets you have opened stay readable offline.</p>');
  }, true);
})();
</script>
</body>
</html>
